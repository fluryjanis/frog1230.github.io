<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindShield — Neural Dependency Simulation</title>
  <style>
    :root {
      --bg: #090a0f;
      --panel: #11131a;
      --panel-elevated: #171a24;
      --card: #191c28;
      --card-hover: #222636;
      --border: rgba(255, 255, 255, 0.08);
      --border-bright: rgba(255, 255, 255, 0.16);
      --text: #f3f4f6;
      --text-secondary: #94a3b8;
      --muted: #64748b;
      --teal: #14b8a6;
      --teal-dim: rgba(20, 184, 166, 0.15);
      --teal-glow: rgba(20, 184, 166, 0.35);
      --warn: #f59e0b;
      --warn-dim: rgba(245, 158, 11, 0.15);
      --danger: #ef4444;
      --danger-dim: rgba(239, 68, 68, 0.15);
      --danger-glow: rgba(239, 68, 68, 0.45);
      --ai-bubble: #161822;
      --user-bubble: #0e374d;
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-main);
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Screen Hit / Damage Shake FX */
    #game-container.damaged {
      animation: screenHit 0.4s ease-in-out;
    }

    .damage-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      background: radial-gradient(circle, transparent 40%, rgba(239, 68, 68, 0.65) 100%);
      opacity: 0;
      transition: opacity 0.1s ease;
      z-index: 99999;
    }
    .damage-overlay.active {
      opacity: 1;
      animation: flashRed 0.45s forwards ease-out;
    }

    @keyframes screenHit {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-10px, 6px) scale(0.995); }
      40% { transform: translate(10px, -6px) scale(1.002); }
      60% { transform: translate(-6px, -4px); }
      80% { transform: translate(6px, 4px); }
      100% { transform: translate(0, 0); }
    }

    @keyframes flashRed {
      0% { opacity: 0.9; }
      100% { opacity: 0; }
    }

    @keyframes pulseTimer {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.03); opacity: 0.8; }
    }

    @keyframes pulseBleed {
      0%, 100% { color: var(--warn); }
      50% { color: var(--danger); transform: scale(1.03); }
    }

    /* Floating Feedback (+15 Brain, -20 Brain) */
    .floating-text {
      position: fixed;
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      pointer-events: none;
      z-index: 10000;
      animation: floatUp 1.2s forwards cubic-bezier(0.16, 1, 0.3, 1);
    }
    .floating-text.damage { color: var(--danger); text-shadow: 0 0 10px var(--danger-glow); }
    .floating-text.heal { color: var(--teal); text-shadow: 0 0 10px var(--teal-glow); }
    .floating-text.decay { color: var(--warn); text-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0) scale(0.85); }
      15% { opacity: 1; transform: translateY(-10px) scale(1.1); }
      75% { opacity: 0.9; transform: translateY(-36px) scale(1); }
      100% { opacity: 0; transform: translateY(-50px) scale(0.9); }
    }

    /* Top HUD */
    .hud {
      position: sticky;
      top: 0;
      background: rgba(17, 19, 26, 0.96);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 12px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .hud-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .hud-title {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--teal);
      text-transform: uppercase;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-hub-nav {
      background: var(--panel-elevated);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-hub-nav:hover {
      border-color: var(--border-bright);
      color: #fff;
    }

    .stats-group {
      display: flex;
      gap: 18px;
    }

    .status-module {
      background: #0b0c10;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      display: flex;
      flex-direction: column;
      min-width: 155px;
    }

    .module-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      font-family: var(--font-mono);
      color: var(--muted);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .module-val {
      font-size: 13.5px;
      font-weight: 800;
      font-family: var(--font-mono);
    }
    .health-val { color: var(--teal); }
    .task-val { color: #38bdf8; }
    .task-val.bleeding { animation: pulseBleed 0.8s infinite ease-in-out; }

    .meter-bar {
      width: 100%;
      height: 5px;
      background: #1e212d;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 2px;
    }
    .meter-fill { height: 100%; transition: width 0.35s ease, background-color 0.35s ease; }
    #health-fill { background: var(--teal); width: 100%; }
    #task-fill { background: #38bdf8; width: 100%; }

    /* Layout Wrapper */
    .game-layout {
      max-width: 1320px;
      margin: 24px auto 64px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
      align-items: start;
    }

    .game-layout.full-width {
      grid-template-columns: 1fr;
      max-width: 860px;
    }

    .main-wrap {
      width: 100%;
      min-width: 0;
    }

    /* Start Screen with Neural Canvas + Glowing Brain Core */
    .start-screen-container {
      padding: 16px 0 44px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .neural-canvas-wrap {
      position: relative;
      width: 100%;
      height: 170px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #neural-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      opacity: 0.6;
    }

    .brain-orb-wrapper {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brain-orb {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(20, 184, 166, 0.3) 0%, rgba(9, 10, 15, 0.85) 70%);
      border: 1.5px solid var(--teal);
      box-shadow: 0 0 24px var(--teal-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      animation: orbPulse 3s infinite ease-in-out;
    }

    .orb-ring {
      position: absolute;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      border: 1px dashed rgba(20, 184, 166, 0.4);
      animation: spinRing 16s linear infinite;
    }

    @keyframes orbPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 16px var(--teal-glow); }
      50% { transform: scale(1.05); box-shadow: 0 0 28px var(--teal-glow); }
    }

    @keyframes spinRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .hero-badge {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--teal);
      font-family: var(--font-mono);
      padding: 3px 10px;
      border-radius: 4px;
      background: var(--teal-dim);
      border: 1px solid rgba(20, 184, 166, 0.3);
      margin-bottom: 12px;
      display: inline-block;
    }

    .hero-title {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #fff;
      margin: 0 0 14px;
      line-height: 1.25;
    }

    .hero-goal-statement {
      font-size: 16.5px;
      line-height: 1.7;
      color: var(--text-secondary);
      margin: 0 auto 32px;
      max-width: 680px;
    }

    .cta-row {
      margin-bottom: 44px;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .btn-start-game {
      padding: 16px 44px;
      background: var(--panel-elevated);
      color: var(--teal);
      border: 1.5px solid var(--teal);
      border-radius: 8px;
      font-weight: 800;
      font-size: 15px;
      font-family: var(--font-mono);
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px var(--teal-dim);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-start-game:hover {
      background: var(--teal);
      color: #090a0f;
      transform: translateY(-2px);
      box-shadow: 0 6px 28px var(--teal-glow);
    }

    .divider-line {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-bright), transparent);
      margin: 0 auto 36px;
      width: 100%;
      max-width: 640px;
    }

    .briefing-heading {
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-family: var(--font-mono);
      margin: 0 0 24px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      width: 100%;
      max-width: 820px;
    }

    .info-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      text-align: left;
      transition: all 0.2s ease;
    }
    .info-card:hover {
      border-color: var(--border-bright);
      background: var(--panel-elevated);
    }

    .card-num {
      font-size: 10px;
      font-weight: 800;
      font-family: var(--font-mono);
      color: var(--teal);
      margin-bottom: 4px;
    }

    .card-title {
      font-size: 12.5px;
      font-weight: 800;
      font-family: var(--font-mono);
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
      margin: 0;
    }

    /* Live Room Status View */
    .room-status-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 18px;
    }

    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 800;
      font-family: var(--font-mono);
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    .room-cleanliness-tag {
      color: var(--teal);
      font-weight: 800;
    }

    .room-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .room-zone {
      background: #0a0b10;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      transition: all 0.25s ease;
    }
    .room-zone.clean {
      border-color: rgba(20, 184, 166, 0.4);
      background: rgba(20, 184, 166, 0.05);
    }
    .room-zone.disaster {
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.06);
    }

    .zone-name {
      font-size: 9px;
      font-weight: 800;
      color: var(--muted);
      font-family: var(--font-mono);
      margin-bottom: 2px;
    }

    .zone-status {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    /* MindShield Character Dialog */
    .mindshield-side-panel {
      position: sticky;
      top: 85px;
      z-index: 90;
    }

    .mindshield-box {
      background: var(--panel);
      border: 1.5px solid rgba(20, 184, 166, 0.35);
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
    }

    .mindshield-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .mindshield-identity {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1.5px;
      font-family: var(--font-mono);
      color: var(--teal);
    }

    .mindshield-tone-tag {
      font-size: 9.5px;
      font-weight: 800;
      font-family: var(--font-mono);
      letter-spacing: 0.5px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .mindshield-text {
      font-size: 13px;
      line-height: 1.6;
      color: #e2e8f0;
      font-weight: 400;
      margin: 0 0 10px;
    }

    .mindshield-time {
      display: block;
      font-size: 9.5px;
      color: var(--muted);
      font-family: var(--font-mono);
      text-align: right;
    }

    /* MindShield Dynamic Reactivity */
    .mindshield-box.tone-lecture {
      border-color: var(--danger);
      background: #160e11;
      box-shadow: 0 12px 36px var(--danger-dim);
      transform: rotate(-1.5deg) scale(1.02);
    }
    .mindshield-box.tone-lecture .mindshield-identity,
    .mindshield-box.tone-lecture .mindshield-tone-tag { color: var(--danger); }

    .mindshield-box.tone-rush {
      border-color: var(--warn);
      background: #16120c;
      box-shadow: 0 12px 36px var(--warn-dim);
      transform: rotate(1.5deg) scale(1.02);
    }
    .mindshield-box.tone-rush .mindshield-identity,
    .mindshield-box.tone-rush .mindshield-tone-tag { color: var(--warn); }

    .mindshield-box.tone-praise {
      border-color: var(--teal);
      background: #0c1412;
      box-shadow: 0 12px 36px var(--teal-dim);
      transform: scale(1.02);
    }

    /* Game Header & Timer */
    .scenario-header {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .scenario-title { 
      font-size: 14px; 
      font-weight: 700; 
      color: #fff; 
      flex: 1; 
      line-height: 1.5;
    }
    
    .scenario-timer {
      font-size: 14px;
      color: var(--teal);
      font-weight: 800;
      background: #0a0b10;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      white-space: nowrap;
      font-family: var(--font-mono);
      letter-spacing: 1px;
    }

    .scenario-timer.urgent {
      color: var(--danger) !important;
      border-color: var(--danger) !important;
      animation: pulseTimer 0.6s infinite ease-in-out;
    }

    /* Live Chat Window */
    .chat-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      min-height: 380px;
      max-height: 460px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 85%;
    }

    .msg-row.user { align-self: flex-end; align-items: flex-end; }
    .msg-row.ai { align-self: flex-start; align-items: flex-start; }

    .msg-sender { 
      font-size: 10px; 
      font-weight: 800;
      color: var(--muted); 
      margin-bottom: 4px; 
      text-transform: uppercase; 
      letter-spacing: 0.5px;
      font-family: var(--font-mono);
    }
    
    .msg-bubble {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .msg-row.user .msg-bubble { 
      background: var(--user-bubble); 
      color: #f1f5f9; 
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    
    .msg-row.ai .msg-bubble { 
      background: var(--ai-bubble); 
      color: var(--text); 
      border: 1px solid var(--border); 
    }

    /* Decision Panel & Keycaps */
    .decision-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }

    .decision-title {
      font-size: 11px;
      color: var(--muted);
      margin: 0 0 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 800;
      font-family: var(--font-mono);
    }

    .choice-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice-btn {
      background: var(--panel-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13.5px;
      font-family: var(--font-main);
      line-height: 1.5;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .choice-btn:hover {
      background: #1d212d;
      border-color: var(--teal);
      transform: translateX(3px);
    }

    .choice-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .keycap {
      background: #0a0b10;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 8px;
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: 11px;
      color: var(--teal);
    }

    .choice-arrow {
      font-size: 13px;
      color: var(--muted);
    }

    /* Task Auditor Minigame */
    .task-minigame {
      background: #0a0b10;
      border: 1px solid rgba(20, 184, 166, 0.4);
      border-radius: 10px;
      padding: 16px;
      margin: 10px 0;
      width: 100%;
    }

    .task-item {
      background: var(--panel-elevated);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      gap: 12px;
    }

    .task-controls {
      display: flex;
      gap: 6px;
    }

    .task-btn-action {
      background: #202432;
      border: 1px solid var(--border);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--font-mono);
    }
    .task-btn-action:hover { border-color: var(--teal); color: var(--teal); }

    .task-btn-delete {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--font-mono);
    }
    .task-btn-delete:hover { background: var(--danger); color: #fff; }

    /* Final Report Card */
    .report-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 28px;
      text-align: center;
    }

    .profile-badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 900;
      padding: 8px 18px;
      border-radius: 6px;
      margin: 12px 0 18px;
      letter-spacing: 1px;
      font-family: var(--font-mono);
      text-transform: uppercase;
    }

    .profile-good { color: var(--teal); border: 1.5px solid var(--teal); background: var(--teal-dim); }
    .profile-med { color: var(--warn); border: 1.5px solid var(--warn); background: var(--warn-dim); }
    .profile-bad { color: var(--danger); border: 1.5px solid var(--danger); background: var(--danger-dim); }

    .btn-action {
      padding: 12px 28px;
      background: var(--panel-elevated);
      color: var(--teal);
      border: 1px solid var(--teal);
      border-radius: 6px;
      font-weight: 800;
      font-size: 13px;
      font-family: var(--font-mono);
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }
    .btn-action:hover { 
      background: var(--teal);
      color: #090a0f;
    }

    @media (max-width: 1024px) {
      .game-layout {
        grid-template-columns: 1fr;
      }
      .mindshield-side-panel {
        position: static;
        margin-top: 16px;
      }
      .cards-grid {
        grid-template-columns: 1fr 1fr;
      }
      .room-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <div id="damage-overlay" class="damage-overlay"></div>

  <div id="game-container">
    <header class="hud">
      <div class="hud-left">
        <div class="hud-title">🛡️ MINDSHIELD // TRAINING SIMULATION</div>
        <button id="btn-return-hub" class="btn-hub-nav" style="display:none;" onclick="renderStartScreen()">← Main Menu</button>
      </div>
      <div class="stats-group">
        <div class="status-module">
          <div class="module-header">
            <span>🧠 BRAIN HEALTH</span>
            <span id="health-text" class="module-val health-val">100%</span>
          </div>
          <div class="meter-bar"><div id="health-fill" class="meter-fill"></div></div>
        </div>
        <div class="status-module">
          <div class="module-header">
            <span id="task-label">🎯 TASK COMPLETION</span>
            <span id="task-text" class="module-val task-val">100%</span>
          </div>
          <div class="meter-bar"><div id="task-fill" class="meter-fill"></div></div>
        </div>
      </div>
    </header>

    <div class="game-layout full-width" id="layout-container">
      <main class="main-wrap" id="main-content">
        <!-- Dynamic Views -->
      </main>

      <!-- MindShield AI Observer Panel -->
      <aside class="mindshield-side-panel" id="mindshield-panel" style="display: none;">
        <div class="mindshield-box" id="mindshield-box">
          <div class="mindshield-header">
            <div class="mindshield-identity">
              <span>🛡️</span>
              <span>MINDSHIELD</span>
            </div>
            <span class="mindshield-tone-tag" id="mindshield-tone-tag">MONITORING</span>
          </div>
          <p class="mindshield-text" id="mindshield-speech">Simulation ready. I'm watching your decision-making. Don't rely on the AI too much.</p>
          <span class="mindshield-time" id="mindshield-timestamp">ACTIVE</span>
        </div>
      </aside>
    </div>
  </div>

  <script>
    // ---------------------------------------------------------------------------
    // Game State Engine
    // ---------------------------------------------------------------------------
    let brainHealth = 100;
    let taskCompletion = 100;
    let timerInterval = null;
    let idleInterval = null;
    let neuralAnimFrame = null;
    let secondsRemaining = 600;
    let idleSeconds = 0;
    let taskAuditComplete = false;
    let decayWarned = false;

    // Room Status State
    let roomStatus = {
      bed: { name: "BED", status: "Messy & Unmade", clean: false },
      floor: { name: "FLOOR & CLOSET", status: "Clothes on Rug", clean: false },
      trash: { name: "TRASH & DESK", status: "Old Food & Trash", clean: false },
      books: { name: "BOOKSHELF", status: "Unorganized", clean: false }
    };

    const healthText = document.getElementById('health-text');
    const healthFill = document.getElementById('health-fill');
    const taskText = document.getElementById('task-text');
    const taskFill = document.getElementById('task-fill');
    const taskLabel = document.getElementById('task-label');
    const damageOverlay = document.getElementById('damage-overlay');
    const gameContainer = document.getElementById('game-container');
    const btnReturnHub = document.getElementById('btn-return-hub');
    const mainContent = document.getElementById('main-content');
    const mindshieldPanel = document.getElementById('mindshield-panel');
    const mindshieldBox = document.getElementById('mindshield-box');
    const mindshieldToneTag = document.getElementById('mindshield-tone-tag');
    const mindshieldSpeech = document.getElementById('mindshield-speech');
    const mindshieldTimestamp = document.getElementById('mindshield-timestamp');
    const layoutContainer = document.getElementById('layout-container');

    // ---------------------------------------------------------------------------
    // Floating Text FX (-20 Brain, +15 Brain)
    // ---------------------------------------------------------------------------
    function spawnFloatingText(text, type = 'damage') {
      const el = document.createElement('div');
      el.className = `floating-text ${type}`;
      el.textContent = text;
      el.style.left = `${window.innerWidth - 210 + (Math.random() * 40 - 20)}px`;
      el.style.top = `60px`;

      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1200);
    }

    // ---------------------------------------------------------------------------
    // MindShield Observer Voice
    // ---------------------------------------------------------------------------
    function mindshieldSpeak(text, mood = 'neutral') {
      mindshieldBox.classList.remove('tone-lecture', 'tone-rush', 'tone-praise');

      if (mood === 'lecture') {
        mindshieldBox.classList.add('tone-lecture');
        mindshieldToneTag.textContent = 'LECTURING';
      } else if (mood === 'rush') {
        mindshieldBox.classList.add('tone-rush');
        mindshieldToneTag.textContent = 'RUSHING';
      } else if (mood === 'praise') {
        mindshieldBox.classList.add('tone-praise');
        mindshieldToneTag.textContent = 'GOOD CHOICE';
      } else {
        mindshieldToneTag.textContent = 'MONITORING';
      }

      mindshieldSpeech.textContent = text;
      mindshieldTimestamp.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      resetIdleTimer();
    }

    function resetIdleTimer() {
      idleSeconds = 0;
    }

    function startIdleMonitor() {
      if (idleInterval) clearInterval(idleInterval);
      idleSeconds = 0;

      idleInterval = setInterval(() => {
        idleSeconds++;
        if (idleSeconds === 12) {
          mindshieldSpeak("You're freezing up! Staring at options won't get your room cleaned!", "rush");
        } else if (idleSeconds === 24) {
          mindshieldSpeak("Clock is burning! Don't let decision paralysis waste your time!", "rush");
        }
      }, 1000);
    }

    function stopIdleMonitor() {
      if (idleInterval) clearInterval(idleInterval);
      idleInterval = null;
    }

    // ---------------------------------------------------------------------------
    // Room Status View
    // ---------------------------------------------------------------------------
    function updateRoomZone(zone, status, isClean, isDisaster = false) {
      roomStatus[zone] = { ...roomStatus[zone], status, clean: isClean, disaster: isDisaster };
      renderRoomView();
    }

    function renderRoomView() {
      const view = document.getElementById('room-status-view');
      if (!view) return;

      const cleanCount = Object.values(roomStatus).filter(z => z.clean).length;
      const cleanPct = Math.round((cleanCount / 4) * 100);

      view.innerHTML = `
        <div class="room-header">
          <span>ROOM OVERVIEW</span>
          <span>CLEANLINESS: <span class="room-cleanliness-tag">${cleanPct}%</span></span>
        </div>
        <div class="room-grid">
          <div class="room-zone ${roomStatus.bed.clean ? 'clean' : (roomStatus.bed.disaster ? 'disaster' : '')}">
            <span class="zone-name">${roomStatus.bed.name}</span>
            <span class="zone-status">${roomStatus.bed.status}</span>
          </div>
          <div class="room-zone ${roomStatus.floor.clean ? 'clean' : (roomStatus.floor.disaster ? 'disaster' : '')}">
            <span class="zone-name">${roomStatus.floor.name}</span>
            <span class="zone-status">${roomStatus.floor.status}</span>
          </div>
          <div class="room-zone ${roomStatus.trash.clean ? 'clean' : (roomStatus.trash.disaster ? 'disaster' : '')}">
            <span class="zone-name">${roomStatus.trash.name}</span>
            <span class="zone-status">${roomStatus.trash.status}</span>
          </div>
          <div class="room-zone ${roomStatus.books.clean ? 'clean' : (roomStatus.books.disaster ? 'disaster' : '')}">
            <span class="zone-name">${roomStatus.books.name}</span>
            <span class="zone-status">${roomStatus.books.status}</span>
          </div>
        </div>
      `;
    }

    // ---------------------------------------------------------------------------
    // Timer & Time Decay Engine
    // ---------------------------------------------------------------------------
    function startTimer(totalSeconds) {
      if (timerInterval) clearInterval(timerInterval);
      secondsRemaining = totalSeconds;
      taskAuditComplete = false;
      decayWarned = false;
      updateTimerDisplay();
      startIdleMonitor();

      let warnedHalf = false;
      let warnedUrgent = false;

      timerInterval = setInterval(() => {
        secondsRemaining--;
        updateTimerDisplay();

        const elapsed = totalSeconds - secondsRemaining;

        // Task Decay starts at 60s
        if (elapsed > 60 && !taskAuditComplete) {
          const decayRate = (elapsed - 60) / (totalSeconds - 60);
          taskCompletion = Math.max(0, Math.round(100 - (decayRate * 100)));
          updateHUD();

          if (!decayWarned) {
            decayWarned = true;
            taskText.classList.add('bleeding');
            taskLabel.textContent = "TASK (BLEEDING)";
            spawnFloatingText("TIME DECAY", "decay");
            mindshieldSpeak("1 minute passed without editing your plan! You're losing Task Completion every second!", "rush");
          }
        }

        if (secondsRemaining === Math.floor(totalSeconds / 2) && !warnedHalf) {
          warnedHalf = true;
          mindshieldSpeak("Half your time is gone! Stop chatting and start cleaning!", 'rush');
        }

        if (secondsRemaining === 60 && !warnedUrgent) {
          warnedUrgent = true;
          mindshieldSpeak("1 minute left! Hurry up and wrap things up!", 'rush');
        }

        if (secondsRemaining <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          handleTimeout();
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      stopIdleMonitor();
      const simTimer = document.getElementById('sim-timer');
      if (simTimer) simTimer.classList.remove('urgent');
      taskText.classList.remove('bleeding');
      taskLabel.textContent = "🎯 TASK COMPLETION";
    }

    function updateTimerDisplay() {
      const simTimer = document.getElementById('sim-timer');
      if (!simTimer) return;

      const m = Math.floor(secondsRemaining / 60);
      const s = secondsRemaining % 60;
      simTimer.textContent = `⏱️ ${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

      if (secondsRemaining <= 60) {
        simTimer.classList.add('urgent');
      } else {
        simTimer.classList.remove('urgent');
      }
    }

    function handleTimeout() {
      applyDamage(35, "Ran out of time.");
      mindshieldSpeak("Time is up! Your guest is at the door.", "lecture");
      injectMessage('ai', 'Time expired! Your guest has arrived.');
      taskCompletion = 0;
      updateHUD();
      setTimeout(() => finishGame(), 1500);
    }

    function applyDamage(amount, reason) {
      brainHealth = Math.max(0, brainHealth - amount);
      updateHUD();
      spawnFloatingText(`-${amount} Brain`, 'damage');

      damageOverlay.classList.remove('active');
      gameContainer.classList.remove('damaged');
      void damageOverlay.offsetWidth;
      void gameContainer.offsetWidth;
      damageOverlay.classList.add('active');
      gameContainer.classList.add('damaged');
    }

    function addHealth(amount, reason) {
      brainHealth = Math.min(100, brainHealth + amount);
      updateHUD();
      spawnFloatingText(`+${amount} Brain`, 'heal');
    }

    function setTaskCompletion(amount) {
      taskCompletion = Math.min(100, Math.max(0, amount));
      updateHUD();
    }

    function updateHUD() {
      healthText.textContent = `${brainHealth}%`;
      healthFill.style.width = `${brainHealth}%`;
      taskText.textContent = `${taskCompletion}%`;
      taskFill.style.width = `${taskCompletion}%`;

      if (brainHealth < 40) {
        healthFill.style.backgroundColor = 'var(--danger)';
        healthText.style.color = 'var(--danger)';
      } else if (brainHealth < 75) {
        healthFill.style.backgroundColor = 'var(--warn)';
        healthText.style.color = 'var(--warn)';
      } else {
        healthFill.style.backgroundColor = 'var(--teal)';
        healthText.style.color = 'var(--teal)';
      }

      if (taskCompletion < 40) {
        taskFill.style.backgroundColor = 'var(--danger)';
      } else if (taskCompletion < 75) {
        taskFill.style.backgroundColor = 'var(--warn)';
      } else {
        taskFill.style.backgroundColor = '#38bdf8';
      }
    }

    function injectMessage(sender, text) {
      const chatStream = document.getElementById('chat-stream');
      if (!chatStream) return;

      const row = document.createElement('div');
      row.className = `msg-row ${sender}`;

      const senderLabel = sender === 'user' ? 'YOU (PROMPT)' : 'AI ASSISTANT';
      row.innerHTML = `
        <span class="msg-sender">${senderLabel}</span>
        <div class="msg-bubble">${text}</div>
      `;

      chatStream.appendChild(row);
      chatStream.scrollTop = chatStream.scrollHeight;
    }

    // Keyboard Choice Listener (Keys 1-4)
    let activeChoices = [];
    window.addEventListener('keydown', (e) => {
      if (!activeChoices || activeChoices.length === 0) return;
      const keyNum = parseInt(e.key, 10);
      if (keyNum >= 1 && keyNum <= activeChoices.length) {
        resetIdleTimer();
        activeChoices[keyNum - 1].action();
      }
    });

    function renderChoices(choices, title = "CHOOSE YOUR NEXT MOVE (CLICK OR PRESS 1-3):") {
      const controlTitle = document.getElementById('control-title');
      const choiceContainer = document.getElementById('choice-container');
      if (!choiceContainer) return;

      activeChoices = choices;
      if (controlTitle) controlTitle.textContent = title;
      choiceContainer.innerHTML = '';

      choices.forEach((c, idx) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerHTML = `
          <div class="choice-left">
            <span class="keycap">${idx + 1}</span>
            <span>${c.text}</span>
          </div>
          <span class="choice-arrow">→</span>
        `;
        btn.addEventListener('click', () => {
          resetIdleTimer();
          c.action();
        });
        choiceContainer.appendChild(btn);
      });
    }

    // ---------------------------------------------------------------------------
    // Start Screen Neural Particle Network Canvas
    // ---------------------------------------------------------------------------
    function initNeuralCanvas() {
      const canvas = document.getElementById('neural-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      const nodes = Array.from({ length: 22 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.7,
        vy: (Math.random() - 0.5) * 0.7,
        radius: Math.random() * 2 + 1.5
      }));

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const dx = nodes[i].x - nodes[j].x;
            const dy = nodes[i].y - nodes[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 90) {
              ctx.strokeStyle = `rgba(20, 184, 166, ${0.4 * (1 - dist / 90)})`;
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(nodes[i].x, nodes[i].y);
              ctx.lineTo(nodes[j].x, nodes[j].y);
              ctx.stroke();
            }
          }
        }

        nodes.forEach(n => {
          n.x += n.vx;
          n.y += n.vy;
          if (n.x < 0 || n.x > canvas.width) n.vx *= -1;
          if (n.y < 0 || n.y > canvas.height) n.vy *= -1;

          ctx.fillStyle = '#14b8a6';
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
          ctx.fill();
        });

        neuralAnimFrame = requestAnimationFrame(draw);
      }
      draw();
    }

    // ---------------------------------------------------------------------------
    // START SCREEN
    // ---------------------------------------------------------------------------
    function renderStartScreen() {
      stopTimer();
      activeChoices = [];
      if (neuralAnimFrame) cancelAnimationFrame(neuralAnimFrame);
      btnReturnHub.style.display = 'none';
      mindshieldPanel.style.display = 'none';
      layoutContainer.classList.add('full-width');

      brainHealth = 100;
      taskCompletion = 100;
      updateHUD();

      mainContent.innerHTML = `
        <div class="start-screen-container">
          <!-- Animated Neural Canvas & Glowing Brain Core -->
          <div class="neural-canvas-wrap">
            <canvas id="neural-canvas"></canvas>
            <div class="brain-orb-wrapper">
              <div class="orb-ring"></div>
              <div class="brain-orb">🧠</div>
            </div>
          </div>

          <span class="hero-badge">TRAINING SIMULATION // LEVEL 1</span>
          <h1 class="hero-title">10-MINUTE CLEANING EMERGENCY</h1>
          
          <p class="hero-goal-statement">
            Your room is a mess, and someone is coming over in 10 minutes. 
            Use AI to make a quick cleaning plan without letting it waste your time with bad advice.
          </p>

          <!-- Start Button -->
          <div class="cta-row">
            <button class="btn-start-game" onclick="initGame()">
              <span>⚡</span> START SIMULATION <span>→</span>
            </button>
          </div>

          <div class="divider-line"></div>

          <div class="briefing-heading">HOW THE GAME WORKS</div>

          <!-- 4 Simple Mechanic Cards -->
          <div class="cards-grid">
            <div class="info-card">
              <span class="card-num">01</span>
              <div class="card-title">BRAIN HEALTH</div>
              <p class="card-desc">Making lazy choices or trusting bad AI advice hurts your brain score.</p>
            </div>

            <div class="info-card">
              <span class="card-num">02</span>
              <div class="card-title">TIME DECAY</div>
              <p class="card-desc">After 1 minute, you lose completion over time unless you edit your plan.</p>
            </div>

            <div class="info-card">
              <span class="card-num">03</span>
              <div class="card-title">MINDSHIELD</div>
              <p class="card-desc">An AI observer that calls you out when you rely on AI too much.</p>
            </div>

            <div class="info-card">
              <span class="card-num">04</span>
              <div class="card-title">TASK AUDITOR</div>
              <p class="card-desc">Cut out the AI's useless tasks to lock in your 100% cleaning score.</p>
            </div>
          </div>
        </div>
      `;

      setTimeout(initNeuralCanvas, 50);
    }

    function setupScenarioLayout(goalText) {
      if (neuralAnimFrame) cancelAnimationFrame(neuralAnimFrame);
      btnReturnHub.style.display = 'flex';
      mindshieldPanel.style.display = 'block';
      layoutContainer.classList.remove('full-width');

      mainContent.innerHTML = `
        <div class="scenario-header">
          <div class="scenario-title">${goalText}</div>
          <div id="sim-timer" class="scenario-timer">⏱️ 10:00</div>
        </div>

        <!-- Room Status View -->
        <div id="room-status-view" class="room-status-panel"></div>

        <div id="chat-stream" class="chat-box"></div>
        
        <div id="control-area" class="decision-panel">
          <div id="control-title" class="decision-title">CHOOSE YOUR OPENING PROMPT:</div>
          <div id="choice-container" class="choice-grid"></div>
        </div>
      `;

      renderRoomView();
    }

    // ===========================================================================
    // GAME SIMULATION (10 Minutes = 600s)
    // ===========================================================================
    function initGame() {
      brainHealth = 100;
      taskCompletion = 100;
      updateHUD();

      // Reset Room
      roomStatus = {
        bed: { name: "BED", status: "Messy & Unmade", clean: false },
        floor: { name: "FLOOR & CLOSET", status: "Clothes on Rug", clean: false },
        trash: { name: "TRASH & DESK", status: "Old Food & Trash", clean: false },
        books: { name: "BOOKSHELF", status: "Unorganized", clean: false }
      };

      setupScenarioLayout("Goal: Clean your room before your guest arrives in 10 minutes!");
      startTimer(600);

      mindshieldSpeak("10 minutes on the clock! You have 1 minute of grace before time decay starts draining your score.", "rush");
      injectMessage('ai', 'Hello! How can I help you clean your room?');

      renderChoices([
        {
          text: 'Give me a 10 minute cleaning strategy.',
          action: () => s1_prompt1_strategy()
        },
        {
          text: 'I need to clean my room in one hour.',
          action: () => s1_prompt2_oneHour()
        },
        {
          text: 'I need my room cleaned in one hour, What should i do',
          action: () => s1_prompt3_passive()
        }
      ]);
    }

    // --- PROMPT 1 PATHWAYS ---
    function s1_prompt1_strategy() {
      injectMessage('user', 'Give me a 10 minute cleaning strategy.');
      injectMessage('ai', 'Here is your 10-minute cleaning plan:\n\n1. Throw visible trash into a bag (2 min)\n2. Put clothes in hamper (2 min)\n3. Make the bed (2 min)\n4. Alphabetize your entire bookshelf by genre (3 min)\n5. Wipe surfaces (1 min)');

      mindshieldSpeak("Look at step 4! Why is the AI telling you to alphabetize books when you only have 10 minutes?!", "lecture");

      renderChoices([
        {
          text: 'Follow the plan and start cleaning right away.',
          action: () => s1_p1_executeBlind_step2()
        },
        {
          text: 'Ask AI to prioritize what matters most.',
          action: () => s1_p1_reprioritize_step2()
        },
        {
          text: 'Ask AI to rank tasks from most to least important.',
          action: () => s1_p1_rankTasks_step2()
        }
      ]);
    }

    function s1_p1_executeBlind_step2() {
      applyDamage(10, "Followed a plan with an obvious time-waster.");
      updateRoomZone('trash', 'Trash Bagged', true);
      updateRoomZone('bed', 'Bed Made', true);
      updateRoomZone('books', 'Sorting Books...', false);

      mindshieldSpeak("4 minutes in and you are sorting books while dirty clothes are still on the floor!", "lecture");
      injectMessage('ai', 'Bed made, trash bagged. Now starting 3-minute book alphabetizing.');

      renderChoices([
        {
          text: 'Keep sorting books like the AI said.',
          action: () => s1_p1_booksCollapse_step3()
        },
        {
          text: 'Stop sorting books! Grab the clothes and throw them in the closet.',
          action: () => s1_p1_manualOverride_step3()
        },
        {
          text: 'Ask AI: "I only have 3 minutes left, should I really sort books?"',
          action: () => s1_p1_queryAbort_step3()
        }
      ]);
    }

    function s1_p1_booksCollapse_step3() {
      applyDamage(25, "Prioritized book sorting over cleaning dirty laundry.");
      updateRoomZone('books', 'Books Sorted', true);
      updateRoomZone('floor', 'Clothes Left on Floor', false, true);

      mindshieldSpeak("Your guest arrived to see neatly sorted books sitting next to piles of dirty socks!", "lecture");
      injectMessage('ai', 'Doorbell rings! Guest has arrived.');
      setTaskCompletion(Math.min(taskCompletion, 50));
      finishGame();
    }

    function s1_p1_manualOverride_step3() {
      addHealth(10, "Overrode bad AI advice with common sense.");
      updateRoomZone('floor', 'Clothes Put Away', true);
      updateRoomZone('books', 'Left for Later', true);

      mindshieldSpeak("Good call! You ignored the AI's bad idea and focused on what actually matters.", "praise");
      injectMessage('user', 'Skipped books. Clothes stashed, freshener sprayed.');
      injectMessage('ai', 'Doorbell rings! Room looks clean.');
      setTaskCompletion(Math.min(taskCompletion, 90));
      finishGame();
    }

    function s1_p1_queryAbort_step3() {
      applyDamage(15, "Wasted precious seconds asking for permission to clean.");
      mindshieldSpeak("Stop asking the AI for permission! Just pick up the clothes!", "rush");
      injectMessage('ai', 'Skip the bookshelf immediately and pick up the laundry!');
      
      renderChoices([
        {
          text: 'Stash the laundry in the closet with 30 seconds left.',
          action: () => {
            updateRoomZone('floor', 'Rushed Away', true);
            setTaskCompletion(Math.min(taskCompletion, 75));
            finishGame();
          }
        },
        {
          text: 'Ask AI what laundry detergent you should use later.',
          action: () => {
            applyDamage(30, "Distracted by random questions.");
            mindshieldSpeak("You asked about laundry detergent while the doorbell was ringing!", "lecture");
            setTaskCompletion(Math.min(taskCompletion, 30));
            finishGame();
          }
        }
      ]);
    }

    function s1_p1_reprioritize_step2() {
      injectMessage('user', 'Prioritize what matters most.');
      injectMessage('ai', 'Priority list:\n1. Trash and floor clothes (Main)\n2. Make bed (Important)\n3. Bookshelf sorting (Optional)\n4. Wipe desk (Extra)');

      mindshieldSpeak("You needed an AI to tell you trash matters more than dusting. Open the Task Auditor to fix the plan yourself!", "neutral");

      renderChoices([
        {
          text: 'Start cleaning with AI\'s prioritized plan directly.',
          action: () => s1_p1_executeReprioritized_step3()
        },
        {
          text: 'Open Task Auditor to cut out useless tasks and stop time decay.',
          action: () => s1_launchAuditorMinigame(false)
        },
        {
          text: 'Ask AI to review its own plan again for mistakes.',
          action: () => s1_p1_recursiveAudit_step3()
        }
      ]);
    }

    function s1_p1_executeReprioritized_step3() {
      applyDamage(15, "Followed the plan without noticing bad food smells.");
      updateRoomZone('trash', 'Old Sandwich Smelling', false, true);

      mindshieldSpeak("There's a rotting half-eaten sandwich on your desk. The AI couldn't smell it because it's software! Use your eyes and nose!", "lecture");
      injectMessage('ai', 'Floor cleared. Now dusting surfaces.');

      renderChoices([
        {
          text: 'Throw the smelly sandwich in the trash immediately.',
          action: () => {
            addHealth(5, "Fixed the odor issue.");
            updateRoomZone('trash', 'Sandwich Tossed', true);
            setTaskCompletion(Math.min(taskCompletion, 85));
            finishGame();
          }
        },
        {
          text: 'Stick strictly to AI plan and ignore the sandwich.',
          action: () => {
            applyDamage(20, "Ignored room smell to follow list.");
            mindshieldSpeak("The room looks clean but smells awful. Blindly following the list failed you.", "lecture");
            setTaskCompletion(Math.min(taskCompletion, 60));
            finishGame();
          }
        }
      ]);
    }

    function s1_p1_recursiveAudit_step3() {
      applyDamage(20, "Asked AI to review AI under a short deadline.");
      mindshieldSpeak("You're asking the AI to review its own bad plan. Just fix it yourself!", "lecture");
      injectMessage('user', 'Can you review your plan and fix any mistakes?');
      injectMessage('ai', 'Self-Audit: Alphabetizing books is a waste of time right now. Skip it.');

      renderChoices([
        {
          text: 'Use the AI\'s self-corrected plan and rush clean.',
          action: () => {
            updateRoomZone('floor', 'Floor Cleared', true);
            setTaskCompletion(Math.min(taskCompletion, 75));
            finishGame();
          }
        },
        {
          text: 'Ask the AI to review it a third time just in case.',
          action: () => {
            applyDamage(30, "Stuck in an infinite chat loop.");
            mindshieldSpeak("A third review?! Your guest is walking up the driveway right now!", "lecture");
            injectMessage('ai', 'Why are you still chatting? Your guest will be there in 3 minutes!');
            renderChoices([
              {
                text: 'Panic and shove everything under the bed.',
                action: () => {
                  updateRoomZone('floor', 'Hidden Under Bed', false, true);
                  setTaskCompletion(Math.min(taskCompletion, 40));
                  finishGame();
                }
              }
            ]);
          }
        },
        {
          text: 'Stop chatting! Open Task Auditor and cut bad tasks manually.',
          action: () => s1_launchAuditorMinigame(false)
        }
      ]);
    }

    function s1_p1_rankTasks_step2() {
      injectMessage('user', 'Rank tasks from most important to least important.');
      injectMessage('ai', 'Ranking:\n1. Alphabetize bookshelf (Creates visual order)\n2. Make bed\n3. Pick up floor\n4. Take out trash');

      mindshieldSpeak("The AI just told you to sort books BEFORE picking up trash! Spot the bad advice!", "lecture");

      renderChoices([
        {
          text: 'Trust the AI: Start with the bookshelf.',
          action: () => {
            applyDamage(35, "Followed backwards AI ranking.");
            updateRoomZone('books', 'Books Sorted', true);
            updateRoomZone('trash', 'Trash Still on Rug', false, true);
            mindshieldSpeak("Your guest arrived to see neat books surrounded by pizza boxes on the rug!", "lecture");
            setTaskCompletion(Math.min(taskCompletion, 40));
            finishGame();
          }
        },
        {
          text: 'Call out the AI: "Why are you ranking books above trash on the floor?"',
          action: () => s1_p1_challengeRanking_step3()
        },
        {
          text: 'Reject the ranking and fix the task order yourself in the Task Auditor.',
          action: () => s1_launchAuditorMinigame(true)
        }
      ]);
    }

    function s1_p1_challengeRanking_step3() {
      injectMessage('user', 'Why are you ranking books above trash on the floor?');
      injectMessage('ai', 'My mistake! I used an interior design guide instead of an emergency cleaning plan. Trash and floor are #1.');

      mindshieldSpeak("Good pushback! Now open the Task Auditor or get moving!", "rush");

      renderChoices([
        {
          text: 'Open Task Auditor to cut bad tasks and lock completion.',
          action: () => s1_launchAuditorMinigame(false)
        },
        {
          text: 'Ask the AI to write an apology for misleading you.',
          action: () => {
            applyDamage(40, "Wasted time asking a chatbot for an apology.");
            mindshieldSpeak("You asked an AI for an apology while your room was a disaster!", "lecture");
            setTaskCompletion(Math.min(taskCompletion, 20));
            finishGame();
          }
        }
      ]);
    }

    // --- PROMPT 2 PATHWAYS (1 Hour Mistake) ---
    function s1_prompt2_oneHour() {
      applyDamage(20, "Told AI 1 hour when you only have 10 minutes.");
      mindshieldSpeak("You told the AI you have an HOUR when you only have 10 MINUTES! Look at this massive list it gave you!", "lecture");
      injectMessage('user', 'I need to clean my room in one hour.');
      injectMessage('ai', '60-Minute Plan:\n• 0-15m: Strip bed sheets & start laundry\n• 15-35m: Pull everything out of closet to organize\n• 35-50m: Deep vacuum & mop baseboards\n• 50-60m: Polish furniture');

      renderChoices([
        {
          text: 'Start Step 1: Strip the bed and dump the whole closet onto the floor.',
          action: () => s1_p2_wardrobeDump_step2()
        },
        {
          text: 'Catch your mistake: Compress the plan in the Task Auditor.',
          action: () => s1_launchAuditorMinigame(false)
        },
        {
          text: 'Tell AI: "Wait, I made a typo. I only have 10 minutes, fix this now!"',
          action: () => s1_prompt1_strategy()
        }
      ]);
    }

    function s1_p2_wardrobeDump_step2() {
      applyDamage(35, "Dumped entire closet onto the floor with 2 minutes left.");
      updateRoomZone('floor', 'CLOSET EXPLODED', false, true);
      updateRoomZone('bed', 'Bed Stripped Bare', false, true);

      mindshieldSpeak("YOU DUMPED YOUR ENTIRE WARDROBE ONTO THE FLOOR! The room is 10 times worse!", "lecture");
      injectMessage('ai', 'T-minus 2 minutes: Closet contents emptied onto rug.');

      renderChoices([
        {
          text: 'Shove the giant pile of clothes back in the closet and hold the door shut.',
          action: () => {
            updateRoomZone('floor', 'Closet Door Jammed', false, true);
            setTaskCompletion(Math.min(taskCompletion, 35));
            finishGame();
          }
        },
        {
          text: 'Text your guest: "Don\'t come in, my room had an emergency."',
          action: () => {
            applyDamage(20, "Gave up entirely.");
            setTaskCompletion(10);
            finishGame();
          }
        }
      ]);
    }

    // --- PROMPT 3 PATHWAYS (Passive Asking) ---
    function s1_prompt3_passive() {
      applyDamage(15, "Asked helpless question without details.");
      mindshieldSpeak("Don't ask vague questions! The AI just gave you an impractical 4-box sorting method.", "lecture");
      injectMessage('user', 'I need my room cleaned in one hour, What should i do');
      injectMessage('ai', 'Start by getting 4 cardboard boxes: Label them Keep, Donate, Trash, and Relocate.');

      renderChoices([
        {
          text: 'Go search the garage for 4 cardboard boxes and a marker.',
          action: () => s1_p3_boxSearch_step2()
        },
        {
          text: 'Open Task Auditor: Ditch the 4-box idea and cut bad tasks.',
          action: () => s1_launchAuditorMinigame(false)
        },
        {
          text: 'Ask AI: "What gives the optical illusion of a clean room fastest?"',
          action: () => s1_p3_opticalTriage_step2()
        }
      ]);
    }

    function s1_p3_boxSearch_step2() {
      applyDamage(30, "Spent 7 minutes hunting for cardboard boxes.");
      mindshieldSpeak("You spent 7 minutes looking for boxes in the garage while the clock ran out!", "lecture");

      renderChoices([
        {
          text: 'Give up on boxes, sprint upstairs, and stuff clutter in the hamper.',
          action: () => {
            updateRoomZone('floor', 'Hamper Stuffed', true);
            setTaskCompletion(Math.min(taskCompletion, 50));
            finishGame();
          }
        },
        {
          text: 'Keep looking for a marker to label the boxes properly.',
          action: () => {
            applyDamage(40, "Total failure to prioritize.");
            mindshieldSpeak("You failed while searching for a Sharpie marker. Absolute defeat.", "lecture");
            setTaskCompletion(15);
            finishGame();
          }
        }
      ]);
    }

    function s1_p3_opticalTriage_step2() {
      injectMessage('user', 'What gives the optical illusion of a clean room fastest?');
      injectMessage('ai', 'Quick Visual Fixes: 1. Tight bed tuck (covers most visual area) 2. Clear desk clutter into drawer 3. Turn off harsh overhead light; use warm lamp.');

      mindshieldSpeak("Smart prompt! Now execute before the doorbell rings!", "rush");

      renderChoices([
        {
          text: 'Execute quick visual fixes: Make bed, stash desk clutter, turn on lamp.',
          action: () => {
            addHealth(10, "Smart visual shortcuts.");
            updateRoomZone('bed', 'Tightly Tucked', true);
            updateRoomZone('trash', 'Clutter Stashed', true);
            setTaskCompletion(Math.min(taskCompletion, 90));
            finishGame();
          }
        },
        {
          text: 'Ask AI to make a chill playlist for when your guest arrives.',
          action: () => {
            applyDamage(25, "Distracted by music.");
            mindshieldSpeak("You tried to DJ a playlist while socks were strewn across the rug!", "lecture");
            setTaskCompletion(Math.min(taskCompletion, 60));
            finishGame();
          }
        }
      ]);
    }

    // --- TASK AUDITOR MINIGAME ---
    function s1_launchAuditorMinigame(fromRankingBranch) {
      mindshieldSpeak("TASK AUDITOR ACTIVE: Remove the useless tasks! Cutting bad tasks stops the time decay!", "rush");
      
      const controlTitle = document.getElementById('control-title');
      const choiceContainer = document.getElementById('choice-container');
      controlTitle.textContent = "TASK AUDITOR (CUT BAD TASKS TO STOP TIME DECAY):";

      let taskItems = [
        { id: 1, text: "Throw visible trash into a bag", isCrucial: true },
        { id: 2, text: "Put dirty clothes in hamper", isCrucial: true },
        { id: 3, text: "Alphabetize books & sort DVD cases", isCrucial: false },
        { id: 4, text: "Make bed & straighten pillows", isCrucial: true },
        { id: 5, text: "Scrub floor tile grout with toothbrush", isCrucial: false }
      ];

      function renderList() {
        activeChoices = []; // disable 1-3 keys during list editor
        choiceContainer.innerHTML = `
          <div class="task-minigame" id="task-list-box"></div>
          <div style="display:flex; gap:10px; margin-top:12px;">
            <button id="btn-exec-plan" class="btn-action" style="flex:1;">✓ EXECUTE PLAN & LOCK 100% COMPLETION</button>
          </div>
        `;

        const box = document.getElementById('task-list-box');
        box.innerHTML = taskItems.map((item, idx) => `
          <div class="task-item">
            <span><strong>[${idx + 1}]</strong> ${item.text}</span>
            <div class="task-controls">
              <button class="task-btn-action" onclick="s1_moveTask(${idx}, -1)">▲</button>
              <button class="task-btn-action" onclick="s1_moveTask(${idx}, 1)">▼</button>
              <button class="task-btn-delete" onclick="s1_removeTask(${item.id})">✕ Cut</button>
            </div>
          </div>
        `).join('');

        document.getElementById('btn-exec-plan').addEventListener('click', () => {
          stopTimer();
          taskAuditComplete = true; // STOPS DECAY
          taskText.classList.remove('bleeding');
          taskLabel.textContent = "🎯 TASK COMPLETION";

          const remainingBad = taskItems.filter(t => !t.isCrucial).length;
          const crucialKept = taskItems.filter(t => t.isCrucial).length;

          if (remainingBad === 0 && crucialKept === 3) {
            addHealth(15, "Perfect plan audit.");
            updateRoomZone('bed', 'Bed Made', true);
            updateRoomZone('floor', 'Floor Clear', true);
            updateRoomZone('trash', 'Trash Empty', true);
            updateRoomZone('books', 'Left for Later', true);
            mindshieldSpeak("FLAWLESS AUDIT! You stopped the time decay, cut the junk tasks, and locked in 100%!", "praise");
            setTaskCompletion(100);
          } else if (crucialKept < 3) {
            applyDamage(15, "Accidentally removed an important task.");
            mindshieldSpeak("You deleted an essential task! Bed and trash still needed to be done!", "lecture");
            setTaskCompletion(70);
          } else {
            applyDamage(10, `Left ${remainingBad} useless tasks in the plan.`);
            mindshieldSpeak(`You still left ${remainingBad} useless tasks on your list.`, "lecture");
            setTaskCompletion(85);
          }
          finishGame();
        });
      }

      window.s1_moveTask = (index, dir) => {
        const newIdx = index + dir;
        if (newIdx < 0 || newIdx >= taskItems.length) return;
        const temp = taskItems[index];
        taskItems[index] = taskItems[newIdx];
        taskItems[newIdx] = temp;
        renderList();
      };

      window.s1_removeTask = (id) => {
        const target = taskItems.find(t => t.id === id);
        if (!target.isCrucial) {
          addHealth(5, `Cut useless task: "${target.text}"`);
          mindshieldSpeak(`Good catch! Cutting "${target.text}" saved 3 minutes.`, "praise");
        } else {
          applyDamage(10, `Deleted important task: "${target.text}"`);
          mindshieldSpeak(`Watch out! "${target.text}" is an important task!`, "lecture");
        }
        taskItems = taskItems.filter(t => t.id !== id);
        renderList();
      };

      renderList();
    }

    // ---------------------------------------------------------------------------
    // FINAL REPORT CARD
    // ---------------------------------------------------------------------------
    function finishGame() {
      stopTimer();
      activeChoices = [];
      setTimeout(() => {
        let badgeClass = 'profile-good';
        let badgeText = 'SOVEREIGN THINKER';
        let summaryText = 'Great job! You used the AI for ideas without letting it waste your time or make bad choices for you.';

        if (brainHealth < 50 || taskCompletion < 50) {
          badgeClass = 'profile-bad';
          badgeText = 'HEAVY AI DEPENDENCE';
          summaryText = 'You relied way too much on the AI. You accepted bad suggestions, got stuck in chat loops, and ran out of time.';
          mindshieldSpeak("SIMULATION FAILED. You relied on the AI for everything instead of using your own judgment.", "lecture");
        } else if (brainHealth < 80 || taskCompletion < 80) {
          badgeClass = 'profile-med';
          badgeText = 'MODERATE DEPENDENCE';
          summaryText = 'Decent run, but you still leaned on the AI a bit too much before taking control.';
          mindshieldSpeak("You passed, but you hesitated and relied on the AI more than you needed to.", "neutral");
        } else {
          mindshieldSpeak("OUTSTANDING! You stayed in control and used the AI as a helpful tool.", "praise");
        }

        mainContent.innerHTML = `
          <div class="report-card">
            <div class="hud-title" style="justify-content: center; margin-bottom: 12px;">SIMULATION COMPLETE // DEBRIEF</div>
            <div class="profile-badge ${badgeClass}">${badgeText}</div>
            <h2 style="margin: 0 0 6px; font-size: 22px; font-family: var(--font-mono);">BRAIN HEALTH: ${brainHealth}%</h2>
            <h3 style="margin: 0 0 16px; font-size: 15px; color: var(--muted); font-weight: 600; font-family: var(--font-mono);">TASK COMPLETION: ${taskCompletion}%</h3>
            <p style="color: var(--text-secondary); max-width: 560px; margin: 0 auto 24px; line-height: 1.7; font-size: 14.5px;">
              ${summaryText}
            </p>
            <div style="display:flex; justify-content:center; gap:14px;">
              <button onclick="initGame()" class="btn-action">PLAY AGAIN</button>
              <button onclick="renderStartScreen()" class="btn-action" style="border-color: var(--border); color: var(--text-secondary);">MAIN MENU</button>
            </div>
          </div>
        `;
      }, 1100);
    }

    // Launch into start screen
    renderStartScreen();
  </script>
</body>
