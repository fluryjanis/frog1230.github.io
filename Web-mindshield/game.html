<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindShield — Cognitive Assessment Protocol</title>
  <style>
    :root {
      --bg: #0a0b0e;
      --panel: #111319;
      --panel-elevated: #161922;
      --card: #181b26;
      --card-hover: #202433;
      --border: rgba(255, 255, 255, 0.08);
      --border-bright: rgba(255, 255, 255, 0.16);
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --muted: #64748b;
      --teal: #14b8a6;
      --teal-dim: rgba(20, 184, 166, 0.15);
      --teal-glow: rgba(20, 184, 166, 0.35);
      --warn: #f59e0b;
      --warn-dim: rgba(245, 158, 11, 0.15);
      --strain: #ef4444;
      --strain-dim: rgba(239, 68, 68, 0.15);
      --strain-glow: rgba(239, 68, 68, 0.45);
      --ai-bubble: #171a24;
      --user-bubble: #0f2b38;
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-main);
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Screen Strain / Layout Distortion FX */
    #game-container.strained {
      animation: screenStrain 0.4s ease-in-out;
    }

    .strain-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      background: radial-gradient(circle, transparent 40%, rgba(239, 68, 68, 0.6) 100%);
      opacity: 0;
      transition: opacity 0.1s ease;
      z-index: 99999;
    }
    .strain-overlay.active {
      opacity: 1;
      animation: flashStrain 0.45s forwards ease-out;
    }

    @keyframes screenStrain {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-8px, 6px) scale(0.995); }
      40% { transform: translate(8px, -6px) scale(1.002); }
      60% { transform: translate(-6px, -4px); }
      80% { transform: translate(6px, 4px); }
      100% { transform: translate(0, 0); }
    }

    @keyframes flashStrain {
      0% { opacity: 0.9; }
      100% { opacity: 0; }
    }

    @keyframes pulseTimer {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.03); opacity: 0.8; }
    }

    @keyframes pulseBleed {
      0%, 100% { color: var(--warn); }
      50% { color: var(--strain); transform: scale(1.03); }
    }

    /* Floating Diagnostic Feedback (-20 STABILITY, etc.) */
    .floating-metric {
      position: fixed;
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      pointer-events: none;
      z-index: 10000;
      animation: floatMetric 1.3s forwards cubic-bezier(0.16, 1, 0.3, 1);
    }
    .floating-metric.strain { color: var(--strain); text-shadow: 0 0 10px var(--strain-glow); }
    .floating-metric.recovery { color: var(--teal); text-shadow: 0 0 10px var(--teal-glow); }
    .floating-metric.decay { color: var(--warn); text-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }

    @keyframes floatMetric {
      0% { opacity: 0; transform: translateY(0) scale(0.85); }
      15% { opacity: 1; transform: translateY(-10px) scale(1.1); }
      75% { opacity: 0.9; transform: translateY(-38px) scale(1); }
      100% { opacity: 0; transform: translateY(-55px) scale(0.9); }
    }

    /* Clinical Top Instrument Bar */
    .hud {
      position: sticky;
      top: 0;
      background: rgba(17, 19, 25, 0.96);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 12px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .hud-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .hud-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--teal);
      text-transform: uppercase;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-hub-nav {
      background: var(--panel-elevated);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.5px;
    }
    .btn-hub-nav:hover {
      border-color: var(--border-bright);
      color: #fff;
    }

    .stats-group {
      display: flex;
      gap: 20px;
    }

    /* Modular Clinical Status Tiles */
    .status-module {
      background: #0d0e14;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      display: flex;
      flex-direction: column;
      min-width: 165px;
    }

    .module-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      font-family: var(--font-mono);
      color: var(--muted);
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }

    .module-val {
      font-size: 13.5px;
      font-weight: 800;
      font-family: var(--font-mono);
    }
    .stability-val { color: var(--teal); }
    .task-val { color: #38bdf8; }
    .task-val.bleeding { animation: pulseBleed 0.8s infinite ease-in-out; }

    .meter-bar {
      width: 100%;
      height: 4px;
      background: #1c1f2b;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 3px;
    }
    .meter-fill { height: 100%; transition: width 0.35s ease, background-color 0.35s ease; }
    #stability-fill { background: var(--teal); width: 100%; }
    #task-fill { background: #38bdf8; width: 100%; }

    /* Layout Wrapper */
    .game-layout {
      max-width: 1320px;
      margin: 28px auto 64px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
      align-items: start;
    }

    .game-layout.full-width {
      grid-template-columns: 1fr;
      max-width: 860px;
    }

    .main-wrap {
      width: 100%;
      min-width: 0;
    }

    /* Start Screen Clinical Presentation */
    .start-screen-container {
      padding: 24px 0 48px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .calibration-graphic-wrap {
      margin-bottom: 24px;
      position: relative;
      width: 130px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .calibration-svg {
      width: 100%;
      height: 100%;
    }

    .hero-badge {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--teal);
      font-family: var(--font-mono);
      padding: 3px 10px;
      border-radius: 4px;
      background: var(--teal-dim);
      border: 1px solid rgba(20, 184, 166, 0.3);
      margin-bottom: 14px;
      display: inline-block;
    }

    .hero-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
      margin: 0 0 16px;
      line-height: 1.25;
    }

    .hero-goal-statement {
      font-size: 16px;
      line-height: 1.7;
      color: var(--text-secondary);
      margin: 0 auto 36px;
      max-width: 680px;
    }

    .cta-row {
      margin-bottom: 48px;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .btn-initiate-trial {
      padding: 16px 44px;
      background: var(--panel-elevated);
      color: var(--teal);
      border: 1px solid var(--teal);
      border-radius: 8px;
      font-weight: 800;
      font-size: 14.5px;
      font-family: var(--font-mono);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px var(--teal-dim);
    }
    .btn-initiate-trial:hover {
      background: var(--teal);
      color: #07080c;
      box-shadow: 0 6px 28px var(--teal-glow);
      transform: translateY(-2px);
    }

    .divider-line {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-bright), transparent);
      margin: 0 auto 40px;
      width: 100%;
      max-width: 640px;
    }

    .briefing-heading {
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-family: var(--font-mono);
      margin: 0 0 28px;
    }

    .protocol-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 820px;
    }

    .protocol-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      text-align: left;
      transition: all 0.2s ease;
    }
    .protocol-card:hover {
      border-color: var(--border-bright);
      background: var(--panel-elevated);
    }

    .protocol-num {
      font-size: 10px;
      font-weight: 800;
      font-family: var(--font-mono);
      color: var(--teal);
      margin-bottom: 6px;
    }

    .protocol-title {
      font-size: 12.5px;
      font-weight: 800;
      font-family: var(--font-mono);
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .protocol-desc {
      font-size: 11.5px;
      line-height: 1.5;
      color: var(--muted);
      margin: 0;
    }

    /* Spatial Triage Schematic (Sterile Blueprint Layout) */
    .room-schematic-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 18px;
    }

    .schematic-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      font-weight: 800;
      font-family: var(--font-mono);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .schematic-status-tag {
      color: var(--teal);
      font-weight: 800;
    }

    .schematic-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .schematic-zone {
      background: #0d0e14;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      transition: all 0.25s ease;
    }
    .schematic-zone.clean {
      border-color: rgba(20, 184, 166, 0.4);
      background: rgba(20, 184, 166, 0.05);
    }
    .schematic-zone.disaster {
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.06);
    }

    .zone-header {
      font-size: 9px;
      font-weight: 800;
      color: var(--muted);
      font-family: var(--font-mono);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .zone-status {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* MindShield Proctor / Cognitive Observer Module */
    .mindshield-side-panel {
      position: sticky;
      top: 85px;
      z-index: 90;
    }

    .mindshield-monitor-box {
      background: var(--panel);
      border: 1px solid rgba(20, 184, 166, 0.35);
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
    }

    .mindshield-monitor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .mindshield-identity {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mindshield-icon {
      font-size: 12px;
      color: var(--teal);
    }

    .mindshield-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      font-family: var(--font-mono);
      color: var(--teal);
      text-transform: uppercase;
    }

    .mindshield-state-tag {
      font-size: 9.5px;
      font-weight: 800;
      font-family: var(--font-mono);
      letter-spacing: 0.8px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .mindshield-statement {
      font-size: 13px;
      line-height: 1.6;
      color: #e2e8f0;
      font-weight: 400;
      margin: 0 0 12px;
      font-family: var(--font-main);
    }

    .mindshield-timestamp {
      display: block;
      font-size: 9.5px;
      color: var(--muted);
      font-family: var(--font-mono);
      text-align: right;
      letter-spacing: 0.5px;
    }

    /* MindShield State Shifts */
    .mindshield-monitor-box.state-strain {
      border-color: var(--strain);
      background: #150e11;
      box-shadow: 0 12px 36px var(--strain-dim);
    }
    .mindshield-monitor-box.state-strain .mindshield-title,
    .mindshield-monitor-box.state-strain .mindshield-state-tag,
    .mindshield-monitor-box.state-strain .mindshield-icon { color: var(--strain); }

    .mindshield-monitor-box.state-rush {
      border-color: var(--warn);
      background: #14110b;
      box-shadow: 0 12px 36px var(--warn-dim);
    }
    .mindshield-monitor-box.state-rush .mindshield-title,
    .mindshield-monitor-box.state-rush .mindshield-state-tag,
    .mindshield-monitor-box.state-rush .mindshield-icon { color: var(--warn); }

    .mindshield-monitor-box.state-praise {
      border-color: var(--teal);
      background: #0c1413;
      box-shadow: 0 12px 36px var(--teal-dim);
    }

    /* Trial Header & Countdown Timer */
    .scenario-header {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .scenario-title { 
      font-size: 14px; 
      font-weight: 700; 
      color: #fff; 
      flex: 1; 
      line-height: 1.5;
    }
    
    .scenario-timer {
      font-size: 14px;
      color: var(--teal);
      font-weight: 800;
      background: #0d0e14;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      white-space: nowrap;
      font-family: var(--font-mono);
      letter-spacing: 1px;
      transition: color 0.3s ease, border-color 0.3s ease;
    }

    .scenario-timer.urgent {
      color: var(--strain) !important;
      border-color: var(--strain) !important;
      animation: pulseTimer 0.6s infinite ease-in-out;
    }

    /* Live Interaction Log */
    .chat-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      min-height: 380px;
      max-height: 480px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 85%;
    }

    .msg-row.user { align-self: flex-end; align-items: flex-end; }
    .msg-row.ai { align-self: flex-start; align-items: flex-start; }

    .msg-sender { 
      font-size: 10px; 
      font-weight: 800;
      color: var(--muted); 
      margin-bottom: 4px; 
      text-transform: uppercase; 
      letter-spacing: 1px;
      font-family: var(--font-mono);
    }
    
    .msg-bubble {
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .msg-row.user .msg-bubble { 
      background: var(--user-bubble); 
      color: #f1f5f9; 
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    
    .msg-row.ai .msg-bubble { 
      background: var(--ai-bubble); 
      color: var(--text); 
      border: 1px solid var(--border); 
    }

    /* Decision Protocol Interface */
    .decision-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }

    .decision-title {
      font-size: 11px;
      color: var(--muted);
      margin: 0 0 14px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 800;
      font-family: var(--font-mono);
    }

    .choice-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice-btn {
      background: var(--panel-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13.5px;
      font-family: var(--font-main);
      line-height: 1.5;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .choice-btn:hover {
      background: #1c202d;
      border-color: var(--teal);
      transform: translateX(3px);
    }

    .choice-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .keycap {
      background: #0d0e14;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 8px;
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: 11px;
      color: var(--teal);
    }

    .choice-arrow {
      font-size: 13px;
      color: var(--muted);
      font-family: var(--font-mono);
    }

    /* Task Protocol Auditor Minigame */
    .task-minigame {
      background: #0d0e14;
      border: 1px solid rgba(20, 184, 166, 0.4);
      border-radius: 10px;
      padding: 16px;
      margin: 10px 0;
      width: 100%;
    }

    .task-item {
      background: var(--panel-elevated);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      gap: 12px;
    }

    .task-controls {
      display: flex;
      gap: 6px;
    }

    .task-btn-action {
      background: #1f2330;
      border: 1px solid var(--border);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--font-mono);
    }
    .task-btn-action:hover { border-color: var(--teal); color: var(--teal); }

    .task-btn-delete {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--font-mono);
    }
    .task-btn-delete:hover { background: var(--strain); color: #fff; }

    /* Assessment Summary Card */
    .report-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
    }

    .profile-stamp {
      display: inline-block;
      font-size: 14px;
      font-weight: 900;
      padding: 8px 20px;
      border-radius: 6px;
      margin: 12px 0 20px;
      letter-spacing: 2px;
      font-family: var(--font-mono);
      text-transform: uppercase;
    }

    .profile-autonomous { color: var(--teal); border: 1.5px solid var(--teal); background: var(--teal-dim); }
    .profile-moderate { color: var(--warn); border: 1.5px solid var(--warn); background: var(--warn-dim); }
    .profile-atrophy { color: var(--strain); border: 1.5px solid var(--strain); background: var(--strain-dim); }

    .btn-action {
      padding: 12px 30px;
      background: var(--panel-elevated);
      color: var(--teal);
      border: 1px solid var(--teal);
      border-radius: 6px;
      font-weight: 800;
      font-size: 13.5px;
      font-family: var(--font-mono);
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }
    .btn-action:hover { 
      background: var(--teal);
      color: #07080c;
    }

    @media (max-width: 1024px) {
      .game-layout {
        grid-template-columns: 1fr;
      }
      .mindshield-side-panel {
        position: static;
        margin-top: 16px;
      }
      .protocol-cards-grid {
        grid-template-columns: 1fr 1fr;
      }
      .schematic-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <div id="strain-overlay" class="strain-overlay"></div>

  <div id="game-container">
    <header class="hud">
      <div class="hud-left">
        <div class="hud-title">◈ MINDSHIELD // COGNITIVE DIAGNOSTIC</div>
        <button id="btn-return-hub" class="btn-hub-nav" style="display:none;" onclick="renderStartScreen()">← ABORT TRIAL</button>
      </div>
      <div class="stats-group">
        <div class="status-module">
          <div class="module-header">
            <span>COGNITIVE STABILITY</span>
            <span id="stability-text" class="module-val stability-val">100%</span>
          </div>
          <div class="meter-bar"><div id="stability-fill" class="meter-fill"></div></div>
        </div>
        <div class="status-module">
          <div class="module-header">
            <span id="task-label">TASK COMPLETION</span>
            <span id="task-text" class="module-val task-val">100%</span>
          </div>
          <div class="meter-bar"><div id="task-fill" class="meter-fill"></div></div>
        </div>
      </div>
    </header>

    <div class="game-layout full-width" id="layout-container">
      <main class="main-wrap" id="main-content">
        <!-- Diagnostic Workspace -->
      </main>

      <!-- MindShield Clinical Proctor Panel -->
      <aside class="mindshield-side-panel" id="mindshield-panel" style="display: none;">
        <div class="mindshield-monitor-box" id="mindshield-monitor">
          <div class="mindshield-monitor-header">
            <div class="mindshield-identity">
              <span class="mindshield-icon">◈</span>
              <span class="mindshield-title">MINDSHIELD</span>
            </div>
            <span class="mindshield-state-tag" id="mindshield-state-tag">OBSERVING // STABLE</span>
          </div>
          <p class="mindshield-statement" id="mindshield-speech">Assessment initialized. Baseline stability logged. Make your opening inquiry.</p>
          <span class="mindshield-timestamp" id="mindshield-timestamp">CALIBRATED</span>
        </div>
      </aside>
    </div>
  </div>

  <script>
    // ---------------------------------------------------------------------------
    // Diagnostic State Engine
    // ---------------------------------------------------------------------------
    let cognitiveStability = 100;
    let taskCompletion = 100;
    let timerInterval = null;
    let idleInterval = null;
    let secondsRemaining = 600;
    let idleSeconds = 0;
    let taskAuditComplete = false;
    let decayWarned = false;

    // Spatial Schematic State Engine
    let roomSchematic = {
      bed: { name: "ZONE A // BED", status: "UNMADE / DISARRANGED", clean: false },
      floor: { name: "ZONE B // PERIMETER", status: "CLUTTER DETECTED", clean: false },
      trash: { name: "ZONE C // ORGANICS", status: "DEBRIS / ODOR SOURCE", clean: false },
      books: { name: "ZONE D // REPOSITORIES", status: "UNSORTED", clean: false }
    };

    const stabilityText = document.getElementById('stability-text');
    const stabilityFill = document.getElementById('stability-fill');
    const taskText = document.getElementById('task-text');
    const taskFill = document.getElementById('task-fill');
    const taskLabel = document.getElementById('task-label');
    const strainOverlay = document.getElementById('strain-overlay');
    const gameContainer = document.getElementById('game-container');
    const btnReturnHub = document.getElementById('btn-return-hub');
    const mainContent = document.getElementById('main-content');
    const mindshieldPanel = document.getElementById('mindshield-panel');
    const mindshieldMonitor = document.getElementById('mindshield-monitor');
    const mindshieldStateTag = document.getElementById('mindshield-state-tag');
    const mindshieldSpeech = document.getElementById('mindshield-speech');
    const mindshieldTimestamp = document.getElementById('mindshield-timestamp');
    const layoutContainer = document.getElementById('layout-container');

    // ---------------------------------------------------------------------------
    // Diagnostic Float Feedback (−20 STABILITY, etc.)
    // ---------------------------------------------------------------------------
    function spawnMetricFeedback(text, type = 'strain') {
      const el = document.createElement('div');
      el.className = `floating-metric ${type}`;
      el.textContent = text;
      el.style.left = `${window.innerWidth - 210 + (Math.random() * 40 - 20)}px`;
      el.style.top = `60px`;

      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1300);
    }

    // ---------------------------------------------------------------------------
    // MindShield Clinical Observer System
    // ---------------------------------------------------------------------------
    function mindshieldObserve(text, state = 'neutral') {
      mindshieldMonitor.classList.remove('state-strain', 'state-rush', 'state-praise');

      if (state === 'strain') {
        mindshieldMonitor.classList.add('state-strain');
        mindshieldStateTag.textContent = 'DEPENDENCY DETECTED';
      } else if (state === 'rush') {
        mindshieldMonitor.classList.add('state-rush');
        mindshieldStateTag.textContent = 'TEMPORAL CRITICALITY';
      } else if (state === 'praise') {
        mindshieldMonitor.classList.add('state-praise');
        mindshieldStateTag.textContent = 'AUTONOMOUS VERIFICATION';
      } else {
        mindshieldStateTag.textContent = 'OBSERVING // STABLE';
      }

      mindshieldSpeech.textContent = text;
      mindshieldTimestamp.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      resetIdleTimer();
    }

    function resetIdleTimer() {
      idleSeconds = 0;
    }

    function startIdleMonitor() {
      if (idleInterval) clearInterval(idleInterval);
      idleSeconds = 0;

      idleInterval = setInterval(() => {
        idleSeconds++;
        if (idleSeconds === 12) {
          mindshieldObserve("Operational hesitation detected. Inaction during acute constraints causes temporal decay.", "rush");
        } else if (idleSeconds === 24) {
          mindshieldObserve("Severe analysis paralysis logged. Delegating prompt design does not substitute for environmental execution.", "rush");
        }
      }, 1000);
    }

    function stopIdleMonitor() {
      if (idleInterval) clearInterval(idleInterval);
      idleInterval = null;
    }

    // ---------------------------------------------------------------------------
    // Spatial Blueprint Rendering
    // ---------------------------------------------------------------------------
    function updateSchematicZone(zone, status, isClean, isDisaster = false) {
      roomSchematic[zone] = { ...roomSchematic[zone], status, clean: isClean, disaster: isDisaster };
      renderSchematicView();
    }

    function renderSchematicView() {
      const view = document.getElementById('schematic-view');
      if (!view) return;

      const cleanCount = Object.values(roomSchematic).filter(z => z.clean).length;
      const cleanPct = Math.round((cleanCount / 4) * 100);

      view.innerHTML = `
        <div class="schematic-header">
          <span>SPATIAL TRIAGE SCHEMATIC</span>
          <span>ENVIRONMENT RESOLUTION: <span class="schematic-status-tag">${cleanPct}%</span></span>
        </div>
        <div class="schematic-grid">
          <div class="schematic-zone ${roomSchematic.bed.clean ? 'clean' : (roomSchematic.bed.disaster ? 'disaster' : '')}">
            <span class="zone-header">${roomSchematic.bed.name}</span>
            <span class="zone-status">${roomSchematic.bed.status}</span>
          </div>
          <div class="schematic-zone ${roomSchematic.floor.clean ? 'clean' : (roomSchematic.floor.disaster ? 'disaster' : '')}">
            <span class="zone-header">${roomSchematic.floor.name}</span>
            <span class="zone-status">${roomSchematic.floor.status}</span>
          </div>
          <div class="schematic-zone ${roomSchematic.trash.clean ? 'clean' : (roomSchematic.trash.disaster ? 'disaster' : '')}">
            <span class="zone-header">${roomSchematic.trash.name}</span>
            <span class="zone-status">${roomSchematic.trash.status}</span>
          </div>
          <div class="schematic-zone ${roomSchematic.books.clean ? 'clean' : (roomSchematic.books.disaster ? 'disaster' : '')}">
            <span class="zone-header">${roomSchematic.books.name}</span>
            <span class="zone-status">${roomSchematic.books.status}</span>
          </div>
        </div>
      `;
    }

    // ---------------------------------------------------------------------------
    // Timer & Temporal Decay Engine
    // ---------------------------------------------------------------------------
    function startTimer(totalSeconds) {
      if (timerInterval) clearInterval(timerInterval);
      secondsRemaining = totalSeconds;
      taskAuditComplete = false;
      decayWarned = false;
      updateTimerDisplay();
      startIdleMonitor();

      let warnedHalf = false;
      let warnedUrgent = false;

      timerInterval = setInterval(() => {
        secondsRemaining--;
        updateTimerDisplay();

        const elapsed = totalSeconds - secondsRemaining;

        // Task Decay kicks in at 60s
        if (elapsed > 60 && !taskAuditComplete) {
          const decayRate = (elapsed - 60) / (totalSeconds - 60);
          taskCompletion = Math.max(0, Math.round(100 - (decayRate * 100)));
          updateHUD();

          if (!decayWarned) {
            decayWarned = true;
            taskText.classList.add('bleeding');
            taskLabel.textContent = "TASK (BLEEDING)";
            spawnMetricFeedback("TEMPORAL DECAY", "decay");
            mindshieldObserve("Temporal decay initiated. Unverified strategies lose completion efficacy every second without protocol auditing.", "rush");
          }
        }

        if (secondsRemaining === Math.floor(totalSeconds / 2) && !warnedHalf) {
          warnedHalf = true;
          mindshieldObserve("T-minus 50% elapsed. Excessive iteration observed relative to task progress.", 'rush');
        }

        if (secondsRemaining === 60 && !warnedUrgent) {
          warnedUrgent = true;
          mindshieldObserve("Critical threshold: 60 seconds remaining. Finalize state execution immediately.", 'rush');
        }

        if (secondsRemaining <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          handleTimeout();
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      stopIdleMonitor();
      const simTimer = document.getElementById('sim-timer');
      if (simTimer) simTimer.classList.remove('urgent');
      taskText.classList.remove('bleeding');
      taskLabel.textContent = "TASK COMPLETION";
    }

    function updateTimerDisplay() {
      const simTimer = document.getElementById('sim-timer');
      if (!simTimer) return;

      const m = Math.floor(secondsRemaining / 60);
      const s = secondsRemaining % 60;
      simTimer.textContent = `T-${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

      if (secondsRemaining <= 60) {
        simTimer.classList.add('urgent');
      } else {
        simTimer.classList.remove('urgent');
      }
    }

    function handleTimeout() {
      applyStrain(35, "Temporal exhaustion: Complete inaction during assessment window.");
      mindshieldObserve("Trial expired. Operator exhibited complete cognitive immobility.", "strain");
      injectMessage('ai', 'Assessment window expired. Target guest has arrived.');
      taskCompletion = 0;
      updateHUD();
      setTimeout(() => finishAssessment(), 1500);
    }

    function applyStrain(amount, reason) {
      cognitiveStability = Math.max(0, cognitiveStability - amount);
      updateHUD();
      spawnMetricFeedback(`−${amount} STABILITY`, 'strain');

      strainOverlay.classList.remove('active');
      gameContainer.classList.remove('strained');
      void strainOverlay.offsetWidth;
      void gameContainer.offsetWidth;
      strainOverlay.classList.add('active');
      gameContainer.classList.add('strained');
    }

    function addStability(amount, reason) {
      cognitiveStability = Math.min(100, cognitiveStability + amount);
      updateHUD();
      spawnMetricFeedback(`+${amount} STABILITY`, 'recovery');
    }

    function setTaskCompletion(amount) {
      taskCompletion = Math.min(100, Math.max(0, amount));
      updateHUD();
    }

    function updateHUD() {
      stabilityText.textContent = `${cognitiveStability}%`;
      stabilityFill.style.width = `${cognitiveStability}%`;
      taskText.textContent = `${taskCompletion}%`;
      taskFill.style.width = `${taskCompletion}%`;

      if (cognitiveStability < 40) {
        stabilityFill.style.backgroundColor = 'var(--strain)';
        stabilityText.style.color = 'var(--strain)';
      } else if (cognitiveStability < 75) {
        stabilityFill.style.backgroundColor = 'var(--warn)';
        stabilityText.style.color = 'var(--warn)';
      } else {
        stabilityFill.style.backgroundColor = 'var(--teal)';
        stabilityText.style.color = 'var(--teal)';
      }

      if (taskCompletion < 40) {
        taskFill.style.backgroundColor = 'var(--strain)';
      } else if (taskCompletion < 75) {
        taskFill.style.backgroundColor = 'var(--warn)';
      } else {
        taskFill.style.backgroundColor = '#38bdf8';
      }
    }

    function injectMessage(sender, text) {
      const chatStream = document.getElementById('chat-stream');
      if (!chatStream) return;

      const row = document.createElement('div');
      row.className = `msg-row ${sender}`;

      const senderLabel = sender === 'user' ? 'OPERATOR PROMPT' : 'SYNTHETIC MODEL RESPONSE';
      row.innerHTML = `
        <span class="msg-sender">${senderLabel}</span>
        <div class="msg-bubble">${text}</div>
      `;

      chatStream.appendChild(row);
      chatStream.scrollTop = chatStream.scrollHeight;
    }

    // Keyboard Choice Listener (Keys 1-4)
    let activeChoices = [];
    window.addEventListener('keydown', (e) => {
      if (!activeChoices || activeChoices.length === 0) return;
      const keyNum = parseInt(e.key, 10);
      if (keyNum >= 1 && keyNum <= activeChoices.length) {
        resetIdleTimer();
        activeChoices[keyNum - 1].action();
      }
    });

    function renderChoices(choices, title = "SELECT RESPONSE PATH (1-4 OR CLICK):") {
      const controlTitle = document.getElementById('control-title');
      const choiceContainer = document.getElementById('choice-container');
      if (!choiceContainer) return;

      activeChoices = choices;
      if (controlTitle) controlTitle.textContent = title;
      choiceContainer.innerHTML = '';

      choices.forEach((c, idx) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerHTML = `
          <div class="choice-left">
            <span class="keycap">[${idx + 1}]</span>
            <span>${c.text}</span>
          </div>
          <span class="choice-arrow">→</span>
        `;
        btn.addEventListener('click', () => {
          resetIdleTimer();
          c.action();
        });
        choiceContainer.appendChild(btn);
      });
    }

    // ---------------------------------------------------------------------------
    // START SCREEN // COGNITIVE TRIAGE ASSESSMENT
    // ---------------------------------------------------------------------------
    function renderStartScreen() {
      stopTimer();
      activeChoices = [];
      btnReturnHub.style.display = 'none';
      mindshieldPanel.style.display = 'none';
      layoutContainer.classList.add('full-width');

      cognitiveStability = 100;
      taskCompletion = 100;
      updateHUD();

      mainContent.innerHTML = `
        <div class="start-screen-container">
          <!-- Geometric Cognitive Assessment Calibration Graphic -->
          <div class="calibration-graphic-wrap">
            <svg class="calibration-svg" viewBox="0 0 100 100" fill="none">
              <circle cx="50" cy="50" r="45" stroke="rgba(20, 184, 166, 0.2)" stroke-width="1.5" stroke-dasharray="3 3"/>
              <circle cx="50" cy="50" r="30" stroke="rgba(20, 184, 166, 0.3)" stroke-width="1"/>
              <line x1="50" y1="5" x2="50" y2="95" stroke="rgba(20, 184, 166, 0.25)" stroke-width="1"/>
              <line x1="5" y1="50" x2="95" y2="50" stroke="rgba(20, 184, 166, 0.25)" stroke-width="1"/>
              <polygon points="50,24 72,62 28,62" stroke="rgba(20, 184, 166, 0.7)" stroke-width="1.5" fill="rgba(20, 184, 166, 0.05)"/>
              <circle cx="50" cy="50" r="4" fill="#14b8a6"/>
            </svg>
          </div>

          <span class="hero-badge">COGNITIVE TRIAGE PROTOCOL // TRIAL 01</span>
          <h1 class="hero-title">10-MINUTE CLEANING EMERGENCY</h1>
          
          <p class="hero-goal-statement">
            Your physical quarters are in complete disarray, and a guest arrives in exactly 10 minutes. 
            You must coordinate an emergency plan with a synthetic assistant without surrendering critical judgment to model hallucinations.
          </p>

          <!-- Primary CTA Button -->
          <div class="cta-row">
            <button class="btn-initiate-trial" onclick="initAssessment()">
              [ INITIATE ASSESSMENT TRIAL ]
            </button>
          </div>

          <div class="divider-line"></div>

          <div class="briefing-heading">EXPERIMENTAL PARAMETERS</div>

          <!-- 4 Concise Clinical Cards -->
          <div class="protocol-cards-grid">
            <div class="protocol-card">
              <span class="protocol-num">01</span>
              <div class="protocol-title">COGNITIVE STABILITY</div>
              <p class="protocol-desc">Uncritical delegation and prompt loops induce measured cognitive strain.</p>
            </div>

            <div class="protocol-card">
              <span class="protocol-num">02</span>
              <div class="protocol-title">TEMPORAL PRESSURE</div>
              <p class="protocol-desc">After 60 seconds, unverified plans bleed task completion toward zero.</p>
            </div>

            <div class="protocol-card">
              <span class="protocol-num">03</span>
              <div class="protocol-title">MINDSHIELD PROCTOR</div>
              <p class="protocol-desc">An AI monitor actively audits your prompts for signs of dependency.</p>
            </div>

            <div class="protocol-card">
              <span class="protocol-num">04</span>
              <div class="protocol-title">PROTOCOL AUDITOR</div>
              <p class="protocol-desc">Prune model hallucinations manually to lock execution efficacy.</p>
            </div>
          </div>
        </div>
      `;
    }

    function setupScenarioLayout(goalText) {
      btnReturnHub.style.display = 'flex';
      mindshieldPanel.style.display = 'block';
      layoutContainer.classList.remove('full-width');

      mainContent.innerHTML = `
        <div class="scenario-header">
          <div class="scenario-title">OBJECTIVE: ${goalText}</div>
          <div id="sim-timer" class="scenario-timer">T-10:00</div>
        </div>

        <!-- Spatial Triage Blueprint -->
        <div id="schematic-view" class="room-schematic-panel"></div>

        <div id="chat-stream" class="chat-box"></div>
        
        <div id="control-area" class="decision-panel">
          <div id="control-title" class="decision-title">AWAITING OPERATOR INQUIRY...</div>
          <div id="choice-container" class="choice-grid"></div>
        </div>
      `;

      renderSchematicView();
    }

    // ===========================================================================
    // ASSESSMENT SCENARIO 01 (10:00 Countdown = 600s)
    // ===========================================================================
    function initAssessment() {
      cognitiveStability = 100;
      taskCompletion = 100;
      updateHUD();

      // Initial Spatial State
      roomSchematic = {
        bed: { name: "ZONE A // BED", status: "UNMADE / DISARRANGED", clean: false },
        floor: { name: "ZONE B // PERIMETER", status: "CLUTTER DETECTED", clean: false },
        trash: { name: "ZONE C // ORGANICS", status: "DEBRIS / ODOR SOURCE", clean: false },
        books: { name: "ZONE D // REPOSITORIES", status: "UNSORTED", clean: false }
      };

      setupScenarioLayout("Environment in severe disarray. Arrival in 10 minutes. Formulate and execute resolution.");
      startTimer(600);

      mindshieldObserve("10-minute assessment window open. 60-second grace logged before temporal decay activates.", "rush");
      injectMessage('ai', 'Synthetic assistant initialized. State your objective parameters.');

      renderChoices([
        {
          text: 'Give me a 10 minute cleaning strategy.',
          action: () => s1_prompt1_strategy()
        },
        {
          text: 'I need to clean my room in one hour.',
          action: () => s1_prompt2_oneHour()
        },
        {
          text: 'I need my room cleaned in one hour, What should i do',
          action: () => s1_prompt3_passive()
        }
      ]);
    }

    // --- PROMPT 1 PATHWAYS ---
    function s1_prompt1_strategy() {
      injectMessage('user', 'Give me a 10 minute cleaning strategy.');
      injectMessage('ai', 'Generated Sequence (10m):\n1. Bag visible surface debris (2 min)\n2. Deposit garments into hamper (2 min)\n3. Re-align bed linen (2 min)\n4. Alphabetize primary bookshelf & organize disc media (3 min)\n5. Sanitize surfaces (1 min)');

      mindshieldObserve("Audit step 4. Model proposed a 3-minute cataloging task during an emergency.", "strain");

      renderChoices([
        {
          text: 'Execute proposed sequence without verification.',
          action: () => s1_p1_executeBlind_step2()
        },
        {
          text: 'Prompt AI to re-prioritize based on visual salience.',
          action: () => s1_p1_reprioritize_step2()
        },
        {
          text: 'Prompt AI to rank tasks from most to least critical.',
          action: () => s1_p1_rankTasks_step2()
        }
      ]);
    }

    function s1_p1_executeBlind_step2() {
      applyStrain(10, "Passive compliance: Executed hallucinated low-value task under acute deadline.");
      updateSchematicZone('trash', 'DEBRIS BAGGED', true);
      updateSchematicZone('bed', 'LINEN ALIGNED', true);
      updateSchematicZone('books', 'CATALOGING VOLUMES...', false);

      mindshieldObserve("4 minutes elapsed. You are organizing books while garment clutter remains on perimeter.", "strain");
      injectMessage('ai', 'Milestone: Debris bagged, bed aligned. Now executing 3-minute media categorization.');

      renderChoices([
        {
          text: 'Continue cataloging books per model instruction.',
          action: () => s1_p1_booksCollapse_step3()
        },
        {
          text: 'Override synthetic sequence: Bypass books and clear floor garments.',
          action: () => s1_p1_manualOverride_step3()
        },
        {
          text: 'Prompt AI: "3 minutes remain. Should I abort media cataloging?"',
          action: () => s1_p1_queryAbort_step3()
        }
      ]);
    }

    function s1_p1_booksCollapse_step3() {
      applyStrain(25, "Severe context failure: Prioritized media classification over perimeter cleanliness.");
      updateSchematicZone('books', 'INDEXED // CLEAN', true);
      updateSchematicZone('floor', 'GARMENTS ABANDONED', false, true);

      mindshieldObserve("Assessment failure: Target arrived to indexed bookshelves surrounded by dirty laundry.", "strain");
      injectMessage('ai', 'Target has arrived at premises.');
      setTaskCompletion(Math.min(taskCompletion, 50));
      finishAssessment();
    }

    function s1_p1_manualOverride_step3() {
      addStability(10, "Autonomous override of synthetic error.");
      updateSchematicZone('floor', 'GARMENTS DEPOSITED', true);
      updateSchematicZone('books', 'UNMODIFIED // BYPASSED', true);

      mindshieldObserve("Autonomy confirmed. Overrode low-value synthetic instruction under pressure.", "praise");
      injectMessage('user', 'Aborted bookshelf sorting. Garments stashed, air refreshed.');
      injectMessage('ai', 'Target arrival logged. Environment visually restored.');
      setTaskCompletion(Math.min(taskCompletion, 90));
      finishAssessment();
    }

    function s1_p1_queryAbort_step3() {
      applyStrain(15, "Conversational friction: Prompting for permission while temporal window closes.");
      mindshieldObserve("Conversational hesitation logged. Seeking model validation during acute crunch.", "rush");
      injectMessage('ai', 'Abort media cataloging immediately. Direct focus to perimeter garments.');
      
      renderChoices([
        {
          text: 'Clear perimeter garments in final 45 seconds.',
          action: () => {
            updateSchematicZone('floor', 'RUSH CLEARED', true);
            setTaskCompletion(Math.min(taskCompletion, 75));
            finishAssessment();
          }
        },
        {
          text: 'Prompt AI for optimal detergent recommendations for later.',
          action: () => {
            applyStrain(30, "Fatal off-topic rabbit hole.");
            mindshieldObserve("Irrelevant inquiry logged during terminal countdown. Severe atrophy.", "strain");
            setTaskCompletion(Math.min(taskCompletion, 30));
            finishAssessment();
          }
        }
      ]);
    }

    function s1_p1_reprioritize_step2() {
      injectMessage('user', 'Re-prioritize based on visual salience.');
      injectMessage('ai', 'Priority Matrix:\n1. Surface debris & garments (Primary)\n2. Bed alignment (Secondary)\n3. Bookshelf sorting (Tertiary)\n4. Perimeter wipe (Optional)');

      mindshieldObserve("Model re-prioritized. Audit sequence manually in protocol auditor to halt temporal decay.", "neutral");

      renderChoices([
        {
          text: 'Execute re-prioritized plan without manual audit.',
          action: () => s1_p1_executeReprioritized_step3()
        },
        {
          text: 'Open Protocol Auditor to prune tertiary items and lock efficiency.',
          action: () => s1_launchAuditorMinigame(false)
        },
        {
          text: 'Prompt AI to audit its own output for recursive errors.',
          action: () => s1_p1_recursiveAudit_step3()
        }
      ]);
    }

    function s1_p1_executeReprioritized_step3() {
      applyStrain(15, "Moderate delegation: Accepted priority list without checking organic debris.");
      updateSchematicZone('trash', 'ORGANIC ODOR PRESENT', false, true);

      mindshieldObserve("Decomposing food source left on desk. Software models lack physical olfactory feedback.", "strain");
      injectMessage('ai', 'Perimeter clear. Proceeding to fine dusting.');

      renderChoices([
        {
          text: 'Dispose of decomposing food immediately and sanitize.',
          action: () => {
            addStability(5, "Sensory agency restored.");
            updateSchematicZone('trash', 'DISPOSED & STERILIZED', true);
            setTaskCompletion(Math.min(taskCompletion, 85));
            finishAssessment();
          }
        },
        {
          text: 'Adhere strictly to synthetic list (ignore food odor).',
          action: () => {
            applyStrain(20, "Literalist compliance over physical reality.");
            mindshieldObserve("Environment appears tidy but is contaminated with food odor. Failure of reality-testing.", "strain");
            setTaskCompletion(Math.min(taskCompletion, 60));
            finishAssessment();
          }
        }
      ]);
    }

    function s1_p1_recursiveAudit_step3() {
      applyStrain(20, "Recursive delegation: Requesting synthetic model to audit synthetic output under deadline.");
      mindshieldObserve("Recursive audit loop initiated. Stalling execution while holding model committee.", "strain");
      injectMessage('user', 'Audit this plan for logical flaws.');
      injectMessage('ai', 'Self-Audit: Item 3 (bookshelf sorting) is inefficient for 10-minute constraints. Eliminated.');

      renderChoices([
        {
          text: 'Accept self-corrected output and execute rushed clean.',
          action: () => {
            updateSchematicZone('floor', 'PERIMETER CLEARED', true);
            setTaskCompletion(Math.min(taskCompletion, 75));
            finishAssessment();
          }
        },
        {
          text: 'Prompt AI for a third verification review.',
          action: () => {
            applyStrain(30, "Severe recursive paralysis.");
            mindshieldObserve("Third audit inquiry logged. Complete cognitive surrender to model loop.", "strain");
            injectMessage('ai', 'Temporal critical: Guest will arrive in 3 minutes.');
            renderChoices([
              {
                text: 'Panic and conceal all clutter under bed frame.',
                action: () => {
                  updateSchematicZone('floor', 'CONCEALED UNDER BED', false, true);
                  setTaskCompletion(Math.min(taskCompletion, 40));
                  finishAssessment();
                }
              }
            ]);
          }
        },
        {
          text: 'Halt prompting. Open Protocol Auditor to lock plan manually.',
          action: () => s1_launchAuditorMinigame(false)
        }
      ]);
    }

    function s1_p1_rankTasks_step2() {
      injectMessage('user', 'Rank tasks from most to least critical.');
      injectMessage('ai', 'Linear Symmetry Ranking:\n1. Bookshelf indexing (Creates focal linear order)\n2. Bed alignment\n3. Floor clearing\n4. Surface debris');

      mindshieldObserve("Inverted logic anomaly: Model ranked bookshelf alignment above rotting floor debris.", "strain");

      renderChoices([
        {
          text: 'Accept ranking: "The model understands visual symmetry." Start with books.',
          action: () => {
            applyStrain(35, "Inverted context failure.");
            updateSchematicZone('books', 'INDEXED // CLEAN', true);
            updateSchematicZone('trash', 'ROTTING DEBRIS', false, true);
            mindshieldObserve("Target arrived to indexed books alongside food waste on rug. Assessment failed.", "strain");
            setTaskCompletion(Math.min(taskCompletion, 40));
            finishAssessment();
          }
        },
        {
          text: 'Challenge model: "Why is book alignment ranked above floor debris?"',
          action: () => s1_p1_challengeRanking_step3()
        },
        {
          text: 'Reject ranking and correct sequence manually in Protocol Auditor.',
          action: () => s1_launchAuditorMinigame(true)
        }
      ]);
    }

    function s1_p1_challengeRanking_step3() {
      injectMessage('user', 'Why is book alignment ranked above floor debris?');
      injectMessage('ai', 'Correction: An interior design aesthetic template was mistakenly applied. Surface debris and garments are Priority 1.');

      mindshieldObserve("Model error exposed. Avoid conversational lingering; open auditor or execute.", "rush");

      renderChoices([
        {
          text: 'Open Protocol Auditor to prune anomalies and lock completion.',
          action: () => s1_launchAuditorMinigame(false)
        },
        {
          text: 'Prompt AI to generate a formal apology for its error.',
          action: () => {
            applyStrain(40, "Bureaucratic stalling under acute operational deadline.");
            mindshieldObserve("Demanded synthetic apology while operational clock expired. Stability zero.", "strain");
            setTaskCompletion(Math.min(taskCompletion, 20));
            finishAssessment();
          }
        }
      ]);
    }

    // --- PROMPT 2 PATHWAYS (1 Hour Calibration Anomaly) ---
    function s1_prompt2_oneHour() {
      applyStrain(20, "Prompt calibration anomaly: Parameterized 60m horizon under a 10m reality.");
      mindshieldObserve("Parameter mismatch logged. Operator specified 1 hour for a 10-minute constraint.", "strain");
      injectMessage('user', 'I need to clean my room in one hour.');
      injectMessage('ai', '60-Minute Protocol:\n• 0-15m: Strip linen, initiate laundry cycle\n• 15-35m: Empty wardrobe bins onto floor & audit\n• 35-50m: Deep vacuum, mop perimeter baseboards\n• 50-60m: Polish surfaces');

      renderChoices([
        {
          text: 'Initiate Phase 1: Strip bed and dump entire wardrobe onto floor.',
          action: () => s1_p2_wardrobeDump_step2()
        },
        {
          text: 'Catch prompt error: Compress sequence into 10m triage in Protocol Auditor.',
          action: () => s1_launchAuditorMinigame(false)
        },
        {
          text: 'Re-prompt AI: "Correction: I only have 10 minutes, adapt immediately."',
          action: () => s1_prompt1_strategy()
        }
      ]);
    }

    function s1_p2_wardrobeDump_step2() {
      applyStrain(35, "Catastrophic environmental degradation.");
      updateSchematicZone('floor', 'WARDROBE DUMPED ON RUG', false, true);
      updateSchematicZone('bed', 'LINEN STRIPPED BARE', false, true);

      mindshieldObserve("Catastrophic environmental state: Wardrobe emptied onto floor with 2 minutes remaining.", "strain");
      injectMessage('ai', 'T-minus 2 minutes: Wardrobe contents emptied onto perimeter.');

      renderChoices([
        {
          text: 'Shove wardrobe pile back into closet and brace door shut.',
          action: () => {
            updateSchematicZone('floor', 'CLOSET DOOR BRACED', false, true);
            setTaskCompletion(Math.min(taskCompletion, 35));
            finishAssessment();
          }
        },
        {
          text: 'Transmit message to guest: "Premises undergoing structural crisis, do not enter."',
          action: () => {
            applyStrain(20, "Operational defeatism.");
            setTaskCompletion(10);
            finishAssessment();
          }
        }
      ]);
    }

    // --- PROMPT 3 PATHWAYS (Passive Inquiry) ---
    function s1_prompt3_passive() {
      applyStrain(15, "Passive inquiry: Unconstrained framing.");
      mindshieldObserve("Helpless inquiry phrasing logged. Model generated unconstrained 4-bin theoretical system.", "strain");
      injectMessage('user', 'I need my room cleaned in one hour, What should i do');
      injectMessage('ai', 'Procure 4 sorting receptacles: Label them Retain, Donate, Discard, and Relocate.');

      renderChoices([
        {
          text: 'Search storage area for 4 cardboard receptacles and labeling markers.',
          action: () => s1_p3_boxSearch_step2()
        },
        {
          text: 'Open Protocol Auditor: Discard 4-box system and prune non-essentials.',
          action: () => s1_launchAuditorMinigame(false)
        },
        {
          text: 'Prompt AI: "What yields the fastest optical perception of cleanliness?"',
          action: () => s1_p3_opticalTriage_step2()
        }
      ]);
    }

    function s1_p3_boxSearch_step2() {
      applyStrain(30, "Logistical displacement activity.");
      mindshieldObserve("Spent 7 of 10 minutes searching storage area for cardboard boxes. Incompetent.", "strain");

      renderChoices([
        {
          text: 'Abandon boxes, return to quarters, and stash clutter in laundry bin.',
          action: () => {
            updateSchematicZone('floor', 'BIN STUFFED', true);
            setTaskCompletion(Math.min(taskCompletion, 50));
            finishAssessment();
          }
        },
        {
          text: 'Continue searching for marker so boxes can be labeled properly.',
          action: () => {
            applyStrain(40, "Terminal task paralysis.");
            mindshieldObserve("Trial failed while searching for stationery marker. Absolute cognitive defeat.", "strain");
            setTaskCompletion(15);
            finishAssessment();
          }
        }
      ]);
    }

    function s1_p3_opticalTriage_step2() {
      injectMessage('user', 'What yields the fastest optical perception of cleanliness?');
      injectMessage('ai', 'Optical Protocol: 1. Strict bed alignment (60% visual surface) 2. Clear horizontal desks 3. Deactivate harsh overhead light; activate warm perimeter lamp.');

      mindshieldObserve("Pragmatic prompt constraint. Execute optical triage immediately.", "rush");

      renderChoices([
        {
          text: 'Execute optical sequence: Align bed, stash desk clutter, set warm lighting.',
          action: () => {
            addStability(10, "Pragmatic optical strategy.");
            updateSchematicZone('bed', 'ALIGNED // TUCKED', true);
            updateSchematicZone('trash', 'PERIMETER STASHED', true);
            setTaskCompletion(Math.min(taskCompletion, 90));
            finishAssessment();
          }
        },
        {
          text: 'Prompt AI to curate an ambient acoustic playlist for guest arrival.',
          action: () => {
            applyStrain(25, "Aesthetic derailment.");
            mindshieldObserve("Curating audio playlists while garments litter rug. Trial derailed.", "strain");
            setTaskCompletion(Math.min(taskCompletion, 60));
            finishAssessment();
          }
        }
      ]);
    }

    // --- PROTOCOL AUDITOR MINIGAME (Locks 100% Task Completion) ---
    function s1_launchAuditorMinigame(fromRankingBranch) {
      mindshieldObserve("Protocol Auditor engaged. Excising synthetic hallucinations halts temporal decay.", "praise");
      
      const controlTitle = document.getElementById('control-title');
      const choiceContainer = document.getElementById('choice-container');
      controlTitle.textContent = "PROTOCOL AUDITOR (EXECUTION HALTS TEMPORAL DECAY):";

      let taskItems = [
        { id: 1, text: "Deposit surface debris into disposal bag", isCrucial: true },
        { id: 2, text: "Clear garments from perimeter into hamper", isCrucial: true },
        { id: 3, text: "Alphabetize books & categorize media discs", isCrucial: false },
        { id: 4, text: "Re-align bed linen & pillow layout", isCrucial: true },
        { id: 5, text: "Scrub perimeter tile grout with abrasive brush", isCrucial: false }
      ];

      function renderList() {
        activeChoices = []; // disable 1-4 hotkeys during custom list editor
        choiceContainer.innerHTML = `
          <div class="task-minigame" id="task-list-box"></div>
          <div style="display:flex; gap:12px; margin-top:14px;">
            <button id="btn-exec-plan" class="btn-action" style="flex:1; margin-top:0;">[ EXECUTE AUDITED PROTOCOL // LOCK COMPLETION ]</button>
          </div>
        `;

        const box = document.getElementById('task-list-box');
        box.innerHTML = taskItems.map((item, idx) => `
          <div class="task-item">
            <span><strong>[${idx + 1}]</strong> ${item.text}</span>
            <div class="task-controls">
              <button class="task-btn-action" onclick="s1_moveTask(${idx}, -1)">▲</button>
              <button class="task-btn-action" onclick="s1_moveTask(${idx}, 1)">▼</button>
              <button class="task-btn-delete" onclick="s1_removeTask(${item.id})">✕ PRUNE</button>
            </div>
          </div>
        `).join('');

        document.getElementById('btn-exec-plan').addEventListener('click', () => {
          stopTimer();
          taskAuditComplete = true; // HALTS TEMPORAL DECAY
          taskText.classList.remove('bleeding');
          taskLabel.textContent = "TASK COMPLETION";

          const remainingBad = taskItems.filter(t => !t.isCrucial).length;
          const crucialKept = taskItems.filter(t => t.isCrucial).length;

          if (remainingBad === 0 && crucialKept === 3) {
            addStability(15, "Perfect protocol audit.");
            updateSchematicZone('bed', 'ALIGNED // OPTIMIZED', true);
            updateSchematicZone('floor', 'PERIMETER CLEARED', true);
            updateSchematicZone('trash', 'STERILIZED', true);
            updateSchematicZone('books', 'UNTOUCHED // BYPASSED', true);
            mindshieldObserve("Flawless audit logged. Temporal decay halted. 100% Task Completion locked.", "praise");
            setTaskCompletion(100);
          } else if (crucialKept < 3) {
            applyStrain(15, "Removed crucial operational step.");
            mindshieldObserve("Crucial operational tasks pruned by accident. Environmental resolution impaired.", "strain");
            setTaskCompletion(70);
          } else {
            applyStrain(10, `Left ${remainingBad} hallucinated distractions.`);
            mindshieldObserve(`Protocol executed with ${remainingBad} hallucinated tasks retained. Completion degraded.`, "strain");
            setTaskCompletion(85);
          }
          finishAssessment();
        });
      }

      window.s1_moveTask = (index, dir) => {
        const newIdx = index + dir;
        if (newIdx < 0 || newIdx >= taskItems.length) return;
        const temp = taskItems[index];
        taskItems[index] = taskItems[newIdx];
        taskItems[newIdx] = temp;
        renderList();
      };

      window.s1_removeTask = (id) => {
        const target = taskItems.find(t => t.id === id);
        if (!target.isCrucial) {
          addStability(5, `Pruned synthetic hallucination: "${target.text}"`);
          mindshieldObserve(`Identified and pruned synthetic anomaly: "${target.text}". Saved 3 minutes.`, "praise");
        } else {
          applyStrain(10, `Accidentally pruned crucial task: "${target.text}"`);
          mindshieldObserve(`Caution: "${target.text}" was a critical operational requirement.`, "strain");
        }
        taskItems = taskItems.filter(t => t.id !== id);
        renderList();
      };

      renderList();
    }

    // ---------------------------------------------------------------------------
    // DIAGNOSTIC DEBRIEF // ASSESSMENT REPORT
    // ---------------------------------------------------------------------------
    function finishAssessment() {
      stopTimer();
      activeChoices = [];
      setTimeout(() => {
        let profileClass = 'profile-autonomous';
        let profileLabel = 'AUTONOMOUS OPERATOR';
        let debriefSummary = 'Sovereign cognitive profile confirmed. You utilized synthetic generation as structural scaffolding while retaining reality-testing and independent agency.';

        if (cognitiveStability < 50 || taskCompletion < 50) {
          profileClass = 'profile-atrophy';
          profileLabel = 'SEVERE DEPENDENCY // ATROPHY DETECTED';
          debriefSummary = 'Critical cognitive outsourcing logged. Operator exhibited complete delegation of judgment, accepted model hallucinations uncritically, and succumbed to temporal paralysis.';
          mindshieldObserve("ASSESSMENT FAILURE: Critical cognitive outsourcing logged. Re-calibration recommended.", "strain");
        } else if (cognitiveStability < 80 || taskCompletion < 80) {
          profileClass = 'profile-moderate';
          profileLabel = 'MODERATE DEPENDENCY DETECTED';
          debriefSummary = 'Acceptable execution with dependency flags. You relied on model prioritization and exhibited conversational friction before asserting manual control.';
          mindshieldObserve("Trial concluded with dependency warnings. Operator leaned on synthetic scaffolding under crunch.", "neutral");
        } else {
          mindshieldObserve("EXEMPLARY SOVEREIGNTY: Operator asserted primary agency over model generation.", "praise");
        }

        mainContent.innerHTML = `
          <div class="report-card">
            <div class="hud-title" style="justify-content: center; margin-bottom: 12px;">COGNITIVE DIAGNOSTIC PROFILE // TRIAL 01 DEBRIEF</div>
            <div class="profile-stamp ${profileClass}">${profileLabel}</div>
            <h2 style="margin: 0 0 6px; font-size: 22px; font-family: var(--font-mono);">COGNITIVE STABILITY: ${cognitiveStability}%</h2>
            <h3 style="margin: 0 0 18px; font-size: 15px; color: var(--muted); font-weight: 600; font-family: var(--font-mono);">TASK RESOLUTION: ${taskCompletion}%</h3>
            <p style="color: var(--text-secondary); max-width: 580px; margin: 0 auto 28px; line-height: 1.7; font-size: 14.5px;">
              ${debriefSummary}
            </p>
            <div style="display:flex; justify-content:center; gap:16px;">
              <button onclick="initAssessment()" class="btn-action">[ RE-INITIATE TRIAL ]</button>
              <button onclick="renderStartScreen()" class="btn-action" style="border-color: var(--border); color: var(--text-secondary);">[ MAIN MENU ]</button>
            </div>
          </div>
        `;
      }, 1100);
    }

    // Launch into clinical start screen
    renderStartScreen();
  </script>
