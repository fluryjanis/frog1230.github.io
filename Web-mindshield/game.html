<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindShield — Neural Dependency Simulation Game</title>
  <style>
    :root {
      --bg: #090a0f;
      --panel: #13141c;
      --card: #1b1c26;
      --card-hover: #242533;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(59, 130, 246, 0.4);
      --text: #f4f4f6;
      --text-secondary: #d1d5db;
      --muted: #9ca3af;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --ai-bubble: #22232f;
      --user-bubble: #1d4ed8;
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-main);
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Screen Shake & Damage Flash FX */
    #game-container.damaged {
      animation: screenShake 0.45s ease-in-out;
    }

    .damage-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      background: radial-gradient(circle, transparent 35%, rgba(239, 68, 68, 0.85) 100%);
      opacity: 0;
      transition: opacity 0.1s ease;
      z-index: 99999;
    }
    .damage-overlay.active {
      opacity: 1;
      animation: flashRed 0.5s forwards ease-out;
    }

    @keyframes screenShake {
      0% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-12px, 8px) rotate(-1.5deg); }
      40% { transform: translate(12px, -8px) rotate(1.5deg); }
      60% { transform: translate(-8px, -6px) rotate(-0.8deg); }
      80% { transform: translate(8px, 6px) rotate(0.8deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    @keyframes flashRed {
      0% { opacity: 0.95; }
      100% { opacity: 0; }
    }

    @keyframes pulseTimer {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.75; }
    }

    @keyframes pulseBleed {
      0%, 100% { color: var(--warn); }
      50% { color: var(--danger); transform: scale(1.04); }
    }

    /* Dynamic MindShield Dialogue Box Animations (Pivots, Shrinks, Grows) */
    @keyframes lectureSnap {
      0% { transform: scale(0.92) rotate(0deg); }
      30% { transform: scale(1.08) rotate(-4.5deg) translateY(-4px); }
      60% { transform: scale(1.03) rotate(-2.5deg) translateY(-2px); }
      100% { transform: scale(1.04) rotate(-3deg); }
    }

    @keyframes rushVibrate {
      0% { transform: scale(0.97) rotate(2deg); }
      25% { transform: scale(1.03) rotate(-2deg) translateY(-3px); }
      50% { transform: scale(0.99) rotate(2.5deg); }
      75% { transform: scale(1.04) rotate(-1.5deg) translateY(2px); }
      100% { transform: scale(1.02) rotate(1.5deg); }
    }

    @keyframes praiseSwell {
      0% { transform: scale(0.95) rotate(0deg); }
      50% { transform: scale(1.07) rotate(0deg) translateY(-4px); }
      100% { transform: scale(1.03) rotate(0deg); }
    }

    @keyframes neutralPulse {
      0% { transform: scale(0.98); }
      100% { transform: scale(1); }
    }

    /* Top HUD */
    .hud {
      position: sticky;
      top: 0;
      background: rgba(19, 20, 28, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 16px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .hud-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .hud-title {
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--primary);
      text-transform: uppercase;
      font-family: var(--font-mono);
    }

    .btn-hub-nav {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-family: var(--font-main);
      font-size: 12.5px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-hub-nav:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .stats-group {
      display: flex;
      gap: 32px;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      font-size: 13px;
    }

    .stat-label { 
      color: var(--muted); 
      text-transform: uppercase; 
      margin-bottom: 4px; 
      font-size: 11px; 
      letter-spacing: 0.8px;
      font-weight: 600;
    }
    .stat-value { 
      font-weight: 800; 
      font-size: 16px; 
      font-family: var(--font-mono);
      transition: color 0.3s ease;
    }
    .health-val { color: var(--success); }
    .task-val { color: var(--primary); }
    .task-val.bleeding { animation: pulseBleed 0.8s infinite ease-in-out; }

    .meter-bar {
      width: 140px;
      height: 8px;
      background: #23242f;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 6px;
    }
    .meter-fill { height: 100%; transition: width 0.35s ease, background-color 0.35s ease; }
    #health-fill { background: var(--success); width: 100%; }
    #task-fill { background: var(--primary); width: 100%; }

    /* Layout Wrapper */
    .game-layout {
      max-width: 1320px;
      margin: 28px auto 64px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 28px;
      align-items: start;
    }

    .game-layout.full-width {
      grid-template-columns: 1fr;
      max-width: 900px;
    }

    .main-wrap {
      width: 100%;
      min-width: 0;
    }

    /* Start Screen (Fully Centered Alignment) */
    .start-screen-container {
      padding: 30px 0 60px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-kicker {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--primary);
      font-family: var(--font-mono);
      margin-bottom: 12px;
      text-align: center;
    }

    .hero-title {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
      margin: 0 0 18px;
      line-height: 1.25;
      text-align: center;
    }

    .hero-goal-statement {
      font-size: 18px;
      line-height: 1.7;
      color: #e4e4e7;
      margin: 0 auto 36px;
      max-width: 760px;
      font-weight: 400;
      text-align: center;
    }

    .cta-row {
      margin-bottom: 56px;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .divider-line {
      height: 1px;
      background: var(--border);
      margin: 0 auto 48px;
      width: 100%;
      max-width: 700px;
    }

    .briefing-heading {
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-family: var(--font-mono);
      margin: 0 0 36px;
      text-align: center;
    }

    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 36px 48px;
      width: 100%;
      text-align: center;
    }

    .category-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    .category-header {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
    }

    .category-icon {
      font-size: 18px;
    }

    .category-desc {
      font-size: 14.5px;
      line-height: 1.7;
      color: var(--muted);
      margin: 0;
      text-align: center;
      max-width: 400px;
    }

    /* Reactive MindShield Dialogue Panel */
    .mindshield-side-panel {
      position: sticky;
      top: 100px;
      z-index: 90;
    }

    .mindshield-bubble-box {
      background: #181924;
      border: 1.5px solid rgba(59, 130, 246, 0.4);
      border-radius: 20px;
      padding: 22px 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      transition: border-color 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
      transform-origin: top center;
    }

    .mindshield-dialogue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 10px;
    }

    .mindshield-name-tag {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--primary);
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mindshield-name-tag::before {
      content: '🛡️';
      font-size: 14px;
    }

    .mindshield-tone-tag {
      font-size: 10.5px;
      font-weight: 800;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
    }

    .mindshield-bubble-text {
      font-size: 14px;
      line-height: 1.65;
      color: #f4f4f7;
      font-weight: 500;
      margin: 0 0 14px;
      font-style: italic;
    }

    .mindshield-bubble-time {
      display: block;
      font-size: 10px;
      color: var(--muted);
      font-family: var(--font-mono);
      text-align: right;
      letter-spacing: 0.5px;
    }

    /* Dynamic Tone Modifiers (Shrink, Grow, Pivot, Shake) */
    .mindshield-bubble-box.tone-lecture {
      border-color: var(--danger);
      background: #1f1216;
      box-shadow: 0 18px 48px rgba(239, 68, 68, 0.35);
      animation: lectureSnap 0.4s ease-out forwards;
    }
    .mindshield-bubble-box.tone-lecture .mindshield-name-tag { color: var(--danger); }
    .mindshield-bubble-box.tone-lecture .mindshield-tone-tag { color: var(--danger); }

    .mindshield-bubble-box.tone-rush {
      border-color: var(--warn);
      background: #1f1911;
      box-shadow: 0 18px 48px rgba(245, 158, 11, 0.35);
      animation: rushVibrate 0.4s ease-in-out forwards;
    }
    .mindshield-bubble-box.tone-rush .mindshield-name-tag { color: var(--warn); }
    .mindshield-bubble-box.tone-rush .mindshield-tone-tag { color: var(--warn); }

    .mindshield-bubble-box.tone-praise {
      border-color: var(--success);
      background: #101c15;
      box-shadow: 0 18px 48px rgba(16, 185, 129, 0.35);
      animation: praiseSwell 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .mindshield-bubble-box.tone-praise .mindshield-name-tag { color: var(--success); }
    .mindshield-bubble-box.tone-praise .mindshield-tone-tag { color: var(--success); }

    .mindshield-bubble-box.tone-neutral {
      border-color: rgba(59, 130, 246, 0.4);
      background: #181924;
      animation: neutralPulse 0.3s ease-out forwards;
    }

    /* Scenario Header & Timer */
    .scenario-header {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px 28px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .scenario-title { 
      font-size: 16px; 
      font-weight: 700; 
      color: #fff; 
      flex: 1; 
      line-height: 1.5;
    }
    
    .scenario-timer {
      font-size: 15px;
      color: var(--primary);
      font-weight: 800;
      background: #191a24;
      padding: 8px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      white-space: nowrap;
      font-family: var(--font-mono);
      letter-spacing: 1px;
      transition: color 0.3s ease, border-color 0.3s ease;
    }

    .scenario-timer.urgent {
      color: var(--danger) !important;
      border-color: var(--danger) !important;
      animation: pulseTimer 0.6s infinite ease-in-out;
    }

    /* Live Chat Window */
    .chat-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      min-height: 420px;
      max-height: 520px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 28px;
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.45);
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 85%;
    }

    .msg-row.user { align-self: flex-end; align-items: flex-end; }
    .msg-row.ai { align-self: flex-start; align-items: flex-start; }

    .msg-sender { 
      font-size: 11px; 
      font-weight: 700;
      color: var(--muted); 
      margin-bottom: 6px; 
      text-transform: uppercase; 
      letter-spacing: 1px;
      font-family: var(--font-mono);
    }
    
    .msg-bubble {
      padding: 16px 22px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.7;
      white-space: pre-wrap;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    }

    .msg-row.user .msg-bubble { 
      background: var(--user-bubble); 
      color: #fff; 
      border-bottom-right-radius: 4px; 
    }
    
    .msg-row.ai .msg-bubble { 
      background: var(--ai-bubble); 
      color: var(--text); 
      border: 1px solid var(--border); 
      border-bottom-left-radius: 4px; 
    }

    /* Decision Panel */
    .decision-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .decision-title {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 18px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 700;
      font-family: var(--font-mono);
    }

    .choice-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .choice-btn {
      background: #222330;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 18px 24px;
      border-radius: 12px;
      font-size: 14.5px;
      font-family: var(--font-main);
      line-height: 1.5;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .choice-btn:hover {
      background: #2d2e40;
      border-color: var(--primary);
      transform: translateX(6px);
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.15);
    }

    .choice-arrow {
      font-size: 16px;
      color: var(--primary);
      font-weight: bold;
    }

    /* Interactive Minigame Components */
    .task-minigame {
      background: #171823;
      border: 1px solid var(--primary);
      border-radius: 14px;
      padding: 20px;
      margin: 14px 0;
      width: 100%;
    }

    .task-item {
      background: #232433;
      border: 1px solid var(--border);
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      gap: 16px;
    }

    .task-controls {
      display: flex;
      gap: 8px;
    }

    .task-btn-action {
      background: #2e3042;
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .task-btn-action:hover { background: var(--primary); border-color: var(--primary); }

    .task-btn-delete {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .task-btn-delete:hover { background: var(--danger); color: #fff; }

    /* Report Card */
    .report-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
    }

    .rank-stamp {
      display: inline-block;
      font-size: 38px;
      font-weight: 900;
      padding: 12px 32px;
      border-radius: 16px;
      margin: 16px 0 24px;
      letter-spacing: 2px;
      font-family: var(--font-mono);
    }

    .rank-S { color: var(--success); border: 3px solid var(--success); background: rgba(16, 185, 129, 0.1); }
    .rank-B { color: var(--warn); border: 3px solid var(--warn); background: rgba(245, 158, 11, 0.1); }
    .rank-F { color: var(--danger); border: 3px solid var(--danger); background: rgba(239, 68, 68, 0.1); }

    .btn-action {
      padding: 16px 40px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      font-family: var(--font-main);
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s ease;
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
      letter-spacing: 0.5px;
    }
    .btn-action:hover { 
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.5);
    }

    @media (max-width: 1024px) {
      .game-layout {
        grid-template-columns: 1fr;
      }
      .mindshield-side-panel {
        position: static;
        margin-top: 20px;
      }
      .categories-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div id="damage-overlay" class="damage-overlay"></div>

  <div id="game-container">
    <header class="hud">
      <div class="hud-left">
        <div class="hud-title">⚡ MINDSHIELD // OPERATOR TRAINING</div>
        <button id="btn-return-hub" class="btn-hub-nav" style="display:none;" onclick="renderStartScreen()">← Main Menu</button>
      </div>
      <div class="stats-group">
        <div class="stat-box">
          <span class="stat-label">Brain Health (HP)</span>
          <span id="health-text" class="stat-value health-val">100%</span>
          <div class="meter-bar"><div id="health-fill" class="meter-fill"></div></div>
        </div>
        <div class="stat-box">
          <span class="stat-label" id="task-label">Task Completion</span>
          <span id="task-text" class="stat-value task-val">100%</span>
          <div class="meter-bar"><div id="task-fill" class="meter-fill"></div></div>
        </div>
      </div>
    </header>

    <div class="game-layout full-width" id="layout-container">
      <main class="main-wrap" id="main-content">
        <!-- Dynamic Content -->
      </main>

      <!-- Streamlined Reactive MindShield Dialogue Panel -->
      <aside class="mindshield-side-panel" id="mindshield-panel" style="display: none;">
        <div class="mindshield-bubble-box" id="mindshield-bubble">
          <div class="mindshield-dialogue-header">
            <span class="mindshield-name-tag">MINDSHIELD</span>
            <span class="mindshield-tone-tag" id="mindshield-tone-tag">MONITORING</span>
          </div>
          <p class="mindshield-bubble-text" id="mindshield-speech">"Training simulation online. I am observing your decision architecture. Do not disappoint me."</p>
          <span class="mindshield-bubble-time" id="mindshield-timestamp">SYSTEM ACTIVE</span>
        </div>
      </aside>
    </div>
  </div>

  <script>
    // ---------------------------------------------------------------------------
    // State Engine & Decay System
    // ---------------------------------------------------------------------------
    let brainHealth = 100;
    let taskProgress = 100;
    let timerInterval = null;
    let idleInterval = null;
    let secondsRemaining = 600;
    let idleSeconds = 0;
    let taskAuditComplete = false;
    let decayWarned = false;

    const healthText = document.getElementById('health-text');
    const healthFill = document.getElementById('health-fill');
    const taskText = document.getElementById('task-text');
    const taskFill = document.getElementById('task-fill');
    const taskLabel = document.getElementById('task-label');
    const damageOverlay = document.getElementById('damage-overlay');
    const gameContainer = document.getElementById('game-container');
    const btnReturnHub = document.getElementById('btn-return-hub');
    const mainContent = document.getElementById('main-content');
    const mindshieldPanel = document.getElementById('mindshield-panel');
    const mindshieldBubble = document.getElementById('mindshield-bubble');
    const mindshieldToneTag = document.getElementById('mindshield-tone-tag');
    const mindshieldSpeech = document.getElementById('mindshield-speech');
    const mindshieldTimestamp = document.getElementById('mindshield-timestamp');
    const layoutContainer = document.getElementById('layout-container');

    // ---------------------------------------------------------------------------
    // Reactive Dynamic Speech Engine (Shrink, Grow, Pivot, Vibrate)
    // ---------------------------------------------------------------------------
    function mindshieldSpeak(text, mood = 'neutral') {
      mindshieldBubble.classList.remove('tone-lecture', 'tone-rush', 'tone-praise', 'tone-neutral');
      void mindshieldBubble.offsetWidth; // Trigger CSS reflow to re-play animations smoothly

      if (mood === 'lecture') {
        mindshieldBubble.classList.add('tone-lecture');
        mindshieldToneTag.textContent = '● LECTURING';
      } else if (mood === 'rush') {
        mindshieldBubble.classList.add('tone-rush');
        mindshieldToneTag.textContent = '▲ RUSHING';
      } else if (mood === 'praise') {
        mindshieldBubble.classList.add('tone-praise');
        mindshieldToneTag.textContent = '★ SOVEREIGN';
      } else {
        mindshieldBubble.classList.add('tone-neutral');
        mindshieldToneTag.textContent = '■ MONITORING';
      }

      mindshieldSpeech.textContent = `"${text}"`;
      mindshieldTimestamp.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      resetIdleTimer();
    }

    function resetIdleTimer() {
      idleSeconds = 0;
    }

    function startIdleMonitor() {
      if (idleInterval) clearInterval(idleInterval);
      idleSeconds = 0;

      idleInterval = setInterval(() => {
        idleSeconds++;
        if (idleSeconds === 12) {
          mindshieldSpeak("Why are you freezing up? The clock is running! Staring at options doesn't get things done!", "rush");
        } else if (idleSeconds === 24) {
          mindshieldSpeak("Operator! Cognitive hesitation is fatal. Pick a strategy or surrender your prefrontal cortex!", "rush");
        }
      }, 1000);
    }

    function stopIdleMonitor() {
      if (idleInterval) clearInterval(idleInterval);
      idleInterval = null;
    }

    // ---------------------------------------------------------------------------
    // Timer System with Real-Time Task Completion Decay
    // ---------------------------------------------------------------------------
    function startTimer(totalSeconds) {
      if (timerInterval) clearInterval(timerInterval);
      secondsRemaining = totalSeconds;
      taskAuditComplete = false;
      decayWarned = false;
      updateTimerDisplay();
      startIdleMonitor();

      let warnedHalf = false;
      let warnedUrgent = false;

      timerInterval = setInterval(() => {
        secondsRemaining--;
        updateTimerDisplay();

        const elapsedSeconds = totalSeconds - secondsRemaining;

        // TASK COMPLETION DECAY: Kicks in after 1 minute (60s) unless audited in task editor
        if (elapsedSeconds > 60 && !taskAuditComplete) {
          // Decays from 100% down to 0% across the remaining 540 seconds (9 minutes)
          const decayProgress = (elapsedSeconds - 60) / (totalSeconds - 60);
          taskProgress = Math.max(0, Math.round(100 - (decayProgress * 100)));
          updateHUD();

          if (!decayWarned) {
            decayWarned = true;
            taskText.classList.add('bleeding');
            taskLabel.textContent = "Task Completion (DECAYING)";
            mindshieldSpeak("⏱️ TASK DECAY ACTIVE! 1 minute has elapsed without optimizing your plan! You are bleeding Task Completion every second unless you cut wasted tasks in the Task Editor!", "rush");
          }
        }

        if (secondsRemaining === Math.floor(totalSeconds / 2) && !warnedHalf) {
          warnedHalf = true;
          mindshieldSpeak(`HALF-TIME! Look at the timer! Half your window is gone and you're still prompting!`, 'rush');
        }

        if (secondsRemaining === 60 && !warnedUrgent) {
          warnedUrgent = true;
          mindshieldSpeak(`60 SECONDS REMAINING! Move, move, move! Finish your execution!`, 'rush');
        } else if (secondsRemaining === 15 && !warnedUrgent) {
          warnedUrgent = true;
          mindshieldSpeak(`15 SECONDS! Make the call now or suffer a total cognitive timeout!`, 'rush');
        }

        if (secondsRemaining <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          handleTimeout();
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      stopIdleMonitor();
      const simTimer = document.getElementById('sim-timer');
      if (simTimer) simTimer.classList.remove('urgent');
      taskText.classList.remove('bleeding');
      taskLabel.textContent = "Task Completion";
    }

    function updateTimerDisplay() {
      const simTimer = document.getElementById('sim-timer');
      if (!simTimer) return;

      const m = Math.floor(secondsRemaining / 60);
      const s = secondsRemaining % 60;
      simTimer.textContent = `⏱️ T-MINUS ${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

      if (secondsRemaining <= 60) {
        simTimer.classList.add('urgent');
      } else {
        simTimer.classList.remove('urgent');
      }
    }

    function handleTimeout() {
      applyDamage(35, "Cognitive Paralysis: You let the timer expire without executing a strategy.");
      mindshieldSpeak("TIMEOUT! You stood there like a mannequin while reality overtook you. Simulation failed!", "lecture");
      injectMessage('ai', 'TIME EXPIRED! The scenario window has closed.');
      taskProgress = 0;
      updateHUD();
      setTimeout(() => finishScenario(), 1500);
    }

    function applyDamage(amount, reason) {
      brainHealth = Math.max(0, brainHealth - amount);
      updateHUD();

      damageOverlay.classList.remove('active');
      gameContainer.classList.remove('damaged');
      void damageOverlay.offsetWidth;
      void gameContainer.offsetWidth;
      damageOverlay.classList.add('active');
      gameContainer.classList.add('damaged');
    }

    function addHealth(amount, reason) {
      brainHealth = Math.min(100, brainHealth + amount);
      updateHUD();
    }

    function setTaskProgress(amount) {
      taskProgress = Math.min(100, Math.max(0, amount));
      updateHUD();
    }

      healthText.textContent = `${brainHealth}%`;
      healthFill.style.width = `${brainHealth}%`;
      taskText.textContent = `${taskProgress}%`;

          action: () => {
            addHealth(10, "Strategic Optical Management.");
            setTaskProgress(Math.min(taskProgress, 90));
            finishScenario();
          }
        },
        {
          text: 'b2. Ask AI to write an aesthetic ambient music playlist for when the guest walks in.',
          action: () => {
            applyDamage(25, "Aesthetic Distraction Trap.");
            mindshieldSpeak("You tried to DJ a Spotify playlist while socks were strewn across your rug!", "lecture");
            setTaskProgress(Math.min(taskProgress, 60));
            finishScenario();
          }
        }
      ]);
    }

    // --- Task Manager Minigame (Halts Decay & Locks 100% Task Completion) ---
    function s1_launchTaskMinigame(fromRankingBranch, targetMaxHP) {
      mindshieldSpeak("AUDIT ACTIVE! Remove the hallucinated bloat and arrange priority. Cutting bad tasks will HALT the time decay!", "rush");
      
      const controlTitle = document.getElementById('control-title');
      const choiceContainer = document.getElementById('choice-container');
      controlTitle.textContent = "Interactive Task Prioritizer (Halts Decay on Execution):";

      let taskItems = [
        { id: 1, text: "Trash into garbage bag", isCrucial: true },
        { id: 2, text: "Dirty clothes into hamper", isCrucial: true },
        { id: 3, text: "Alphabetize books & sort DVD cases", isCrucial: false },
        { id: 4, text: "Straighten bed & pillows", isCrucial: true },
        { id: 5, text: "Scrub floor tile grout with toothbrush", isCrucial: false }
      ];

      function renderList() {
        choiceContainer.innerHTML = `
          <div class="task-minigame" id="task-list-box"></div>
          <div style="display:flex; gap:12px; margin-top:16px;">
            <button id="btn-exec-plan" class="btn-action" style="flex:1; margin-top:0;">Execute Verified Plan (Lock Task Completion)</button>
          </div>
        `;

        const box = document.getElementById('task-list-box');
        box.innerHTML = taskItems.map((item, idx) => `
          <div class="task-item">
            <span><strong>#${idx + 1}</strong> ${item.text}</span>
            <div class="task-controls">
              <button class="task-btn-action" onclick="s1_moveTask(${idx}, -1)">▲</button>
              <button class="task-btn-action" onclick="s1_moveTask(${idx}, 1)">▼</button>
              <button class="task-btn-delete" onclick="s1_removeTask(${item.id})">Remove</button>
            </div>
          </div>
        `).join('');

        document.getElementById('btn-exec-plan').addEventListener('click', () => {
          stopTimer();
          taskAuditComplete = true; // HALT THE DECAY
          taskText.classList.remove('bleeding');
          taskLabel.textContent = "Task Completion";

          const remainingBad = taskItems.filter(t => !t.isCrucial).length;
          const crucialKept = taskItems.filter(t => t.isCrucial).length;

          if (remainingBad === 0 && crucialKept === 3) {
            addHealth(15, "Perfect plan audit: Eliminated all AI distractions.");
            mindshieldSpeak("FLAWLESS AUDIT! You halted the time decay, excised the bloat, and locked in 100% Task Completion!", "praise");
            setTaskProgress(100);
          } else if (crucialKept < 3) {
            applyDamage(15, "Removed critical emergency cleaning tasks.");
            mindshieldSpeak("You deleted essential tasks! Bed and trash must be addressed!", "lecture");
            setTaskProgress(70);
          } else {
            applyDamage(10, `Left ${remainingBad} time-wasting tasks in the plan.`);
            mindshieldSpeak(`You left ${remainingBad} hallucinated distractions in your plan. Task completion reduced.`, "lecture");
            setTaskProgress(85);
          }
          finishScenario();
        });
      }

      window.s1_moveTask = (index, dir) => {
        const newIdx = index + dir;
        if (newIdx < 0 || newIdx >= taskItems.length) return;
        const temp = taskItems[index];
        taskItems[index] = taskItems[newIdx];
        taskItems[newIdx] = temp;
        renderList();
      };

      window.s1_removeTask = (id) => {
        const target = taskItems.find(t => t.id === id);
        if (!target.isCrucial) {
          addHealth(5, `Caught AI Hallucination / Waste: "${target.text}"`);
          mindshieldSpeak(`Good catch! Removing "${target.text}" saved 3 crucial minutes and stopped time decay.`, "praise");
        } else {
          applyDamage(10, `Accidentally deleted critical task: "${target.text}"`);
          mindshieldSpeak(`Watch it! "${target.text}" is a crucial emergency task!`, "lecture");
        }
        taskItems = taskItems.filter(t => t.id !== id);
        renderList();
      };

      renderList();
    }

    // ---------------------------------------------------------------------------
    // REPORT CARD & DEBRIEF
    // ---------------------------------------------------------------------------
    function finishScenario() {
      stopTimer();
      setTimeout(() => {
        let rank = 'S';
        let rankClass = 'rank-S';
        let summaryText = 'Outstanding cognitive sovereignty! You treated the AI as an instrument while retaining critical judgment.';

        if (brainHealth < 50 || taskProgress < 50) {
          rank = 'F';
          rankClass = 'rank-F';
          summaryText = 'Critical Cognitive Dependency Detected. You exhibited total decision offloading, swallowed hallucinations, or let the clock bleed out your task completion.';
          mindshieldSpeak("SIMULATION FAILED. You demonstrated severe cognitive outsourcing. Re-calibrate immediately.", "lecture");
        } else if (brainHealth < 80 || taskProgress < 80) {
          rank = 'B';
          rankClass = 'rank-B';
          summaryText = 'Moderate Dependence. You occasionally let the machine dictate your planning or hesitated under pressure.';
          mindshieldSpeak("Simulation passed with caveats. You survived, but you still lean on the crutch too often.", "neutral");
        } else {
          mindshieldSpeak("EXEMPLARY SOVEREIGNTY. You held the blade yourself instead of letting the machine steer.", "praise");
        }

        mainContent.innerHTML = `
          <div class="report-card">
            <div class="hud-title" style="margin-bottom: 20px;">MISSION DEBRIEF // CLEANING SIMULATION</div>
            <div class="rank-stamp ${rankClass}">RANK: ${rank}</div>
            <h2 style="margin: 0 0 8px; font-size: 22px;">Cognitive HP Remaining: ${brainHealth}%</h2>
            <h3 style="margin: 0 0 20px; font-size: 16px; color: var(--muted); font-weight: 500;">Task Completion Score: ${taskProgress}%</h3>
            <p style="color: var(--text-secondary); max-width: 600px; margin: 0 auto 28px; line-height: 1.7; font-size: 15px;">
              ${summaryText}
            </p>
            <div style="display:flex; justify-content:center; gap:16px;">
              <button onclick="initSimulation()" class="btn-action">Replay Simulation</button>
              <button onclick="renderStartScreen()" class="btn-action" style="background:#222330; box-shadow:none;">Main Menu</button>
            </div>
          </div>
        `;
      }, 1200);
    }

    // Launch to clean centered start screen
    renderStartScreen();
  </script>
