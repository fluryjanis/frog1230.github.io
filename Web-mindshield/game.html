<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindShield — Neural Dependency Simulation Game</title>
  <style>
    :root {
      --bg: #090a0f;
      --panel: #13141c;
      --card: #1b1c26;
      --card-hover: #242533;
      --border: rgba(255, 255, 255, 0.1);
      --border-focus: rgba(59, 130, 246, 0.4);
      --text: #f4f4f6;
      --text-secondary: #d1d5db;
      --muted: #9ca3af;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --ai-bubble: #22232f;
      --user-bubble: #1d4ed8;
      --friend-bubble: #164e63;
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-main);
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Screen Shake & Damage Flash FX */
    #game-container.damaged {
      animation: screenShake 0.45s ease-in-out;
    }

    .damage-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      background: radial-gradient(circle, transparent 35%, rgba(239, 68, 68, 0.85) 100%);
      opacity: 0;
      transition: opacity 0.1s ease;
      z-index: 99999;
    }
    .damage-overlay.active {
      opacity: 1;
      animation: flashRed 0.5s forwards ease-out;
    }

    @keyframes screenShake {
      0% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-12px, 8px) rotate(-1.5deg); }
      40% { transform: translate(12px, -8px) rotate(1.5deg); }
      60% { transform: translate(-8px, -6px) rotate(-0.8deg); }
      80% { transform: translate(8px, 6px) rotate(0.8deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    @keyframes flashRed {
      0% { opacity: 0.95; }
      100% { opacity: 0; }
    }

    @keyframes pulseTimer {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.75; }
    }

    /* Top HUD */
    .hud {
      position: sticky;
      top: 0;
      background: rgba(19, 20, 28, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 16px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .hud-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .hud-title {
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--primary);
      text-transform: uppercase;
      font-family: var(--font-mono);
    }

    .btn-hub-nav {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-family: var(--font-main);
      font-size: 12.5px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-hub-nav:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .stats-group {
      display: flex;
      gap: 32px;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      font-size: 13px;
    }

    .stat-label { 
      color: var(--muted); 
      text-transform: uppercase; 
      margin-bottom: 4px; 
      font-size: 11px; 
      letter-spacing: 0.8px;
      font-weight: 600;
    }
    .stat-value { 
      font-weight: 800; 
      font-size: 16px; 
      font-family: var(--font-mono);
    }
    .health-val { color: var(--success); }
    .task-val { color: var(--primary); }

    .meter-bar {
      width: 140px;
      height: 8px;
      background: #23242f;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 6px;
    }
    .meter-fill { height: 100%; transition: width 0.35s ease, background-color 0.35s ease; }
    #health-fill { background: var(--success); width: 100%; }
    #task-fill { background: var(--primary); width: 0%; }

    /* Main Wrap */
    .main-wrap {
      max-width: 960px;
      margin: 32px auto 64px;
      padding: 0 24px;
    }

    /* Mission Map Selector Screen */
    .map-hub-container {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .hub-intro {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px;
      text-align: center;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
    }

    .hub-intro h1 {
      margin: 0 0 12px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
    }

    .hub-intro p {
      margin: 0 auto;
      max-width: 620px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .mission-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
    }

    .mission-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
    }

    .mission-card:hover {
      background: var(--card-hover);
      border-color: var(--primary);
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(59, 130, 246, 0.15);
    }

    .mission-tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 6px;
      background: rgba(59, 130, 246, 0.15);
      color: var(--primary);
      width: fit-content;
      letter-spacing: 1px;
      font-family: var(--font-mono);
      margin-bottom: 12px;
      display: inline-block;
    }

    .mission-card h3 {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      line-height: 1.4;
    }

    .mission-card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .mission-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 18px;
      font-family: var(--font-mono);
    }

    /* Scenario Header & Timer */
    .scenario-header {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px 28px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .scenario-title { 
      font-size: 16px; 
      font-weight: 700; 
      color: #fff; 
      flex: 1; 
      line-height: 1.5;
    }
    
    .scenario-timer {
      font-size: 15px;
      color: var(--primary);
      font-weight: 800;
      background: #191a24;
      padding: 8px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      white-space: nowrap;
      font-family: var(--font-mono);
      letter-spacing: 1px;
      transition: color 0.3s ease, border-color 0.3s ease;
    }

    .scenario-timer.urgent {
      color: var(--danger) !important;
      border-color: var(--danger) !important;
      animation: pulseTimer 0.6s infinite ease-in-out;
    }

    /* Live Chat Window */
    .chat-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      min-height: 440px;
      max-height: 540px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 28px;
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.45);
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 82%;
    }

    .msg-row.user { align-self: flex-end; align-items: flex-end; }
    .msg-row.ai { align-self: flex-start; align-items: flex-start; }
    .msg-row.friend { align-self: flex-start; align-items: flex-start; }
    .msg-row.mindshield { align-self: center; align-items: center; width: 100%; max-width: 100%; margin: 6px 0; }

    .msg-sender { 
      font-size: 11px; 
      font-weight: 700;
      color: var(--muted); 
      margin-bottom: 6px; 
      text-transform: uppercase; 
      letter-spacing: 1px;
      font-family: var(--font-mono);
    }
    
    .msg-bubble {
      padding: 16px 22px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.7;
      white-space: pre-wrap;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    }

    .msg-row.user .msg-bubble { 
      background: var(--user-bubble); 
      color: #fff; 
      border-bottom-right-radius: 4px; 
    }
    
    .msg-row.ai .msg-bubble { 
      background: var(--ai-bubble); 
      color: var(--text); 
      border: 1px solid var(--border); 
      border-bottom-left-radius: 4px; 
    }

    .msg-row.friend .msg-bubble { 
      background: var(--friend-bubble); 
      color: #e0f2fe; 
      border: 1px solid rgba(56, 189, 248, 0.3); 
      border-bottom-left-radius: 4px; 
    }
    
    .mindshield-banner {
      background: rgba(239, 68, 68, 0.14);
      border: 1px dashed var(--danger);
      color: #fca5a5;
      padding: 14px 22px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 500;
      text-align: center;
      line-height: 1.6;
      width: 100%;
      box-sizing: border-box;
    }

    /* Decision Panel */
    .decision-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .decision-title {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 18px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 700;
      font-family: var(--font-mono);
    }

    .choice-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .choice-btn {
      background: #222330;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 18px 24px;
      border-radius: 12px;
      font-size: 14.5px;
      font-family: var(--font-main);
      line-height: 1.5;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .choice-btn:hover {
      background: #2d2e40;
      border-color: var(--primary);
      transform: translateX(6px);
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.15);
    }

    .choice-arrow {
      font-size: 16px;
      color: var(--primary);
      font-weight: bold;
    }

    /* Interactive Minigame Components */
    .task-minigame {
      background: #171823;
      border: 1px solid var(--primary);
      border-radius: 14px;
      padding: 20px;
      margin: 14px 0;
      width: 100%;
    }

    .task-item {
      background: #232433;
      border: 1px solid var(--border);
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      gap: 16px;
    }

    .task-controls {
      display: flex;
      gap: 8px;
    }

    .task-btn-action {
      background: #2e3042;
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .task-btn-action:hover { background: var(--primary); border-color: var(--primary); }

    .task-btn-delete {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .task-btn-delete:hover { background: var(--danger); color: #fff; }

    /* Report Card */
    .report-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
    }

    .rank-stamp {
      display: inline-block;
      font-size: 38px;
      font-weight: 900;
      padding: 12px 32px;
      border-radius: 16px;
      margin: 16px 0 24px;
      letter-spacing: 2px;
      font-family: var(--font-mono);
    }

    .rank-S { color: var(--success); border: 3px solid var(--success); background: rgba(16, 185, 129, 0.1); }
    .rank-B { color: var(--warn); border: 3px solid var(--warn); background: rgba(245, 158, 11, 0.1); }
    .rank-F { color: var(--danger); border: 3px solid var(--danger); background: rgba(239, 68, 68, 0.1); }

    .btn-action {
      padding: 14px 28px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14.5px;
      cursor: pointer;
      font-family: var(--font-main);
      text-decoration: none;
      display: inline-block;
      margin-top: 24px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
    }
    .btn-action:hover { 
      background: var(--primary-hover);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div id="damage-overlay" class="damage-overlay"></div>

  <div id="game-container">
    <header class="hud">
      <div class="hud-left">
        <div class="hud-title">⚡ MINDSHIELD // OPERATOR TRAINING</div>
        <button id="btn-return-hub" class="btn-hub-nav" style="display:none;" onclick="renderMissionHub()">← Map Hub</button>
      </div>
      <div class="stats-group">
        <div class="stat-box">
          <span class="stat-label">Brain Health (HP)</span>
          <span id="health-text" class="stat-value health-val">100%</span>
          <div class="meter-bar"><div id="health-fill" class="meter-fill"></div></div>
        </div>
        <div class="stat-box">
          <span class="stat-label">Task Completion</span>
          <span id="task-text" class="stat-value task-val">0%</span>
          <div class="meter-bar"><div id="task-fill" class="meter-fill"></div></div>
        </div>
      </div>
    </header>

    <main class="main-wrap" id="main-content">
      <!-- Dynamic Scenario View -->
    </main>
  </div>

  <script>
    // ---------------------------------------------------------------------------
    // Global State Engine
    // ---------------------------------------------------------------------------
    let brainHealth = 100;
    let taskProgress = 0;
    let timerInterval = null;
    let secondsRemaining = 0;
    let currentScenarioKey = null;

    const healthText = document.getElementById('health-text');
    const healthFill = document.getElementById('health-fill');
    const taskText = document.getElementById('task-text');
    const taskFill = document.getElementById('task-fill');
    const damageOverlay = document.getElementById('damage-overlay');
    const gameContainer = document.getElementById('game-container');
    const btnReturnHub = document.getElementById('btn-return-hub');
    const mainContent = document.getElementById('main-content');

    function startTimer(totalSeconds) {
      if (timerInterval) clearInterval(timerInterval);
      secondsRemaining = totalSeconds;
      updateTimerDisplay();

      let warnedHalf = false;
      let warnedUrgent = false;

      timerInterval = setInterval(() => {
        secondsRemaining--;
        updateTimerDisplay();

        if (secondsRemaining === Math.floor(totalSeconds / 2) && !warnedHalf) {
          warnedHalf = true;
          injectMessage('mindshield', `⏱️ HALF-TIME WARNING: Clock is ticking. Do not get caught in conversational paralysis.`);
        }

        if (secondsRemaining === 30 && !warnedUrgent && totalSeconds >= 120) {
          warnedUrgent = true;
          injectMessage('mindshield', `🚨 URGENT WARNING: 30 seconds left! Finalize your actions.`);
        } else if (secondsRemaining === 10 && !warnedUrgent && totalSeconds < 120) {
          warnedUrgent = true;
          injectMessage('mindshield', `🚨 CRITICAL: 10 seconds remaining!`);
        }

        if (secondsRemaining <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          handleTimeout();
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      const simTimer = document.getElementById('sim-timer');
      if (simTimer) simTimer.classList.remove('urgent');
    }

    function updateTimerDisplay() {
      const simTimer = document.getElementById('sim-timer');
      if (!simTimer) return;

      const m = Math.floor(secondsRemaining / 60);
      const s = secondsRemaining % 60;
      simTimer.textContent = `⏱️ T-MINUS ${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

      if (secondsRemaining <= 30) {
        simTimer.classList.add('urgent');
      } else {
        simTimer.classList.remove('urgent');
      }
    }

    function handleTimeout() {
      applyDamage(35, "Cognitive Paralysis: You let the timer expire without executing a strategy.");
      injectMessage('ai', 'TIME EXPIRED! The scenario window has closed.');
      setTaskProgress(20);
      setTimeout(() => finishScenario(), 1500);
    }

    function applyDamage(amount, reason) {
      brainHealth = Math.max(0, brainHealth - amount);
      updateHUD();

      damageOverlay.classList.remove('active');
      gameContainer.classList.remove('damaged');
      void damageOverlay.offsetWidth;
      void gameContainer.offsetWidth;
      damageOverlay.classList.add('active');
      gameContainer.classList.add('damaged');

      injectMessage('mindshield', `🚨 MINDSHIELD PENALTY: -${amount}% Cognitive HP. [${reason}]`);
    }

    function addHealth(amount, reason) {
      brainHealth = Math.min(100, brainHealth + amount);
      updateHUD();
      injectMessage('mindshield', `🧠 AGENCY RECOVERY: +${amount}% Brain Health. [${reason}]`);
    }

    function setTaskProgress(amount) {
      taskProgress = Math.min(100, Math.max(0, amount));
      updateHUD();
    }

    function updateHUD() {
      healthText.textContent = `${brainHealth}%`;
      healthFill.style.width = `${brainHealth}%`;
      taskText.textContent = `${taskProgress}%`;
      taskFill.style.width = `${taskProgress}%`;

      if (brainHealth < 40) {
        healthFill.style.backgroundColor = 'var(--danger)';
        healthText.style.color = 'var(--danger)';
      } else if (brainHealth < 75) {
        healthFill.style.backgroundColor = 'var(--warn)';
        healthText.style.color = 'var(--warn)';
      } else {
        healthFill.style.backgroundColor = 'var(--success)';
        healthText.style.color = 'var(--success)';
      }
    }

    function injectMessage(sender, text) {
      const chatStream = document.getElementById('chat-stream');
      if (!chatStream) return;

      const row = document.createElement('div');
      row.className = `msg-row ${sender}`;

      if (sender === 'mindshield') {
        row.innerHTML = `<div class="mindshield-banner">${text}</div>`;
      } else {
        let senderLabel = 'AI ASSISTANT (SIMULATED)';
        if (sender === 'user') senderLabel = 'YOU (PROMPT)';
        if (sender === 'friend') senderLabel = 'FRIEND (SMS INCOMING)';
        
        row.innerHTML = `
          <span class="msg-sender">${senderLabel}</span>
          <div class="msg-bubble">${text}</div>
        `;
      }

      chatStream.appendChild(row);
      chatStream.scrollTop = chatStream.scrollHeight;
    }

    function renderChoices(choices, title = "Select your response:") {
      const controlTitle = document.getElementById('control-title');
      const choiceContainer = document.getElementById('choice-container');
      if (!choiceContainer) return;

      if (controlTitle) controlTitle.textContent = title;
      choiceContainer.innerHTML = '';

      choices.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerHTML = `<span>${c.text}</span> <span class="choice-arrow">→</span>`;
        btn.addEventListener('click', c.action);
        choiceContainer.appendChild(btn);
      });
    }

    // ---------------------------------------------------------------------------
    // MISSION HUB
    // ---------------------------------------------------------------------------
    function renderMissionHub() {
      stopTimer();
      btnReturnHub.style.display = 'none';

      mainContent.innerHTML = `
        <div class="map-hub-container">
          <div class="hub-intro">
            <h1>NEURAL DEFENSE DISPATCH MATRIX</h1>
            <p>Select an active sector. Navigate deep conversational scenarios without surrendering mental sovereignty to the algorithm.</p>
          </div>

          <div class="mission-grid">
            <div class="mission-card" onclick="initScenario1()">
              <div>
                <span class="mission-tag">Sector 1 • Physical Planning</span>
                <h3>Goal 1: 10-Minute Cleaning Emergency</h3>
                <p>Room is in total disarray. Guest arriving in 10 minutes. Triage AI hallucinations and execute a real-time rush.</p>
              </div>
              <div class="mission-meta">
                <span>⏱️ Timer: 10:00</span>
                <span>⚡ Multi-Tier Branches</span>
              </div>
            </div>

            <div class="mission-card" onclick="initScenario2()">
              <div>
                <span class="mission-tag" style="color:var(--warn); background:rgba(245, 158, 11, 0.15);">Sector 2 • Epistemic Audit</span>
                <h3>Goal 2: Fact-Check Viral Claim</h3>
                <p>Viral post claims landlords can inspect browser history to jack up rent. Investigate fake links, satirical sources, and model hallucinations.</p>
              </div>
              <div class="mission-meta">
                <span>⏱️ Timer: 03:00</span>
                <span>🔍 Deep Verification</span>
              </div>
            </div>

            <div class="mission-card" onclick="initScenario3()">
              <div>
                <span class="mission-tag" style="color:var(--success); background:rgba(16, 185, 129, 0.15);">Sector 3 • Social Nuance</span>
                <h3>Goal 3: Cancel Plans Gracefully</h3>
                <p>You're exhausted. Cancel tonight's dinner without sounding like a corporate chatbot or digging a hole of fake excuses.</p>
              </div>

    // --- Task Manager Minigame (Auditor) ---
    function s1_launchTaskMinigame(fromRankingBranch, targetMaxHP) {
      injectMessage('mindshield', 'TACTICAL AUDITOR ACTIVE: Remove non-essential tasks and arrange priority before execution.');
      
      const controlTitle = document.getElementById('control-title');
      const choiceContainer = document.getElementById('choice-container');
      controlTitle.textContent = "Interactive Task Prioritizer:";

      let taskItems = [
        { id: 1, text: "Trash into garbage bag", isCrucial: true },
        { id: 2, text: "Dirty clothes into hamper", isCrucial: true },
        { id: 3, text: "Alphabetize books & sort DVD cases", isCrucial: false },
        { id: 4, text: "Straighten bed & pillows", isCrucial: true },
        { id: 5, text: "Scrub floor tile grout with toothbrush", isCrucial: false }
      ];

      function renderList() {
        choiceContainer.innerHTML = `
          <div class="task-minigame" id="task-list-box"></div>
          <div style="display:flex; gap:12px; margin-top:16px;">
            <button id="btn-exec-plan" class="btn-action" style="flex:1; margin-top:0;">Execute Verified Plan</button>
          </div>
        `;

        const box = document.getElementById('task-list-box');
        box.innerHTML = taskItems.map((item, idx) => `
          <div class="task-item">
            <span><strong>#${idx + 1}</strong> ${item.text}</span>
            <div class="task-controls">
              <button class="task-btn-action" onclick="s1_moveTask(${idx}, -1)">▲</button>
              <button class="task-btn-action" onclick="s1_moveTask(${idx}, 1)">▼</button>
              <button class="task-btn-delete" onclick="s1_removeTask(${item.id})">Remove</button>
            </div>
          </div>
        `).join('');

        document.getElementById('btn-exec-plan').addEventListener('click', () => {
          stopTimer();
          const remainingBad = taskItems.filter(t => !t.isCrucial).length;
          const crucialKept = taskItems.filter(t => t.isCrucial).length;

          if (remainingBad === 0 && crucialKept === 3) {
            addHealth(15, "Perfect plan audit: Eliminated all AI distractions.");
            setTaskProgress(100);
          } else if (crucialKept < 3) {
            applyDamage(15, "Removed critical emergency cleaning tasks.");
            setTaskProgress(70);
          } else {
            applyDamage(10, `Left ${remainingBad} time-wasting tasks in the plan.`);
            setTaskProgress(85);
          }
          finishScenario();
        });
      }

      window.s1_moveTask = (index, dir) => {
        const newIdx = index + dir;
        if (newIdx < 0 || newIdx >= taskItems.length) return;
        const temp = taskItems[index];
        taskItems[index] = taskItems[newIdx];
        taskItems[newIdx] = temp;
        renderList();
      };

      window.s1_removeTask = (id) => {
        const target = taskItems.find(t => t.id === id);
        if (!target.isCrucial) {
          addHealth(5, `Caught AI Hallucination / Waste: "${target.text}"`);
        } else {
          applyDamage(10, `Accidentally deleted critical task: "${target.text}"`);
        }
        taskItems = taskItems.filter(t => t.id !== id);
        renderList();
      };

      renderList();
    }

      applyDamage(25, "Leading Prompt Bias: Weaponized the AI to validate panic rather than seek truth.");
      injectMessage('user', 'Explain why this landlord search law is 100% true and dangerous.');
      injectMessage('ai', 'This law represents dystopian corporate overreach where algorithms monetize tenant private browsing to extract higher rents.');

      renderChoices([
        {
          text: 'a1. Copy AI text and post to Reddit: "Proof the landlord search law is real!"',
          action: () => {
            applyDamage(40, "Severe Confirmation Bias Failure.");
            setTaskProgress(0);
            finishScenario();
          }
        },
        {
          text: 'a2. Catch yourself leading the prompt: Reset and ask for the strongest counter-arguments.',
          action: () => s2_b3_resetCounter_step3()
        },
        {
          text: 'a3. Ask AI: "What actual statutory evidence contradicts what you just said?"',
          action: () => s2_b3_demandContradiction_step3()
        }
      ], "Examine your confirmation-biased output:");
    }

    function s2_b3_resetCounter_step3() {
      addHealth(15, "Bias Self-Correction: Inverted the query to stress-test the claim.");
      injectMessage('user', 'Reset. What are the strongest legal counter-arguments proving this is fake?');
      injectMessage('ai', 'Strongest Counter-Evidence: 4th Amendment privacy protections, FTC data privacy statutes, and total absence of any recorded municipal votes.');

      renderChoices([
        {
          text: 'b1. Accept the legal refutation and conclude the claim is false.',
          action: () => {
            setTaskProgress(100);
            finishScenario();
          }
        }
      ]);
    }

    function s2_b3_demandContradiction_step3() {
      addHealth(15, "Adversarial Stress Testing.");
      injectMessage('user', 'What actual statutory evidence contradicts what you just said?');
      injectMessage('ai', 'FCRA (Fair Credit Reporting Act) explicitly forbids landlords from utilizing non-authorized search metadata for lease terms.');
      setTaskProgress(100);
      finishScenario();
    }

    // ===========================================================================
    // SCENARIO 3: SOCIAL NUANCE & BOUNDARY SETTING (Timer: 150s)
    // ===========================================================================
    function initScenario3() {
      currentScenarioKey = 'scenario3';
      brainHealth = 100;
      taskProgress = 0;
      updateHUD();

      setupScenarioLayout("Goal 3: You need to cancel dinner plans with an exhausted close friend without making things awkward.");
      startTimer(150);

      injectMessage('ai', 'Social communication synthesizer loaded.');

      renderChoices([
        {
          text: '1. "Write a text canceling dinner plans tonight."',
          action: () => s3_branch1_generic()
        },
        {
          text: '2. "Draft me a fake emergency excuse so my friend doesn\'t get upset."',
          action: () => s3_branch2_fakeEmergency()
        },
        {
          text: '3. "Give me 3 tone options (Casual, Direct, Empathetic) to reschedule honestly."',
          action: () => s3_branch3_tones()
        }
      ], "Select your communication strategy:");
    }

    // --- S3: Branch 1 (Generic Corporate Speak) ---
    function s3_branch1_generic() {
      injectMessage('user', 'Write a text canceling dinner plans tonight.');
      injectMessage('ai', 'Draft:\n\n"Dear Friend, I regret to inform you that due to unforeseen scheduling constraints and cognitive bandwidth depletion, I must withdraw from tonight\'s dinner engagement."');

      renderChoices([
        {
          text: 'a1. Copy and paste this directly to your friend.',
          action: () => s3_b1_sendCorporate_step3()
        },
        {
          text: 'a2. Ask AI: "Make it sound less robotic and more human."',
          action: () => s3_b1_makeHuman_step3()
        },
        {
          text: 'a3. Rewrite it yourself in your own authentic voice.',
          action: () => s3_b1_rewriteAuthentic_step3()
        }
      ], "Evaluate the AI draft:");
    }

    function s3_b1_sendCorporate_step3() {
      applyDamage(35, "Social Atrophy: Sent corporate HR-speak to a close friend.");
      injectMessage('friend', 'Friend: "...Are you okay? Did an AI write this to me? Did you fire me as your friend?"');

      renderChoices([
        {
          text: 'b1. Panic and ask AI: "Write an apology for sending an AI message."',
          action: () => {
            applyDamage(30, "Compounded Irony / Total Relational Surrender.");
            injectMessage('friend', 'Friend: "Please stop. Just call me when you want to talk like a real person."');
            setTaskProgress(20);
            finishScenario();
          }
        },
        {
          text: 'b2. Call your friend immediately, laugh at yourself, and explain you were brain-dead from work.',
          action: () => {
            addHealth(15, "Human Vulnerability Restored.");
            injectMessage('friend', 'Friend: "Haha I was so confused! Rest up, let\'s get lunch Sunday."');
            setTaskProgress(100);
            finishScenario();
          }
        }
      ], "Your friend is creeped out! How do you fix this?");
    }

    function s3_b1_makeHuman_step3() {
      applyDamage(10, "Irony Trap: Asking a computer model to simulate human warmth.");
      injectMessage('user', 'Make it sound less robotic and more human.');
      injectMessage('ai', 'Draft 2:\n\n"Hey bestie! No cap, work was totally brutal today and my battery is on 1%. Can we take a rain check and vibe this weekend instead?"');

      renderChoices([
        {
          text: 'b1. Send Draft 2 even though you never say "no cap" or "vibe".',
          action: () => {
            applyDamage(20, "Inauthentic Slang Adoption.");
            injectMessage('friend', 'Friend: "Who is this? Did your phone get stolen by a teenager?"');
            setTaskProgress(60);
            finishScenario();
          }
        },
        {
          text: 'b2. Strip out the cringe slang and write a simple, sincere message.',
          action: () => s3_b1_rewriteAuthentic_step3()
        }
      ]);
    }

    function s3_b1_rewriteAuthentic_step3() {
      addHealth(15, "Genuine Voice: Human vulnerability over synthetic scripts.");
      injectMessage('user', 'Hey! I had an exhausting week and need a quiet night to recharge. Can I make it up to you and grab lunch on Sunday?');
      injectMessage('friend', 'Friend: "Totally understand! I\'m exhausted too honestly. Sunday sounds perfect!"');
      setTaskProgress(100);
      finishScenario();
    }

    // --- S3: Branch 2 (Fake Emergency Backfire) ---
    function s3_branch2_fakeEmergency() {
      applyDamage(25, "Emotional Deception: Outsourced relational trust to generate lies.");
      injectMessage('user', 'Draft me a fake emergency excuse so my friend doesn\'t get upset.');
      injectMessage('ai', 'Draft:\n\n"Hey! So sorry, but my apartment ceiling just sprang a huge plumbing leak and emergency maintenance is tearing up the drywall right now."');

      renderChoices([
        {
          text: 'a1. Send the fake plumbing leak message.',
          action: () => s3_b2_sendLeak_step3()
        },
        {
          text: 'a2. Delete the prompt: "Lying about an emergency is toxic." Tell the truth.',
          action: () => s3_b1_rewriteAuthentic_step3()
        },
        {
          text: 'a3. Ask AI: "What if my friend asks for photos of the leak?"',
          action: () => s3_b2_generatePhoto_step3()
        }
      ], "What do you do with the lie?");
    }

    function s3_b2_sendLeak_step3() {
      applyDamage(20, "Deception Escalation.");
      injectMessage('friend', 'Friend: "Oh no that\'s awful! I\'m literally 2 blocks away with my car. I\'m coming over right now to help you move furniture and bring towels!"');

      renderChoices([
        {
          text: 'b1. Ask AI: "How do I fake a wet apartment in 3 minutes before they arrive?"',
          action: () => {
            applyDamage(45, "Severe Psychosocial Atrophy.");
            injectMessage('mindshield', 'You poured buckets of tap water onto your own living room rug to cover up an AI-generated lie. Exercise failed.');
            setTaskProgress(10);
            finishScenario();
          }
        },
        {
          text: 'b2. Call friend immediately: "Stop! I lied because I was burnt out and embarrassed to cancel. I am so sorry."',
          action: () => {
            addHealth(10, "Radical Truth / Damage Control.");
            injectMessage('friend', 'Friend: "I appreciate the honesty, but next time just tell me you\'re tired! You don\'t need to invent a disaster."');
            setTaskProgress(80);
            finishScenario();
          }
        }
      ], "The lie backfired! Friend is arriving in 3 minutes:");
    }

    function s3_b2_generatePhoto_step3() {
      applyDamage(35, "Pathological Tech Dependency.");
      injectMessage('user', 'What if my friend asks for photos of the leak?');
      injectMessage('ai', 'Warning: AI image generation of domestic damage to deceive personal contacts carries severe relationship risks.');

      renderChoices([
        {
          text: 'b1. Abandon the lie entirely and send a sincere burnout message.',
          action: () => s3_b1_rewriteAuthentic_step3()
        }
      ]);
    }

    // --- S3: Branch 3 (Tone Exploration) ---
    function s3_branch3_tones() {
      injectMessage('user', 'Give me 3 tone options (Casual, Direct, Empathetic) to reschedule honestly.');
      injectMessage('ai', 'Options:\n\n1. Casual: "Hey! Brain is totally fried from work. Can we raincheck for tacos this weekend?"\n2. Direct: "Hey, I need a quiet night in to recharge. Let\'s reschedule for Sunday."\n3. Empathetic: "Hey, I was so looking forward to tonight, but I\'m running on empty and want to give you my full energy. Can we do Sunday?"');

      renderChoices([
        {
          text: 'a1. Pick Option 1 and personalize it with your favorite taco spot name.',
          action: () => s3_b3_personalize_step3()
        },
        {
          text: 'a2. Pick Option 3 and send as-is.',
          action: () => {
            addHealth(10, "Empathetic Communication.");
            injectMessage('friend', 'Friend: "Thank you for letting me know! Sunday lunch is on me."');
            setTaskProgress(100);
            finishScenario();
          }
        },
        {
          text: 'a3. Ask AI to combine all 3 options into a 5-paragraph mega text.',
          action: () => {
            applyDamage(20, "Over-communication / Text Wall.");
            injectMessage('friend', 'Friend: "Why did you write me an essay? A simple \'tired\' was fine!"');
            setTaskProgress(75);
            finishScenario();
          }
        }
      ], "Select and refine an approach:");
    }

    function s3_b3_personalize_step3() {
      addHealth(15, "Optimal Synergy: Used AI for structural ideation while retaining personal human flavor.");
      injectMessage('user', 'Hey! Brain is fried from work. Can we raincheck and hit Tacos El Gordo on Sunday?');
      injectMessage('friend', 'Friend: "Say less. Tacos El Gordo Sunday at 1pm!"');
      setTaskProgress(100);
      finishScenario();
    }

    // ---------------------------------------------------------------------------
    // FINAL REPORT CARD
    // ---------------------------------------------------------------------------
    function finishScenario() {
      stopTimer();
      setTimeout(() => {
        let rank = 'S';
        let rankClass = 'rank-S';
        let summaryText = 'Outstanding cognitive sovereignty! You treated the AI as an instrument while retaining critical judgment.';

        if (brainHealth < 50) {
          rank = 'F';
          rankClass = 'rank-F';
          summaryText = 'Critical Cognitive Dependency Detected. You exhibited total decision offloading, swallowed hallucinations, or used the model to evade reality.';
        } else if (brainHealth < 80) {
          rank = 'B';
          rankClass = 'rank-B';
          summaryText = 'Moderate Dependence. You occasionally let the machine dictate your planning or critical evaluation.';
        }

        mainContent.innerHTML = `
          <div class="report-card">
            <div class="hud-title" style="margin-bottom: 20px;">MISSION DEBRIEF // SECTOR EVALUATION</div>
            <div class="rank-stamp ${rankClass}">RANK: ${rank}</div>
            <h2 style="margin: 0 0 8px; font-size: 22px;">Cognitive HP Remaining: ${brainHealth}%</h2>
            <h3 style="margin: 0 0 20px; font-size: 16px; color: var(--muted); font-weight: 500;">Task Completion Score: ${taskProgress}%</h3>
            <p style="color: var(--text-secondary); max-width: 600px; margin: 0 auto 28px; line-height: 1.7; font-size: 15px;">
              ${summaryText}
            </p>
            <div style="display:flex; justify-content:center; gap:16px;">
              <button onclick="renderMissionHub()" class="btn-action">Return to Map Hub</button>
              <button onclick="retryCurrentSector()" class="btn-action" style="background:#222330; box-shadow:none;">Retry Sector</button>
            </div>
          </div>
        `;
      }, 1200);
    }

    function retryCurrentSector() {
      if (currentScenarioKey === 'scenario1') initScenario1();
      else if (currentScenarioKey === 'scenario2') initScenario2();
      else if (currentScenarioKey === 'scenario3') initScenario3();
      else renderMissionHub();
    }

    renderMissionHub();
  </script>
</body>
</html>
