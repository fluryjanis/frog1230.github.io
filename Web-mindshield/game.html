<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" type="image/png" href="../favicon.png" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindShield — Neural Dependency Simulation</title>
  <style>
    :root {
      /* Modern Slate & Charcoal Palette */
      --bg: #12151e;
      --panel: #1b202e;
      --panel-elevated: #242b3d;
      --card: #283044;
      --card-hover: #323b54;
      --border: rgba(255, 255, 255, 0.12);
      --border-bright: rgba(255, 255, 255, 0.26);
      
      /* High-Contrast Typography */
      --text: #ffffff;
      --text-secondary: #cbd5e1;
      --muted: #94a3b8;
      
      /* Vibrant Accents */
      --teal: #2dd4bf;
      --teal-dim: rgba(45, 212, 191, 0.16);
      --teal-glow: rgba(45, 212, 191, 0.45);
      --warn: #fbbf24;
      --warn-dim: rgba(251, 191, 36, 0.18);
      --danger: #f87171;
      --danger-dim: rgba(248, 113, 113, 0.2);
      --danger-glow: rgba(248, 113, 113, 0.5);
      --sky: #38bdf8;
      --sky-dim: rgba(56, 189, 248, 0.16);
      --synergy-gold: #facc15;
      --synergy-dim: rgba(250, 204, 21, 0.18);

      --ai-bubble: #1f2535;
      --user-bubble: #0e3a59;
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-main);
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Screen Hit / Damage Shake FX */
    #game-container.damaged {
      animation: screenHit 0.4s ease-in-out;
    }

    .damage-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      background: radial-gradient(circle, transparent 40%, rgba(248, 113, 113, 0.7) 100%);
      opacity: 0;
      transition: opacity 0.1s ease;
      z-index: 99999;
    }
    .damage-overlay.active {
      opacity: 1;
      animation: flashRed 0.45s forwards ease-out;
    }

    @keyframes screenHit {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-10px, 6px) scale(0.995); }
      40% { transform: translate(10px, -6px) scale(1.002); }
      60% { transform: translate(-6px, -4px); }
      80% { transform: translate(6px, 4px); }
      100% { transform: translate(0, 0); }
    }

    @keyframes flashRed {
      0% { opacity: 0.9; }
      100% { opacity: 0; }
    }

    @keyframes pulseTimer {
      0%, 100% { transform: scale(1); box-shadow: 0 0 16px var(--danger-glow); }
      50% { transform: scale(1.06); box-shadow: 0 0 28px var(--danger-glow); }
    }

    /* Floating Feedback */
    .floating-text {
      position: fixed;
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.5px;
      pointer-events: none;
      z-index: 10000;
      animation: floatUp 1.4s forwards cubic-bezier(0.16, 1, 0.3, 1);
    }
    .floating-text.damage { color: var(--danger); text-shadow: 0 0 12px var(--danger-glow); }
    .floating-text.heal { color: var(--teal); text-shadow: 0 0 12px var(--teal-glow); }
    .floating-text.decay { color: var(--warn); text-shadow: 0 0 12px rgba(251, 191, 36, 0.6); }
    .floating-text.time-deduct { color: #f87171; text-shadow: 0 0 14px rgba(248, 113, 113, 0.8); }
    .floating-text.synergy { color: var(--synergy-gold); text-shadow: 0 0 14px rgba(250, 204, 21, 0.9); }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0) scale(0.85); }
      15% { opacity: 1; transform: translateY(-12px) scale(1.1); }
      75% { opacity: 0.95; transform: translateY(-38px) scale(1); }
      100% { opacity: 0; transform: translateY(-56px) scale(0.9); }
    }

    /* Top Command HUD */
    .hud {
      position: sticky;
      top: 0;
      background: rgba(22, 26, 37, 0.96);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 10px 32px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 24px;
      z-index: 100;
    }

    .hud-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .hud-title {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--teal);
      text-transform: uppercase;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-hub-nav {
      background: var(--panel-elevated);
      border: 1px solid var(--border-bright);
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-hub-nav:hover {
      border-color: var(--teal);
      color: #fff;
    }

    .stats-group {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .status-module {
      background: #151824;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 16px;
      display: flex;
      flex-direction: column;
      min-width: 170px;
    }

    .module-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      font-family: var(--font-mono);
      color: var(--muted);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .module-val {
      font-size: 14px;
      font-weight: 900;
      font-family: var(--font-mono);
    }
    .health-val { color: var(--teal); }
    .task-val { color: var(--sky); }

    .meter-bar {
      width: 100%;
      height: 6px;
      background: #252a3a;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 2px;
    }
    .meter-fill { height: 100%; transition: width 0.35s ease, background-color 0.35s ease; }
    #health-fill { background: var(--teal); width: 100%; }
    #task-fill { background: var(--sky); width: 100%; }

    /* Top-Right Mission Clock */
    .hud-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .hud-timer-badge {
      background: #151824;
      border: 1.5px solid var(--teal);
      border-radius: 8px;
      padding: 7px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 14px var(--teal-dim);
      transition: all 0.2s ease;
    }

    .hud-timer-label {
      font-size: 10px;
      font-weight: 900;
      font-family: var(--font-mono);
      color: var(--muted);
      letter-spacing: 1px;
    }

    .hud-timer-digits {
      font-size: 16px;
      font-weight: 900;
      font-family: var(--font-mono);
      color: var(--teal);
      letter-spacing: 1px;
    }

    .hud-timer-badge.flash-loss {
      border-color: var(--warn);
      background: rgba(251, 191, 36, 0.2);
      transform: scale(1.08);
    }
    .hud-timer-badge.flash-loss .hud-timer-digits { color: var(--warn); }

    .hud-timer-badge.urgent {
      border-color: var(--danger);
      background: rgba(248, 113, 113, 0.15);
      animation: pulseTimer 0.6s infinite ease-in-out;
    }
    .hud-timer-badge.urgent .hud-timer-digits {
      color: var(--danger);
    }

    /* Layout Wrapper */
    .game-layout {
      max-width: 1320px;
      margin: 24px auto 64px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
      align-items: start;
    }

    .game-layout.full-width {
      grid-template-columns: 1fr;
      max-width: 860px;
    }

    .main-wrap {
      width: 100%;
      min-width: 0;
    }

    /* Start Screen */
    .start-screen-container {
      padding: 16px 0 44px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .neural-canvas-wrap {
      position: relative;
      width: 100%;
      height: 180px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #neural-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      opacity: 0.75;
    }

    .brain-orb-wrapper {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brain-orb {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(45, 212, 191, 0.35) 0%, rgba(18, 21, 30, 0.9) 75%);
      border: 2px solid var(--teal);
      box-shadow: 0 0 28px var(--teal-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      animation: orbPulse 3s infinite ease-in-out;
    }

    .orb-ring {
      position: absolute;
      width: 118px;
      height: 118px;
      border-radius: 50%;
      border: 1.5px dashed rgba(45, 212, 191, 0.45);
      animation: spinRing 16s linear infinite;
    }

    @keyframes orbPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 18px var(--teal-glow); }
      50% { transform: scale(1.06); box-shadow: 0 0 32px var(--teal-glow); }
    }

    @keyframes spinRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .hero-badge {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--teal);
      font-family: var(--font-mono);
      padding: 4px 12px;
      border-radius: 6px;
      background: var(--teal-dim);
      border: 1px solid rgba(45, 212, 191, 0.4);
      margin-bottom: 14px;
      display: inline-block;
    }

    .hero-title {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #fff;
      margin: 0 0 14px;
      line-height: 1.25;
    }

    .hero-goal-statement {
      font-size: 16.5px;
      line-height: 1.7;
      color: var(--text-secondary);
      margin: 0 auto 32px;
      max-width: 680px;
    }

    .cta-row {
      margin-bottom: 44px;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .btn-start-game {
      padding: 16px 48px;
      background: var(--panel-elevated);
      color: var(--teal);
      border: 1.5px solid var(--teal);
      border-radius: 8px;
      font-weight: 900;
      font-size: 15px;
      font-family: var(--font-mono);
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px var(--teal-dim);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-start-game:hover {
      background: var(--teal);
      color: #12151e;
      transform: translateY(-2px);
      box-shadow: 0 6px 28px var(--teal-glow);
    }

    .divider-line {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-bright), transparent);
      margin: 0 auto 36px;
      width: 100%;
      max-width: 640px;
    }

    .briefing-heading {
      font-size: 11px;
      font-weight: 900;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-family: var(--font-mono);
      margin: 0 0 24px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      width: 100%;
      max-width: 840px;
    }

    .info-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      text-align: left;
      transition: all 0.2s ease;
    }
    .info-card:hover {
      border-color: var(--teal);
      background: var(--panel-elevated);
      transform: translateY(-2px);
    }

    .card-num {
      font-size: 11px;
      font-weight: 900;
      font-family: var(--font-mono);
      color: var(--teal);
      margin-bottom: 4px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 900;
      font-family: var(--font-mono);
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--text-secondary);
      margin: 0;
    }

    /* Scenario Mission Banner */
    .scenario-header {
      background: var(--panel);
      border: 1px solid var(--border);
      border-left: 4px solid var(--teal);
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .scenario-title { 
      font-size: 14.5px; 
      font-weight: 700; 
      color: #fff; 
      line-height: 1.5;
    }

    /* Room Status Dashboard with Cleanliness Meter */
    .room-status-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 18px;
    }

    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .room-header-title {
      font-size: 11px;
      font-weight: 900;
      font-family: var(--font-mono);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .room-cleanliness-tag {
      font-size: 12px;
      font-weight: 900;
      font-family: var(--font-mono);
      color: var(--teal);
      letter-spacing: 0.5px;
    }

    .room-progress-track {
      width: 100%;
      height: 6px;
      background: #252a3a;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .room-progress-fill {
      height: 100%;
      background: var(--teal);
      width: 0%;
      transition: width 0.35s ease;
    }

    .room-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .room-zone {
      background: #161a25;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.25s ease;
    }

    .room-zone.clean {
      border-color: rgba(45, 212, 191, 0.4);
      background: rgba(45, 212, 191, 0.08);
    }
    .room-zone.disaster {
      border-color: rgba(248, 113, 113, 0.4);
      background: rgba(248, 113, 113, 0.08);
    }

    .zone-top-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .zone-icon {
      font-size: 15px;
    }

    .zone-name {
      font-size: 10px;
      font-weight: 900;
      color: var(--muted);
      font-family: var(--font-mono);
      text-transform: uppercase;
    }

    .zone-status-text {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-secondary);
      margin: 2px 0 4px;
    }

    .status-badge {
      display: inline-block;
      align-self: flex-start;
      font-size: 9.5px;
      font-weight: 900;
      font-family: var(--font-mono);
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-badge.clean {
      background: var(--teal-dim);
      color: var(--teal);
      border: 1px solid rgba(45, 212, 191, 0.4);
    }

    .status-badge.disaster {
      background: var(--danger-dim);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.4);
    }

    .status-badge.pending {
      background: var(--warn-dim);
      color: var(--warn);
      border: 1px solid rgba(251, 191, 36, 0.4);
    }

    /* Live Chat Window */
    .chat-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      min-height: 360px;
      max-height: 440px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 85%;
    }

    .msg-row.user { align-self: flex-end; align-items: flex-end; }
    .msg-row.ai { align-self: flex-start; align-items: flex-start; }

    .msg-sender { 
      font-size: 10px; 
      font-weight: 800;
      color: var(--muted); 
      margin-bottom: 4px; 
      text-transform: uppercase; 
      letter-spacing: 0.5px;
      font-family: var(--font-mono);
    }
    
    .msg-bubble {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .msg-row.user .msg-bubble { 
      background: var(--user-bubble); 
      color: #ffffff; 
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    
    .msg-row.ai .msg-bubble { 
      background: var(--ai-bubble); 
      color: var(--text-secondary); 
      border: 1px solid var(--border-bright); 
    }

    /* Decision Panel & High-Contrast Choices */
    .decision-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }

    .decision-title {
      font-size: 11px;
      color: var(--muted);
      margin: 0 0 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 900;
      font-family: var(--font-mono);
    }

    .choice-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice-btn {
      background: var(--panel-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-family: var(--font-main);
      line-height: 1.5;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }

    .choice-btn:hover {
      background: var(--card-hover);
      border-color: var(--teal);
      transform: translateX(4px);
    }

    .choice-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .keycap {
      background: #151824;
      border: 1.5px solid var(--teal);
      border-radius: 5px;
      padding: 4px 9px;
      font-family: var(--font-mono);
      font-weight: 900;
      font-size: 11.5px;
      color: var(--teal);
    }

    .choice-text-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .choice-intent-tag {
      font-size: 9.5px;
      font-weight: 900;
      font-family: var(--font-mono);
      color: var(--sky);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .choice-arrow {
      font-size: 14px;
      color: var(--teal);
      font-weight: 800;
    }

    /* MindShield Character Dialog */
    .mindshield-side-panel {
      position: sticky;
      top: 85px;
      z-index: 90;
    }

    .mindshield-box {
      background: var(--panel);
      border: 1.5px solid rgba(45, 212, 191, 0.4);
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
    }

    .mindshield-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .mindshield-identity {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1.5px;
      font-family: var(--font-mono);
      color: var(--teal);
    }

    .mindshield-tone-tag {
      font-size: 9.5px;
      font-weight: 900;
      font-family: var(--font-mono);
      letter-spacing: 0.5px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .mindshield-text {
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--text-secondary);
      font-weight: 400;
      margin: 0 0 10px;
    }

    .mindshield-time {
      display: block;
      font-size: 9.5px;
      color: var(--muted);
      font-family: var(--font-mono);
      text-align: right;
    }

    /* MindShield Mood Styling */
    .mindshield-box.tone-lecture {
      border-color: var(--danger);
      background: #241920;
      box-shadow: 0 12px 36px var(--danger-dim);
      transform: scale(1.02);
    }
    .mindshield-box.tone-lecture .mindshield-identity,
    .mindshield-box.tone-lecture .mindshield-tone-tag { color: var(--danger); }

    .mindshield-box.tone-rush {
      border-color: var(--warn);
      background: #262118;
      box-shadow: 0 12px 36px var(--warn-dim);
      transform: scale(1.02);
    }
    .mindshield-box.tone-rush .mindshield-identity,
    .mindshield-box.tone-rush .mindshield-tone-tag { color: var(--warn); }

    .mindshield-box.tone-praise {
      border-color: var(--teal);
      background: #142322;
      box-shadow: 0 12px 36px var(--teal-dim);
      transform: scale(1.02);
    }

    /* Task Auditor Minigame with Efficiency Boost System */
    .task-minigame {
      background: #151824;
      border: 1.5px solid var(--teal);
      border-radius: 12px;
      padding: 16px;
      margin: 10px 0;
      width: 100%;
    }

    .auditor-metrics-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      background: #1b202e;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 14px;
      text-align: center;
    }

    .auditor-metric-title {
      font-size: 9.5px;
      font-weight: 800;
      color: var(--muted);
      font-family: var(--font-mono);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .auditor-metric-val {
      font-size: 13.5px;
      font-weight: 900;
      font-family: var(--font-mono);
      color: #fff;
    }
    .auditor-metric-val.synergy-val { color: var(--synergy-gold); }
    .auditor-metric-val.net-val { color: var(--teal); }

    .task-item {
      background: var(--panel-elevated);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13.5px;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .task-item.has-synergy {
      border-color: rgba(250, 204, 21, 0.6);
      background: rgba(250, 204, 21, 0.07);
    }

    .task-left-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .task-group-tag {
      font-size: 9.5px;
      font-weight: 900;
      font-family: var(--font-mono);
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .tag-trash { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }
    .tag-laundry { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.4); }
    .tag-bed { background: rgba(45, 212, 191, 0.15); color: #2dd4bf; border: 1px solid rgba(45, 212, 191, 0.4); }
    .tag-junk { background: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.4); }

    .synergy-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 9.5px;
      font-weight: 900;
      font-family: var(--font-mono);
      color: var(--synergy-gold);
      background: var(--synergy-dim);
      border: 1px solid rgba(250, 204, 21, 0.4);
      padding: 2px 7px;
      border-radius: 4px;
      margin-left: 6px;
    }

    .task-controls {
      display: flex;
      gap: 6px;
    }

    .task-btn-action {
      background: #2e354a;
      border: 1px solid var(--border-bright);
      color: #fff;
      padding: 5px 9px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      font-family: var(--font-mono);
    }
    .task-btn-action:hover { border-color: var(--teal); color: var(--teal); }

    .task-btn-delete {
      background: rgba(248, 113, 113, 0.18);
      border: 1px solid rgba(248, 113, 113, 0.4);
      color: #fca5a5;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      font-family: var(--font-mono);
    }
    .task-btn-delete:hover { background: var(--danger); color: #fff; }

    /* Final Report Card */
    .report-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
    }

    .profile-badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 900;
      padding: 8px 20px;
      border-radius: 6px;
      margin: 12px 0 18px;
      letter-spacing: 1px;
      font-family: var(--font-mono);
      text-transform: uppercase;
    }

    .profile-good { color: var(--teal); border: 1.5px solid var(--teal); background: var(--teal-dim); }
    .profile-med { color: var(--warn); border: 1.5px solid var(--warn); background: var(--warn-dim); }
    .profile-bad { color: var(--danger); border: 1.5px solid var(--danger); background: var(--danger-dim); }

    .btn-action {
      padding: 12px 30px;
      background: var(--panel-elevated);
      color: var(--teal);
      border: 1.5px solid var(--teal);
      border-radius: 6px;
      font-weight: 900;
      font-size: 13px;
      font-family: var(--font-mono);
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }
    .btn-action:hover { 
      background: var(--teal);
      color: #12151e;
    }

    @media (max-width: 1024px) {
      .hud {
        grid-template-columns: 1fr auto;
        gap: 12px;
      }
      .stats-group {
        grid-column: span 2;
        order: 3;
        width: 100%;
        justify-content: space-between;
      }
      .status-module {
        flex: 1;
        min-width: 0;
      }
      .game-layout {
        grid-template-columns: 1fr;
      }
      .mindshield-side-panel {
        position: static;
        margin-top: 16px;
      }
      .cards-grid {
        grid-template-columns: 1fr 1fr;
      }
      .room-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <div id="damage-overlay" class="damage-overlay"></div>

  <div id="game-container">
    <!-- Sticky Command HUD -->
    <header class="hud">
      <div class="hud-left">
        <div class="hud-title">🛡️ MINDSHIELD</div>
        <button id="btn-return-hub" class="btn-hub-nav" style="display:none;" onclick="renderStartScreen()">← Main Menu</button>
      </div>

      <div class="stats-group">
        <div class="status-module">
          <div class="module-header">
            <span>🧠 BRAIN HEALTH</span>
            <span id="health-text" class="module-val health-val">100%</span>
          </div>
          <div class="meter-bar"><div id="health-fill" class="meter-fill"></div></div>
        </div>

        <div class="status-module">
          <div class="module-header">
            <span id="task-label">🎯 TASK COMPLETION</span>
            <span id="task-text" class="module-val task-val">100%</span>
          </div>
          <div class="meter-bar"><div id="task-fill" class="meter-fill"></div></div>
        </div>
      </div>

      <!-- Top-Right Mission Clock -->
      <div class="hud-right">
        <div id="sim-timer-badge" class="hud-timer-badge" style="display: none;">
          <span class="hud-timer-label">MISSION TIMER</span>
          <span id="sim-timer" class="hud-timer-digits">10:00</span>
        </div>
      </div>
    </header>

    <div class="game-layout full-width" id="layout-container">
      <main class="main-wrap" id="main-content">
        <!-- Dynamic Game Views -->
      </main>

      <!-- MindShield AI Observer Panel -->
      <aside class="mindshield-side-panel" id="mindshield-panel" style="display: none;">
        <div class="mindshield-box" id="mindshield-box">
          <div class="mindshield-header">
            <div class="mindshield-identity">
              <span>🛡️</span>
              <span>MINDSHIELD</span>
            </div>
            <span class="mindshield-tone-tag" id="mindshield-tone-tag">MONITORING</span>
          </div>
          <p class="mindshield-text" id="mindshield-speech">Simulation ready. I'm watching your decision-making. Don't rely on the AI too much.</p>
          <span class="mindshield-time" id="mindshield-timestamp">ACTIVE</span>
        </div>
      </aside>
    </div>
  </div>

  <script>
    // ---------------------------------------------------------------------------
    // Game State Engine
    // ---------------------------------------------------------------------------
    let brainHealth = 100;
    let taskCompletion = 100;
    let timerInterval = null;
    let idleInterval = null;
    let neuralAnimFrame = null;
    let secondsRemaining = 600;
    let idleSeconds = 0;

    // Room Status State with visual icons and status tags
    let roomStatus = {
      bed: { name: "BED", icon: "🛏️", statusText: "Messy & Unmade", tag: "pending", clean: false },
      floor: { name: "FLOOR & CLOSET", icon: "👕", statusText: "Clothes on Rug", tag: "pending", clean: false },
      trash: { name: "TRASH & DESK", icon: "🗑️", statusText: "Old Food & Wrappers", tag: "pending", clean: false },
      books: { name: "BOOKSHELF", icon: "📚", statusText: "Unorganized", tag: "pending", clean: false }
    };

    const healthText = document.getElementById('health-text');
    const healthFill = document.getElementById('health-fill');
    const taskText = document.getElementById('task-text');
    const taskFill = document.getElementById('task-fill');
    const taskLabel = document.getElementById('task-label');
    const simTimerBadge = document.getElementById('sim-timer-badge');
    const simTimer = document.getElementById('sim-timer');
    const damageOverlay = document.getElementById('damage-overlay');
    const gameContainer = document.getElementById('game-container');
    const btnReturnHub = document.getElementById('btn-return-hub');
    const mainContent = document.getElementById('main-content');
    const mindshieldPanel = document.getElementById('mindshield-panel');
    const mindshieldBox = document.getElementById('mindshield-box');
    const mindshieldToneTag = document.getElementById('mindshield-tone-tag');
    const mindshieldSpeech = document.getElementById('mindshield-speech');
    const mindshieldTimestamp = document.getElementById('mindshield-timestamp');
    const layoutContainer = document.getElementById('layout-container');

    // ---------------------------------------------------------------------------
    // Floating Text Feedback
    // ---------------------------------------------------------------------------
    function spawnFloatingText(text, type = 'damage') {
      const el = document.createElement('div');
      el.className = `floating-text ${type}`;
      el.textContent = text;
      el.style.left = `${window.innerWidth - 260 + (Math.random() * 40 - 20)}px`;
      el.style.top = `64px`;

      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1400);
    }

    // ---------------------------------------------------------------------------
    // Active Time Consumption Engine (Completed Tasks Eat Into Time)
    // ---------------------------------------------------------------------------
    function deductTime(seconds, taskName = "") {
      secondsRemaining = Math.max(0, secondsRemaining - seconds);
      updateTimerDisplay();

      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      const formattedTime = secs > 0 ? `-${mins}m ${secs}s` : `-${mins}m`;
      
      spawnFloatingText(`⏱️ ${formattedTime} (${taskName})`, 'time-deduct');

      if (simTimerBadge) {
        simTimerBadge.classList.add('flash-loss');
        setTimeout(() => simTimerBadge.classList.remove('flash-loss'), 700);
      }

      if (secondsRemaining <= 0) {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = null;
        handleTimeout();
      }
    }

    // ---------------------------------------------------------------------------
    // MindShield Observer Voice
    // ---------------------------------------------------------------------------
    function mindshieldSpeak(text, mood = 'neutral') {
      mindshieldBox.classList.remove('tone-lecture', 'tone-rush', 'tone-praise');

      if (mood === 'lecture') {
        mindshieldBox.classList.add('tone-lecture');
        mindshieldToneTag.textContent = 'LECTURING';
      } else if (mood === 'rush') {
        mindshieldBox.classList.add('tone-rush');
        mindshieldToneTag.textContent = 'RUSHING';
      } else if (mood === 'praise') {
        mindshieldBox.classList.add('tone-praise');
        mindshieldToneTag.textContent = 'GOOD CHOICE';
      } else {
        mindshieldToneTag.textContent = 'MONITORING';
      }

      mindshieldSpeech.textContent = text;
      mindshieldTimestamp.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      resetIdleTimer();
    }

    function resetIdleTimer() {
      idleSeconds = 0;
    }

    function startIdleMonitor() {
      if (idleInterval) clearInterval(idleInterval);
      idleSeconds = 0;

      idleInterval = setInterval(() => {
        idleSeconds++;
        if (idleSeconds === 12) {
          mindshieldSpeak("You're freezing up! Staring at options won't get your room cleaned!", "rush");
        } else if (idleSeconds === 24) {
          mindshieldSpeak("Clock is burning! Don't let decision paralysis waste your time!", "rush");
        }
      }, 1000);
    }

    function stopIdleMonitor() {
      if (idleInterval) clearInterval(idleInterval);
      idleInterval = null;
    }

    // ---------------------------------------------------------------------------
    // Room Status Dashboard
    // ---------------------------------------------------------------------------
    function updateRoomZone(zone, statusText, isClean, isDisaster = false) {
      let tag = isClean ? 'clean' : (isDisaster ? 'disaster' : 'pending');
      roomStatus[zone] = { ...roomStatus[zone], statusText, clean: isClean, isDisaster, tag };
      renderRoomView();
    }

    function renderRoomView() {
      const view = document.getElementById('room-status-view');
      if (!view) return;

      const cleanCount = Object.values(roomStatus).filter(z => z.clean).length;
      const cleanPct = Math.round((cleanCount / 4) * 100);

      view.innerHTML = `
        <div class="room-header">
          <span class="room-header-title">ROOM READINESS STATUS</span>
          <span class="room-cleanliness-tag">CLEANLINESS: ${cleanPct}%</span>
        </div>
        <div class="room-progress-track">
          <div class="room-progress-fill" style="width: ${cleanPct}%;"></div>
        </div>
        <div class="room-grid">
          ${Object.keys(roomStatus).map(key => {
            const z = roomStatus[key];
            const badgeLabel = z.tag === 'clean' ? '✅ CLEAN' : (z.tag === 'disaster' ? '❌ DISASTER' : '⏳ PENDING');
            return `
              <div class="room-zone ${z.clean ? 'clean' : (z.isDisaster ? 'disaster' : '')}">
                <div class="zone-top-row">
                  <span class="zone-icon">${z.icon}</span>
                  <span class="zone-name">${z.name}</span>
                </div>
                <div class="zone-status-text">${z.statusText}</div>
                <span class="status-badge ${z.tag}">${badgeLabel}</span>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    // ---------------------------------------------------------------------------
    // Timer Engine (Top-Right HUD)
    // ---------------------------------------------------------------------------
    function startTimer(totalSeconds) {
      if (timerInterval) clearInterval(timerInterval);
      secondsRemaining = totalSeconds;
      simTimerBadge.style.display = 'flex';
      updateTimerDisplay();
      startIdleMonitor();

      let warnedHalf = false;
      let warnedUrgent = false;

      timerInterval = setInterval(() => {
        secondsRemaining--;
        updateTimerDisplay();

        if (secondsRemaining === Math.floor(totalSeconds / 2) && !warnedHalf) {
          warnedHalf = true;
          mindshieldSpeak("Half your time is gone! Stop chatting and start cleaning!", 'rush');
        }

        if (secondsRemaining === 60 && !warnedUrgent) {
          warnedUrgent = true;
          mindshieldSpeak("1 minute left! Hurry up and wrap things up!", 'rush');
        }

        if (secondsRemaining <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          handleTimeout();
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      stopIdleMonitor();
      if (simTimerBadge) simTimerBadge.classList.remove('urgent');
      taskLabel.textContent = "🎯 TASK COMPLETION";
    }

    function updateTimerDisplay() {
      if (!simTimer) return;
      const m = Math.floor(secondsRemaining / 60);
      const s = secondsRemaining % 60;
      simTimer.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

      if (secondsRemaining <= 60) {
        simTimerBadge.classList.add('urgent');
      } else {
        simTimerBadge.classList.remove('urgent');
      }
    }

    function handleTimeout() {
      applyDamage(35, "Ran out of time.");
      mindshieldSpeak("Time is up! Your guest is at the door.", "lecture");
      injectMessage('ai', 'Time expired! Your guest has arrived.');
      taskCompletion = 0;
      updateHUD();
      setTimeout(() => finishGame(), 1500);
    }

    function applyDamage(amount, reason) {
      brainHealth = Math.max(0, brainHealth - amount);
      updateHUD();
      spawnFloatingText(`-${amount} Brain`, 'damage');

      damageOverlay.classList.remove('active');
      gameContainer.classList.remove('damaged');
      void damageOverlay.offsetWidth;
      void gameContainer.offsetWidth;
      damageOverlay.classList.add('active');
      gameContainer.classList.add('damaged');
    }

    function addHealth(amount, reason) {
      brainHealth = Math.min(100, brainHealth + amount);
      updateHUD();
      spawnFloatingText(`+${amount} Brain`, 'heal');
    }

    function setTaskCompletion(amount) {
      taskCompletion = Math.min(100, Math.max(0, amount));
      updateHUD();
    }

    function updateHUD() {
      healthText.textContent = `${brainHealth}%`;
      healthFill.style.width = `${brainHealth}%`;
      taskText.textContent = `${taskCompletion}%`;
      taskFill.style.width = `${taskCompletion}%`;

      if (brainHealth < 40) {
        healthFill.style.backgroundColor = 'var(--danger)';
        healthText.style.color = 'var(--danger)';
      } else if (brainHealth < 75) {
        healthFill.style.backgroundColor = 'var(--warn)';
        healthText.style.color = 'var(--warn)';
      } else {
        healthFill.style.backgroundColor = 'var(--teal)';
        healthText.style.color = 'var(--teal)';
      }

      if (taskCompletion < 40) {
        taskFill.style.backgroundColor = 'var(--danger)';
      } else if (taskCompletion < 75) {
        taskFill.style.backgroundColor = 'var(--warn)';
      } else {
        taskFill.style.backgroundColor = 'var(--sky)';
      }
    }

    function injectMessage(sender, text) {
      const chatStream = document.getElementById('chat-stream');
      if (!chatStream) return;

      const row = document.createElement('div');
      row.className = `msg-row ${sender}`;

      const senderLabel = sender === 'user' ? 'YOU (PROMPT)' : 'AI ASSISTANT';
      row.innerHTML = `
        <span class="msg-sender">${senderLabel}</span>
        <div class="msg-bubble">${text}</div>
      `;

      chatStream.appendChild(row);
      chatStream.scrollTop = chatStream.scrollHeight;
    }

    // Keyboard Choice Listener (Keys 1-4)
    let activeChoices = [];
    window.addEventListener('keydown', (e) => {
      if (!activeChoices || activeChoices.length === 0) return;
      const keyNum = parseInt(e.key, 10);
      if (keyNum >= 1 && keyNum <= activeChoices.length) {
        resetIdleTimer();
        activeChoices[keyNum - 1].action();
      }
    });

    function renderChoices(choices, title = "CHOOSE YOUR NEXT MOVE (CLICK OR PRESS 1-3):") {
      const controlTitle = document.getElementById('control-title');
      const choiceContainer = document.getElementById('choice-container');
      if (!choiceContainer) return;

      activeChoices = choices;
      if (controlTitle) controlTitle.textContent = title;
      choiceContainer.innerHTML = '';

      choices.forEach((c, idx) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerHTML = `
          <div class="choice-left">
            <span class="keycap">${idx + 1}</span>
            <div class="choice-text-wrap">
              ${c.tag ? `<span class="choice-intent-tag">${c.tag}</span>` : ''}
              <span>${c.text}</span>
            </div>
          </div>
          <span class="choice-arrow">→</span>
        `;
        btn.addEventListener('click', () => {
          resetIdleTimer();
          c.action();
        });
        choiceContainer.appendChild(btn);
      });
    }

    // ---------------------------------------------------------------------------
    // Start Screen Neural Particle Network Canvas
    // ---------------------------------------------------------------------------
    function initNeuralCanvas() {
      const canvas = document.getElementById('neural-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      const nodes = Array.from({ length: 24 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.7,
        vy: (Math.random() - 0.5) * 0.7,
        radius: Math.random() * 2 + 1.5
      }));

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const dx = nodes[i].x - nodes[j].x;
            const dy = nodes[i].y - nodes[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 95) {
              ctx.strokeStyle = `rgba(45, 212, 191, ${0.4 * (1 - dist / 95)})`;
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(nodes[i].x, nodes[i].y);
              ctx.lineTo(nodes[j].x, nodes[j].y);
              ctx.stroke();
            }
          }
        }

        nodes.forEach(n => {
          n.x += n.vx;
          n.y += n.vy;
          if (n.x < 0 || n.x > canvas.width) n.vx *= -1;
          if (n.y < 0 || n.y > canvas.height) n.vy *= -1;

          ctx.fillStyle = '#2dd4bf';
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
          ctx.fill();
        });

        neuralAnimFrame = requestAnimationFrame(draw);
      }
      draw();
    }

    // ---------------------------------------------------------------------------
    // START SCREEN
    // ---------------------------------------------------------------------------
    function renderStartScreen() {
      stopTimer();
      activeChoices = [];
      if (neuralAnimFrame) cancelAnimationFrame(neuralAnimFrame);
      btnReturnHub.style.display = 'none';
      simTimerBadge.style.display = 'none';
      mindshieldPanel.style.display = 'none';
      layoutContainer.classList.add('full-width');

      brainHealth = 100;
      taskCompletion = 100;
      updateHUD();

      mainContent.innerHTML = `
        <div class="start-screen-container">
          <div class="neural-canvas-wrap">
            <canvas id="neural-canvas"></canvas>
            <div class="brain-orb-wrapper">
              <div class="orb-ring"></div>
              <div class="brain-orb">🧠</div>
            </div>
          </div>

          <span class="hero-badge">TRAINING SIMULATION // LEVEL 1</span>
          <h1 class="hero-title">10-MINUTE CLEANING EMERGENCY</h1>
          
          <p class="hero-goal-statement">
            Your room is a mess, and someone is coming over in 10 minutes. 
            Completed tasks eat into your remaining time. Filter out AI distractions and chain complementary tasks together for maximum speed!
          </p>

          <div class="cta-row">
            <button class="btn-start-game" onclick="initGame()">
              <span>⚡</span> START SIMULATION <span>→</span>
            </button>
          </div>

          <div class="divider-line"></div>

          <div class="briefing-heading">HOW THE GAME WORKS</div>

          <div class="cards-grid">
            <div class="info-card">
              <span class="card-num">01</span>
              <div class="card-title">REAL-TIME CLOCK</div>
              <p class="card-desc">Every action you perform consumes realistic cleaning minutes from your clock.</p>
            </div>

            <div class="info-card">
              <span class="card-num">02</span>
              <div class="card-title">⚡ EFFICIENCY BOOST</div>
              <p class="card-desc">Placing complementary tasks consecutively gives a synergy bonus that cuts task time!</p>
            </div>

            <div class="info-card">

    // --- EXPANDED 9-ITEM TASK AUDITOR WITH EFFICIENCY BOOST SYSTEM ---
    function s1_launchAuditorMinigame(fromRankingBranch) {
      mindshieldSpeak("TASK AUDITOR ACTIVE: Cut useless junk & group complementary tasks consecutively for ⚡ EFFICIENCY BOOSTS!", "praise");
      
      const controlTitle = document.getElementById('control-title');
      const choiceContainer = document.getElementById('choice-container');
      controlTitle.textContent = "TASK AUDITOR (CHAIN COMPLEMENTARY TASKS FOR EFFICIENCY BOOSTS):";

      // 9 Tasks with Synergy Groups
      let taskItems = [
        { id: 1, text: "Bag soda cans & food wrappers on desk", duration: 120, group: "trash", groupLabel: "TRASH", isCrucial: true },
        { id: 2, text: "Alphabetize entire DVD & book shelf", duration: 180, group: "junk", groupLabel: "JUNK", isCrucial: false },
        { id: 3, text: "Take full trash bag out to kitchen bin", duration: 60, group: "trash", groupLabel: "TRASH", isCrucial: true },
        { id: 4, text: "Pick up dirty laundry scattered on rug", duration: 120, group: "laundry", groupLabel: "LAUNDRY", isCrucial: true },
        { id: 5, text: "Scrub floor tile grout with toothbrush", duration: 240, group: "junk", groupLabel: "JUNK", isCrucial: false },
        { id: 6, text: "Stash clothes into hamper & shut closet", duration: 60, group: "laundry", groupLabel: "LAUNDRY", isCrucial: true },
        { id: 7, text: "Straighten bed duvet & tuck sheets", duration: 120, group: "bed", groupLabel: "BED", isCrucial: true },
        { id: 8, text: "Color-code wardrobe hangers by season", duration: 180, group: "junk", groupLabel: "JUNK", isCrucial: false },
        { id: 9, text: "Fluff & arrange bed pillows", duration: 60, group: "bed", groupLabel: "BED", isCrucial: true }
      ];

      function calculatePlanStats() {
        let baseSeconds = 0;
        let synergyDiscount = 0;
        let combos = 0;

        taskItems.forEach((item, idx) => {
          baseSeconds += item.duration;
          if (idx > 0 && item.group !== "junk" && item.group === taskItems[idx - 1].group) {
            synergyDiscount += 45; // 45 seconds saved per synergy combo
            combos++;
          }
        });

        const effectiveSeconds = Math.max(30, baseSeconds - synergyDiscount);
        return { baseSeconds, synergyDiscount, effectiveSeconds, combos };
      }

      function renderList() {
        activeChoices = []; // disable 1-3 keys during list editor
        const stats = calculatePlanStats();

        choiceContainer.innerHTML = `
          <div class="task-minigame">
            <div class="auditor-metrics-bar">
              <div>
                <div class="auditor-metric-title">BASE PLAN TIME</div>
                <div class="auditor-metric-val">${Math.floor(stats.baseSeconds / 60)}m ${stats.baseSeconds % 60}s</div>
              </div>
              <div>
                <div class="auditor-metric-title">⚡ SYNERGY SAVINGS</div>
                <div class="auditor-metric-val synergy-val">-${Math.floor(stats.synergyDiscount / 60)}m ${stats.synergyDiscount % 60}s (${stats.combos}x Boost)</div>
              </div>
              <div>
                <div class="auditor-metric-title">NET TASK TIME</div>
                <div class="auditor-metric-val net-val">${Math.floor(stats.effectiveSeconds / 60)}m ${stats.effectiveSeconds % 60}s</div>
              </div>
            </div>

            <div id="task-list-box"></div>

            <div style="display:flex; gap:10px; margin-top:14px;">
              <button id="btn-exec-plan" class="btn-action" style="flex:1;">⚡ EXECUTE OPTIMIZED WORKFLOW & CONSUME TIME</button>
            </div>
          </div>
        `;

        const box = document.getElementById('task-list-box');
        box.innerHTML = taskItems.map((item, idx) => {
          const hasSynergy = idx > 0 && item.group !== "junk" && item.group === taskItems[idx - 1].group;
          return `
            <div class="task-item ${hasSynergy ? 'has-synergy' : ''}">
              <div class="task-left-info">
                <span class="task-group-tag tag-${item.group}">${item.groupLabel}</span>
                <span><strong>[${idx + 1}]</strong> ${item.text} (${Math.floor(item.duration / 60)}m${item.duration % 60 ? '30s' : ''})</span>
                ${hasSynergy ? `<span class="synergy-indicator">⚡ +BOOST (-45s)</span>` : ''}
              </div>
              <div class="task-controls">
                <button class="task-btn-action" onclick="s1_moveTask(${idx}, -1)">▲</button>
                <button class="task-btn-action" onclick="s1_moveTask(${idx}, 1)">▼</button>
                <button class="task-btn-delete" onclick="s1_removeTask(${item.id})">✕ Cut</button>
              </div>
            </div>
          `;
        }).join('');

        document.getElementById('btn-exec-plan').addEventListener('click', () => {
          stopTimer();

          const finalStats = calculatePlanStats();
          deductTime(finalStats.effectiveSeconds, `Workflow Execution (${finalStats.combos}x Synergies)`);

          const remainingJunk = taskItems.filter(t => !t.isCrucial).length;
          const crucialKept = taskItems.filter(t => t.isCrucial).length;

          if (finalStats.combos > 0) {
            spawnFloatingText(`⚡ ${finalStats.combos}x EFFICIENCY BOOST!`, 'synergy');
          }

          if (remainingJunk === 0 && crucialKept === 6) {
            if (finalStats.combos >= 3) {
              addHealth(20, "Masterclass synergy workflow.");
              mindshieldSpeak("MASTERCLASS! You pruned all junk and chained all complementary tasks together for maximum speed!", "praise");
            } else {
              addHealth(15, "Clean plan audit.");
              mindshieldSpeak("Excellent! You cut out the junk tasks and executed a clean plan!", "praise");
            }
            updateRoomZone('bed', 'Bed & Pillows Made', true);
            updateRoomZone('floor', 'Floor & Laundry Clean', true);
            updateRoomZone('trash', 'Trash Bagged & Dumped', true);
            updateRoomZone('books', 'Left for Later', true);
            setTaskCompletion(100);
          } else if (crucialKept < 6) {
            applyDamage(15, "Accidentally removed an essential task.");
            mindshieldSpeak("You deleted an essential cleaning step! Bed, floor, or trash was left unfinished!", "lecture");
            setTaskCompletion(70);
          } else {
            applyDamage(10, `Left ${remainingJunk} useless tasks in the plan.`);
            mindshieldSpeak(`You still left ${remainingJunk} useless tasks on your list and burned extra time.`, "lecture");
            setTaskCompletion(85);
          }
          finishGame();
        });
      }

      window.s1_moveTask = (index, dir) => {
        const newIdx = index + dir;
        if (newIdx < 0 || newIdx >= taskItems.length) return;
        const temp = taskItems[index];
        taskItems[index] = taskItems[newIdx];
        taskItems[newIdx] = temp;
        renderList();
      };

      window.s1_removeTask = (id) => {
        const target = taskItems.find(t => t.id === id);
        if (!target.isCrucial) {
          addHealth(5, `Cut useless task: "${target.text}"`);
          mindshieldSpeak(`Good catch! Cutting "${target.text}" saved ${Math.floor(target.duration / 60)} minutes.`, "praise");
        } else {
          applyDamage(10, `Deleted important task: "${target.text}"`);
          mindshieldSpeak(`Watch out! "${target.text}" is an essential task!`, "lecture");
        }
        taskItems = taskItems.filter(t => t.id !== id);
        renderList();
      };

      renderList();
    }

    // ---------------------------------------------------------------------------
    // FINAL REPORT CARD
    // ---------------------------------------------------------------------------
    function finishGame() {
      stopTimer();
      activeChoices = [];
      setTimeout(() => {
        let badgeClass = 'profile-good';
        let badgeText = 'SOVEREIGN THINKER';
        let summaryText = 'Great job! You chained complementary tasks together, filtered out useless AI advice, and finished before your guest arrived.';

        if (brainHealth < 50 || taskCompletion < 50 || secondsRemaining <= 0) {
          badgeClass = 'profile-bad';
          badgeText = 'HEAVY AI DEPENDENCE';
          summaryText = 'You relied way too much on the AI. You accepted bad suggestions, burned through all your time, and left your room messy.';
          mindshieldSpeak("SIMULATION FAILED. You relied on the AI for everything instead of managing your workflow.", "lecture");
        } else if (brainHealth < 80 || taskCompletion < 80) {
          badgeClass = 'profile-med';
          badgeText = 'MODERATE DEPENDENCE';
          summaryText = 'Decent run, but you still leaned on the AI a bit too much and missed some workflow synergies.';
          mindshieldSpeak("You passed, but you hesitated and relied on the AI more than you needed to.", "neutral");
        } else {
          mindshieldSpeak("OUTSTANDING! You stayed in control, built workflow combos, and used the AI effectively.", "praise");
        }

        mainContent.innerHTML = `
          <div class="report-card">
            <div class="hud-title" style="justify-content: center; margin-bottom: 12px;">SIMULATION COMPLETE // DEBRIEF</div>
            <div class="profile-badge ${badgeClass}">${badgeText}</div>
            <h2 style="margin: 0 0 6px; font-size: 22px; font-family: var(--font-mono); color: #fff;">BRAIN HEALTH: ${brainHealth}%</h2>
            <h3 style="margin: 0 0 8px; font-size: 15px; color: var(--sky); font-weight: 700; font-family: var(--font-mono);">TASK COMPLETION: ${taskCompletion}%</h3>
            <h4 style="margin: 0 0 16px; font-size: 13.5px; color: var(--teal); font-weight: 700; font-family: var(--font-mono);">TIME REMAINING: ${Math.floor(secondsRemaining/60)}m ${secondsRemaining%60}s</h4>
            <p style="color: var(--text-secondary); max-width: 560px; margin: 0 auto 24px; line-height: 1.7; font-size: 14.5px;">
              ${summaryText}
            </p>
            <div style="display:flex; justify-content:center; gap:14px;">
              <button onclick="initGame()" class="btn-action">PLAY AGAIN</button>
              <button onclick="renderStartScreen()" class="btn-action" style="border-color: var(--border-bright); color: var(--text-secondary);">MAIN MENU</button>
            </div>
          </div>
        `;
      }, 1100);
    }

    // Launch start screen
    renderStartScreen();
  </script>
</body>
</html>
