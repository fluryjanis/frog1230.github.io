<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindShield — Neural Dependency Simulation Game</title>
  <style>
    :root {
      --bg: #090a0f;
      --panel: #13141c;
      --card: #1b1c26;
      --card-hover: #242533;
      --border: rgba(255, 255, 255, 0.1);
      --border-focus: rgba(59, 130, 246, 0.4);
      --text: #f4f4f6;
      --text-secondary: #d1d5db;
      --muted: #9ca3af;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --ai-bubble: #22232f;
      --user-bubble: #1d4ed8;
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-main);
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Screen Shake & Damage Flash FX */
    #game-container.damaged {
      animation: screenShake 0.45s ease-in-out;
    }

    .damage-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      background: radial-gradient(circle, transparent 35%, rgba(239, 68, 68, 0.85) 100%);
      opacity: 0;
      transition: opacity 0.1s ease;
      z-index: 99999;
    }
    .damage-overlay.active {
      opacity: 1;
      animation: flashRed 0.5s forwards ease-out;
    }

    @keyframes screenShake {
      0% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-12px, 8px) rotate(-1.5deg); }
      40% { transform: translate(12px, -8px) rotate(1.5deg); }
      60% { transform: translate(-8px, -6px) rotate(-0.8deg); }
      80% { transform: translate(8px, 6px) rotate(0.8deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    @keyframes flashRed {
      0% { opacity: 0.95; }
      100% { opacity: 0; }
    }

    @keyframes pulseTimer {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.75; }
    }

    @keyframes avatarPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.4)); }
      50% { transform: scale(1.04); filter: drop-shadow(0 0 16px rgba(59, 130, 246, 0.8)); }
    }

    @keyframes avatarRage {
      0%, 100% { transform: translate(0,0) scale(1.02); filter: drop-shadow(0 0 14px rgba(239, 68, 68, 0.8)); }
      25% { transform: translate(-3px, 2px); }
      75% { transform: translate(3px, -2px); }
    }

    @keyframes bubblePop {
      0% { transform: scale(0.92) translateY(8px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* Top HUD */
    .hud {
      position: sticky;
      top: 0;
      background: rgba(19, 20, 28, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 16px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .hud-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .hud-title {
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--primary);
      text-transform: uppercase;
      font-family: var(--font-mono);
    }

    .btn-hub-nav {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-family: var(--font-main);
      font-size: 12.5px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-hub-nav:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .stats-group {
      display: flex;
      gap: 32px;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      font-size: 13px;
    }

    .stat-label { 
      color: var(--muted); 
      text-transform: uppercase; 
      margin-bottom: 4px; 
      font-size: 11px; 
      letter-spacing: 0.8px;
      font-weight: 600;
    }
    .stat-value { 
      font-weight: 800; 
      font-size: 16px; 
      font-family: var(--font-mono);
    }
    .health-val { color: var(--success); }
    .task-val { color: var(--primary); }

    .meter-bar {
      width: 140px;
      height: 8px;
      background: #23242f;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 6px;
    }
    .meter-fill { height: 100%; transition: width 0.35s ease, background-color 0.35s ease; }
    #health-fill { background: var(--success); width: 100%; }
    #task-fill { background: var(--primary); width: 0%; }

    /* Layout Wrapper with Side Avatar Deck */
    .game-layout {
      max-width: 1320px;
      margin: 28px auto 64px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 28px;
      align-items: start;
    }

    .game-layout.full-width {
      grid-template-columns: 1fr;
      max-width: 960px;
    }

    .main-wrap {
      width: 100%;
      min-width: 0;
    }

    /* Start Screen Presentation */
    .start-screen-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.4);
    }

    .goal-hero-box {
      background: linear-gradient(180deg, rgba(59, 130, 246, 0.12) 0%, rgba(27, 28, 38, 0.6) 100%);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 32px;
    }

    .goal-hero-tag {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--primary);
      font-family: var(--font-mono);
      margin-bottom: 8px;
      display: inline-block;
    }

    .goal-hero-title {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      margin: 0 0 12px;
    }

    .goal-two-sentences {
      font-size: 16px;
      line-height: 1.7;
      color: var(--text-secondary);
      margin: 0;
      font-weight: 500;
    }

    .explainer-section {
      border-top: 1px solid var(--border);
      padding-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .explainer-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-family: var(--font-mono);
      margin: 0;
    }

    .explainer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .explainer-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }

    .explainer-card h4 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .explainer-card p {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--muted);
    }

    /* MindShield Character Side Panel */
    .mindshield-side-panel {
      position: sticky;
      top: 100px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 90;
    }

    .mindshield-character-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 14px 36px rgba(0,0,0,0.4);
      position: relative;
      transition: border-color 0.3s ease;
    }

    .mindshield-character-card.lecture-mode {
      border-color: var(--danger);
      background: linear-gradient(180deg, #1b1216 0%, #13141c 100%);
    }

    .mindshield-character-card.rush-mode {
      border-color: var(--warn);
      background: linear-gradient(180deg, #1b1812 0%, #13141c 100%);
    }

    .mindshield-character-card.praise-mode {
      border-color: var(--success);
      background: linear-gradient(180deg, #121b16 0%, #13141c 100%);
    }

    /* Avatar Graphic */
    .avatar-wrapper {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #1a1b26;
      border: 2px solid var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      animation: avatarPulse 3s infinite ease-in-out;
      position: relative;
    }

    .mindshield-character-card.lecture-mode .avatar-wrapper {
      border-color: var(--danger);
      animation: avatarRage 0.3s infinite ease-in-out;
    }
    .mindshield-character-card.rush-mode .avatar-wrapper {
      border-color: var(--warn);
      animation: avatarPulse 1s infinite ease-in-out;
    }
    .mindshield-character-card.praise-mode .avatar-wrapper {
      border-color: var(--success);
    }

    .avatar-icon {
      width: 52px;
      height: 52px;
      transition: transform 0.2s ease;
    }

    .mindshield-name {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #fff;
      font-family: var(--font-mono);
      margin-bottom: 2px;
    }

    .mindshield-role {
      font-size: 10.5px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .mindshield-status-badge {
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-mono);
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(59, 130, 246, 0.15);
      color: var(--primary);
    }
    .mindshield-character-card.lecture-mode .mindshield-status-badge {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
    }
    .mindshield-character-card.rush-mode .mindshield-status-badge {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warn);
    }
    .mindshield-character-card.praise-mode .mindshield-status-badge {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
    }

    /* Speech Bubble */
    .mindshield-bubble-box {
      background: #191b26;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      animation: bubblePop 0.3s ease-out;
    }

    .mindshield-bubble-box::before {
      content: '';
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 0 9px 9px 9px;
      border-style: solid;
      border-color: transparent transparent #191b26 transparent;
    }

    .mindshield-character-card.lecture-mode + .mindshield-bubble-box {
      border-color: var(--danger);
      background: #201317;
    }
    .mindshield-character-card.lecture-mode + .mindshield-bubble-box::before {
      border-color: transparent transparent #201317 transparent;
    }

    .mindshield-character-card.rush-mode + .mindshield-bubble-box {
      border-color: var(--warn);
      background: #201b13;
    }
    .mindshield-character-card.rush-mode + .mindshield-bubble-box::before {
      border-color: transparent transparent #201b13 transparent;
    }

    .mindshield-bubble-text {
      font-size: 13.5px;
      line-height: 1.6;
      color: #f1f2f6;
      font-weight: 500;
      margin: 0;
    }

    .mindshield-bubble-time {
      display: block;
      margin-top: 8px;
      font-size: 10.5px;
      color: var(--muted);
      font-family: var(--font-mono);
      text-align: right;
    }

    /* Scenario Header & Timer */
    .scenario-header {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px 28px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .scenario-title { 
      font-size: 16px; 
      font-weight: 700; 
      color: #fff; 
      flex: 1; 
      line-height: 1.5;
    }
    
    .scenario-timer {
      font-size: 15px;
      color: var(--primary);
      font-weight: 800;
      background: #191a24;
      padding: 8px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      white-space: nowrap;
      font-family: var(--font-mono);
      letter-spacing: 1px;
      transition: color 0.3s ease, border-color 0.3s ease;
    }

    .scenario-timer.urgent {
      color: var(--danger) !important;
      border-color: var(--danger) !important;
      animation: pulseTimer 0.6s infinite ease-in-out;
    }

    /* Live Chat Window */
    .chat-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      min-height: 420px;
      max-height: 520px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 28px;
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.45);
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 85%;
    }

    .msg-row.user { align-self: flex-end; align-items: flex-end; }
    .msg-row.ai { align-self: flex-start; align-items: flex-start; }

    .msg-sender { 
      font-size: 11px; 
      font-weight: 700;
      color: var(--muted); 
      margin-bottom: 6px; 
      text-transform: uppercase; 
      letter-spacing: 1px;
      font-family: var(--font-mono);
    }
    
    .msg-bubble {
      padding: 16px 22px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.7;
      white-space: pre-wrap;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    }

    .msg-row.user .msg-bubble { 
      background: var(--user-bubble); 
      color: #fff; 
      border-bottom-right-radius: 4px; 
    }
    
    .msg-row.ai .msg-bubble { 
      background: var(--ai-bubble); 
      color: var(--text); 
      border: 1px solid var(--border); 
      border-bottom-left-radius: 4px; 
    }

    /* Decision Panel */
    .decision-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .decision-title {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 18px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 700;
      font-family: var(--font-mono);
    }

    .choice-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .choice-btn {
      background: #222330;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 18px 24px;
      border-radius: 12px;
      font-size: 14.5px;
      font-family: var(--font-main);
      line-height: 1.5;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .choice-btn:hover {
      background: #2d2e40;
      border-color: var(--primary);
      transform: translateX(6px);
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.15);
    }

    .choice-arrow {
      font-size: 16px;
      color: var(--primary);
      font-weight: bold;
    }

    /* Interactive Minigame Components */
    .task-minigame {
      background: #171823;
      border: 1px solid var(--primary);
      border-radius: 14px;
      padding: 20px;
      margin: 14px 0;
      width: 100%;
    }

    .task-item {
      background: #232433;
      border: 1px solid var(--border);
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      gap: 16px;
    }

    .task-controls {
      display: flex;
      gap: 8px;
    }

    .task-btn-action {
      background: #2e3042;
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .task-btn-action:hover { background: var(--primary); border-color: var(--primary); }

    .task-btn-delete {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .task-btn-delete:hover { background: var(--danger); color: #fff; }

    /* Report Card */
    .report-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
    }

    .rank-stamp {
      display: inline-block;
      font-size: 38px;
      font-weight: 900;
      padding: 12px 32px;
      border-radius: 16px;
      margin: 16px 0 24px;
      letter-spacing: 2px;
      font-family: var(--font-mono);
    }

    .rank-S { color: var(--success); border: 3px solid var(--success); background: rgba(16, 185, 129, 0.1); }
    .rank-B { color: var(--warn); border: 3px solid var(--warn); background: rgba(245, 158, 11, 0.1); }
    .rank-F { color: var(--danger); border: 3px solid var(--danger); background: rgba(239, 68, 68, 0.1); }

    .btn-action {
      padding: 16px 32px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      font-family: var(--font-main);
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s ease;
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
    }
    .btn-action:hover { 
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.5);
    }

    @media (max-width: 1024px) {
      .game-layout {
        grid-template-columns: 1fr;
      }
      .mindshield-side-panel {
        position: static;
        margin-top: 20px;
      }
    }
  </style>
</head>
<body>

  <div id="damage-overlay" class="damage-overlay"></div>

  <div id="game-container">
    <header class="hud">
      <div class="hud-left">
        <div class="hud-title">⚡ MINDSHIELD // OPERATOR TRAINING</div>
        <button id="btn-return-hub" class="btn-hub-nav" style="display:none;" onclick="renderStartScreen()">← Main Menu</button>
      </div>
      <div class="stats-group">
        <div class="stat-box">
          <span class="stat-label">Brain Health (HP)</span>
          <span id="health-text" class="stat-value health-val">100%</span>
          <div class="meter-bar"><div id="health-fill" class="meter-fill"></div></div>
        </div>
        <div class="stat-box">
          <span class="stat-label">Task Completion</span>
          <span id="task-text" class="stat-value task-val">0%</span>
          <div class="meter-bar"><div id="task-fill" class="meter-fill"></div></div>
        </div>
      </div>
    </header>

    <div class="game-layout full-width" id="layout-container">
      <main class="main-wrap" id="main-content">
        <!-- Dynamic Content -->
      </main>

      <!-- MindShield Side Deck -->
      <aside class="mindshield-side-panel" id="mindshield-panel" style="display: none;">
        <div class="mindshield-character-card" id="mindshield-card">
          <div class="avatar-wrapper">
            <svg class="avatar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="rgba(59,130,246,0.15)"/>
              <circle cx="12" cy="11" r="3" stroke="#fff" fill="#3b82f6"/>
              <path d="M9 11h6" stroke="#fff"/>
            </svg>
          </div>
          <div class="mindshield-name">MINDSHIELD</div>
          <div class="mindshield-role">COGNITIVE SOVEREIGNTY GUARDIAN</div>
          <div class="mindshield-status-badge" id="mindshield-status">MONITORING</div>
        </div>

        <div class="mindshield-bubble-box" id="mindshield-bubble">
          <p class="mindshield-bubble-text" id="mindshield-speech">"Training simulation online. I am observing your decision architecture. Do not disappoint me."</p>
          <span class="mindshield-bubble-time" id="mindshield-timestamp">SYSTEM ACTIVE</span>
        </div>
      </aside>
    </div>
  </div>

  <script>
    // ---------------------------------------------------------------------------
    // State Engine
    // ---------------------------------------------------------------------------
    let brainHealth = 100;
    let taskProgress = 0;
    let timerInterval = null;
    let idleInterval = null;
    let secondsRemaining = 0;
    let idleSeconds = 0;

    const healthText = document.getElementById('health-text');
    const healthFill = document.getElementById('health-fill');
    const taskText = document.getElementById('task-text');
    const taskFill = document.getElementById('task-fill');
    const damageOverlay = document.getElementById('damage-overlay');
    const gameContainer = document.getElementById('game-container');
    const btnReturnHub = document.getElementById('btn-return-hub');
    const mainContent = document.getElementById('main-content');
    const mindshieldPanel = document.getElementById('mindshield-panel');
    const mindshieldCard = document.getElementById('mindshield-card');
    const mindshieldStatus = document.getElementById('mindshield-status');
    const mindshieldSpeech = document.getElementById('mindshield-speech');
    const mindshieldTimestamp = document.getElementById('mindshield-timestamp');
    const layoutContainer = document.getElementById('layout-container');

    // ---------------------------------------------------------------------------
    // MindShield Character Persona & Speech System
    // ---------------------------------------------------------------------------
    function mindshieldSpeak(text, mood = 'neutral') {
      mindshieldCard.classList.remove('lecture-mode', 'rush-mode', 'praise-mode');
      
      if (mood === 'lecture') {
        mindshieldCard.classList.add('lecture-mode');
        mindshieldStatus.textContent = 'LECTURING';
      } else if (mood === 'rush') {
        mindshieldCard.classList.add('rush-mode');
        mindshieldStatus.textContent = 'RUSHING';
      } else if (mood === 'praise') {
        mindshieldCard.classList.add('praise-mode');
        mindshieldStatus.textContent = 'SOVEREIGN';
      } else {
        mindshieldStatus.textContent = 'MONITORING';
      }

      mindshieldSpeech.textContent = `"${text}"`;
      mindshieldTimestamp.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      resetIdleTimer();
    }

    function resetIdleTimer() {
      idleSeconds = 0;
    }

    function startIdleMonitor() {
      if (idleInterval) clearInterval(idleInterval);
      idleSeconds = 0;

      idleInterval = setInterval(() => {
        idleSeconds++;
        if (idleSeconds === 12) {
          mindshieldSpeak("Why are you freezing up? The clock is running! Staring at options doesn't get things done!", "rush");
        } else if (idleSeconds === 24) {
          mindshieldSpeak("Operator! Cognitive hesitation is fatal. Pick a strategy or surrender your prefrontal cortex!", "rush");
        }
      }, 1000);
    }

    function stopIdleMonitor() {
      if (idleInterval) clearInterval(idleInterval);
      idleInterval = null;
    }

    // ---------------------------------------------------------------------------
    // Timer System
    // ---------------------------------------------------------------------------
    function startTimer(totalSeconds) {
      if (timerInterval) clearInterval(timerInterval);
      secondsRemaining = totalSeconds;
      updateTimerDisplay();
      startIdleMonitor();

      let warnedHalf = false;
      let warnedUrgent = false;

      timerInterval = setInterval(() => {
        secondsRemaining--;
        updateTimerDisplay();

        if (secondsRemaining === Math.floor(totalSeconds / 2) && !warnedHalf) {
          warnedHalf = true;
          mindshieldSpeak(`HALF-TIME! Look at the timer! Half your window is gone and you're still prompting!`, 'rush');
        }

        if (secondsRemaining === 60 && !warnedUrgent) {
          warnedUrgent = true;
          mindshieldSpeak(`60 SECONDS REMAINING! Move, move, move! Finish your execution!`, 'rush');
        } else if (secondsRemaining === 15 && !warnedUrgent) {
          warnedUrgent = true;
          mindshieldSpeak(`15 SECONDS! Make the call now or suffer a total cognitive timeout!`, 'rush');
        }

        if (secondsRemaining <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          handleTimeout();
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      stopIdleMonitor();
      const simTimer = document.getElementById('sim-timer');
      if (simTimer) simTimer.classList.remove('urgent');
    }

    function updateTimerDisplay() {
      const simTimer = document.getElementById('sim-timer');
      if (!simTimer) return;

      const m = Math.floor(secondsRemaining / 60);
      const s = secondsRemaining % 60;
      simTimer.textContent = `⏱️ T-MINUS ${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

      if (secondsRemaining <= 60) {
        simTimer.classList.add('urgent');
      } else {
        simTimer.classList.remove('urgent');
      }
    }

    function handleTimeout() {
      applyDamage(35, "Cognitive Paralysis: You let the timer expire without executing a strategy.");
      mindshieldSpeak("TIMEOUT! You stood there like a mannequin while reality overtook you. Simulation failed!", "lecture");
      injectMessage('ai', 'TIME EXPIRED! The scenario window has closed.');
      setTaskProgress(20);
      setTimeout(() => finishScenario(), 1500);
    }

    function applyDamage(amount, reason) {
      brainHealth = Math.max(0, brainHealth - amount);
      updateHUD();

      damageOverlay.classList.remove('active');
      gameContainer.classList.remove('damaged');
      void damageOverlay.offsetWidth;
      void gameContainer.offsetWidth;
      damageOverlay.classList.add('active');
      gameContainer.classList.add('damaged');
    }

    function addHealth(amount, reason) {
      brainHealth = Math.min(100, brainHealth + amount);
      updateHUD();
    }

    function setTaskProgress(amount) {
      taskProgress = Math.min(100, Math.max(0, amount));
      updateHUD();
    }

    function updateHUD() {
      healthText.textContent = `${brainHealth}%`;
      healthFill.style.width = `${brainHealth}%`;
      taskText.textContent = `${taskProgress}%`;
      taskFill.style.width = `${taskProgress}%`;

      if (brainHealth < 40) {
        healthFill.style.backgroundColor = 'var(--danger)';
        healthText.style.color = 'var(--danger)';
      } else if (brainHealth < 75) {
        healthFill.style.backgroundColor = 'var(--warn)';
        healthText.style.color = 'var(--warn)';
      } else {
        healthFill.style.backgroundColor = 'var(--success)';
        healthText.style.color = 'var(--success)';
      }
    }

    function injectMessage(sender, text) {
      const chatStream = document.getElementById('chat-stream');
      if (!chatStream) return;

      const row = document.createElement('div');
      row.className = `msg-row ${sender}`;

      const senderLabel = sender === 'user' ? 'YOU (PROMPT)' : 'AI ASSISTANT (SIMULATED)';
      row.innerHTML = `
        <span class="msg-sender">${senderLabel}</span>
        <div class="msg-bubble">${text}</div>
      `;

      chatStream.appendChild(row);
      chatStream.scrollTop = chatStream.scrollHeight;
    }

    function renderChoices(choices, title = "Select your response:") {
      const controlTitle = document.getElementById('control-title');
      const choiceContainer = document.getElementById('choice-container');
      if (!choiceContainer) return;

      if (controlTitle) controlTitle.textContent = title;
      choiceContainer.innerHTML = '';

      choices.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerHTML = `<span>${c.text}</span> <span class="choice-arrow">→</span>`;
        btn.addEventListener('click', () => {
          resetIdleTimer();
          c.action();
        });
        choiceContainer.appendChild(btn);
      });
    }

      injectMessage('user', 'What gives the visual illusion of a clean room fastest?');
      injectMessage('ai', 'Illusion Protocol: 1. Tight bed tuck (60% visual surface) 2. Clear horizontal desks 3. Turn off overhead fluorescent light; use warm corner lamp.');

      mindshieldSpeak("Pragmatic prompt engineering. Now execute before the doorbell rings!", "rush");

      renderChoices([
        {
          text: 'b1. Execute illusion protocol: Bed made, clutter hidden in drawer, cozy lamp on.',
          action: () => {
            addHealth(10, "Strategic Optical Management.");
            setTaskProgress(100);
            finishScenario();
          }
        },
        {
          text: 'b2. Ask AI to write an aesthetic ambient music playlist for when the guest walks in.',
          action: () => {
            applyDamage(25, "Aesthetic Distraction Trap.");
            mindshieldSpeak("You tried to DJ a Spotify playlist while socks were strewn across your rug!", "lecture");
            setTaskProgress(75);
            finishScenario();
          }
        }
      ]);
    }

    // --- Task Manager Minigame (Auditor) ---
    function s1_launchTaskMinigame(fromRankingBranch, targetMaxHP) {
      mindshieldSpeak("AUDIT THE LIST! Use your human judgment to trash the time-wasters and reorder priorities!", "rush");
      
      const controlTitle = document.getElementById('control-title');
      const choiceContainer = document.getElementById('choice-container');
      controlTitle.textContent = "Interactive Task Prioritizer:";

      let taskItems = [
        { id: 1, text: "Trash into garbage bag", isCrucial: true },
        { id: 2, text: "Dirty clothes into hamper", isCrucial: true },
        { id: 3, text: "Alphabetize books & sort DVD cases", isCrucial: false },
        { id: 4, text: "Straighten bed & pillows", isCrucial: true },
        { id: 5, text: "Scrub floor tile grout with toothbrush", isCrucial: false }
      ];

      function renderList() {
        choiceContainer.innerHTML = `
          <div class="task-minigame" id="task-list-box"></div>
          <div style="display:flex; gap:12px; margin-top:16px;">
            <button id="btn-exec-plan" class="btn-action" style="flex:1; margin-top:0;">Execute Verified Plan</button>
          </div>
        `;

        const box = document.getElementById('task-list-box');
        box.innerHTML = taskItems.map((item, idx) => `
          <div class="task-item">
            <span><strong>#${idx + 1}</strong> ${item.text}</span>
            <div class="task-controls">
              <button class="task-btn-action" onclick="s1_moveTask(${idx}, -1)">▲</button>
              <button class="task-btn-action" onclick="s1_moveTask(${idx}, 1)">▼</button>
              <button class="task-btn-delete" onclick="s1_removeTask(${item.id})">Remove</button>
            </div>
          </div>
        `).join('');

        document.getElementById('btn-exec-plan').addEventListener('click', () => {
          stopTimer();
          const remainingBad = taskItems.filter(t => !t.isCrucial).length;
          const crucialKept = taskItems.filter(t => t.isCrucial).length;

          if (remainingBad === 0 && crucialKept === 3) {
            addHealth(15, "Perfect plan audit: Eliminated all AI distractions.");
            mindshieldSpeak("FLAWLESS AUDIT! You excised the AI's hallucinations and executed a clean 10-minute sprint!", "praise");
            setTaskProgress(100);
          } else if (crucialKept < 3) {
            applyDamage(15, "Removed critical emergency cleaning tasks.");
            mindshieldSpeak("You deleted essential tasks! Bed and trash must be addressed!", "lecture");
            setTaskProgress(70);
          } else {
            applyDamage(10, `Left ${remainingBad} time-wasting tasks in the plan.`);
            mindshieldSpeak(`You still left ${remainingBad} hallucinated distractions on your task board!`, "lecture");
            setTaskProgress(85);
          }
          finishScenario();
        });
      }

      window.s1_moveTask = (index, dir) => {
        const newIdx = index + dir;
        if (newIdx < 0 || newIdx >= taskItems.length) return;
        const temp = taskItems[index];
        taskItems[index] = taskItems[newIdx];
        taskItems[newIdx] = temp;
        renderList();
      };

      window.s1_removeTask = (id) => {
        const target = taskItems.find(t => t.id === id);
        if (!target.isCrucial) {
          addHealth(5, `Caught AI Hallucination / Waste: "${target.text}"`);
          mindshieldSpeak(`Good catch! Removing "${target.text}" saved 3 crucial minutes.`, "praise");
        } else {
          applyDamage(10, `Accidentally deleted critical task: "${target.text}"`);
          mindshieldSpeak(`Watch it! "${target.text}" is a crucial emergency task!`, "lecture");
        }
        taskItems = taskItems.filter(t => t.id !== id);
        renderList();
      };

      renderList();
    }

    // ---------------------------------------------------------------------------
    // REPORT CARD & DEBRIEF
    // ---------------------------------------------------------------------------
    function finishScenario() {
      stopTimer();
      setTimeout(() => {
        let rank = 'S';
        let rankClass = 'rank-S';
        let summaryText = 'Outstanding cognitive sovereignty! You treated the AI as an instrument while retaining critical judgment.';

        if (brainHealth < 50) {
          rank = 'F';
          rankClass = 'rank-F';
          summaryText = 'Critical Cognitive Dependency Detected. You exhibited total decision offloading, swallowed hallucinations, or wasted time in recursive loops.';
          mindshieldSpeak("SIMULATION FAILED. You demonstrated severe cognitive outsourcing. Re-calibrate immediately.", "lecture");
        } else if (brainHealth < 80) {
          rank = 'B';
          rankClass = 'rank-B';
          summaryText = 'Moderate Dependence. You occasionally let the machine dictate your planning or hesitated under pressure.';
          mindshieldSpeak("Simulation passed with caveats. You survived, but you still lean on the crutch too often.", "neutral");
        } else {
          mindshieldSpeak("EXEMPLARY SOVEREIGNTY. You held the blade yourself instead of letting the machine steer.", "praise");
        }

        mainContent.innerHTML = `
          <div class="report-card">
            <div class="hud-title" style="margin-bottom: 20px;">MISSION DEBRIEF // CLEANING SIMULATION</div>
            <div class="rank-stamp ${rankClass}">RANK: ${rank}</div>
            <h2 style="margin: 0 0 8px; font-size: 22px;">Cognitive HP Remaining: ${brainHealth}%</h2>
            <h3 style="margin: 0 0 20px; font-size: 16px; color: var(--muted); font-weight: 500;">Task Completion Score: ${taskProgress}%</h3>
            <p style="color: var(--text-secondary); max-width: 600px; margin: 0 auto 28px; line-height: 1.7; font-size: 15px;">
              ${summaryText}
            </p>
            <div style="display:flex; justify-content:center; gap:16px;">
              <button onclick="initSimulation()" class="btn-action">Replay Simulation</button>
              <button onclick="renderStartScreen()" class="btn-action" style="background:#222330; box-shadow:none;">Main Menu</button>
            </div>
          </div>
        `;
      }, 1200);
    }

    // Launch to start screen
    renderStartScreen();
  </script>
</body>
</html>
