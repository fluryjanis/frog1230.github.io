<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindShield — Neural Dependency Simulation Game</title>
  <style>
    :root {
      --bg: #09090b;
      --panel: #121217;
      --card: #1c1c24;
      --border: rgba(255, 255, 255, 0.12);
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --ai-bubble: #272732;
      --user-bubble: #1e3a8a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Courier New', Courier, monospace, system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Screen Shake & Damage Flash FX */
    #game-container.damaged {
      animation: screenShake 0.4s ease-in-out;
    }

    .damage-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      background: radial-gradient(circle, transparent 35%, rgba(239, 68, 68, 0.75) 100%);
      opacity: 0;
      transition: opacity 0.1s ease;
      z-index: 99999;
    }
    .damage-overlay.active {
      opacity: 1;
      animation: flashRed 0.5s forwards ease-out;
    }

    @keyframes screenShake {
      0% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-10px, 8px) rotate(-1.5deg); }
      40% { transform: translate(10px, -8px) rotate(1.5deg); }
      60% { transform: translate(-8px, -5px) rotate(-0.8deg); }
      80% { transform: translate(8px, 5px) rotate(0.8deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    @keyframes flashRed {
      0% { opacity: 0.95; }
      100% { opacity: 0; }
    }

    @keyframes pulseTimer {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.7; }
    }

    /* Top HUD */
    .hud {
      position: sticky;
      top: 0;
      background: rgba(18, 18, 23, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .hud-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .hud-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--primary);
      text-transform: uppercase;
    }

    .btn-hub-nav {
      background: #272732;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }
    .btn-hub-nav:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .stats-group {
      display: flex;
      gap: 24px;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      font-size: 12px;
    }

    .stat-label { color: var(--muted); text-transform: uppercase; margin-bottom: 2px; font-size: 10px; letter-spacing: 0.5px; }
    .stat-value { font-weight: 800; font-size: 15px; }
    .health-val { color: var(--success); }
    .task-val { color: var(--primary); }

    .meter-bar {
      width: 120px;
      height: 6px;
      background: #27272a;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }
    .meter-fill { height: 100%; transition: width 0.3s ease, background-color 0.3s ease; }
    #health-fill { background: var(--success); width: 100%; }
    #task-fill { background: var(--primary); width: 0%; }

    /* Main Wrap */
    .main-wrap {
      max-width: 860px;
      margin: 24px auto 48px;
      padding: 0 16px;
    }

    /* Mission Map Selector Screen */
    .map-hub-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .hub-intro {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
    }

    .hub-intro h1 {
      margin: 0 0 8px;
      font-size: 20px;
      letter-spacing: 1px;
      color: #fff;
    }

    .hub-intro p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .mission-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .mission-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .mission-card:hover {
      border-color: var(--primary);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.15);
    }

    .mission-tag {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(59, 130, 246, 0.15);
      color: var(--primary);
      width: fit-content;
      letter-spacing: 1px;
    }

    .mission-card h3 {
      margin: 0 0 6px;
      font-size: 16px;
      color: #fff;
    }

    .mission-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .mission-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 12px;
    }

    /* Scenario Header & Timer */
    .scenario-header {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .scenario-title { font-size: 14px; font-weight: 700; color: #fff; flex: 1; }
    
    .scenario-timer {
      font-size: 14px;
      color: var(--primary);
      font-weight: 800;
      background: #1a1a24;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      white-space: nowrap;
      transition: color 0.3s ease, border-color 0.3s ease;
    }

    .scenario-timer.urgent {
      color: var(--danger) !important;
      border-color: var(--danger) !important;
      animation: pulseTimer 0.6s infinite ease-in-out;
    }

    /* Live Chat Window */
    .chat-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      min-height: 380px;
      max-height: 460px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 85%;
    }

    .msg-row.user { align-self: flex-end; align-items: flex-end; }
    .msg-row.ai { align-self: flex-start; align-items: flex-start; }
    .msg-row.mindshield { align-self: center; align-items: center; width: 100%; max-width: 100%; }

    .msg-sender { font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .msg-bubble {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .msg-row.user .msg-bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 2px; }
    .msg-row.ai .msg-bubble { background: var(--ai-bubble); color: #f4f4f5; border: 1px solid var(--border); border-bottom-left-radius: 2px; }
    
    .mindshield-banner {
      background: rgba(239, 68, 68, 0.12);
      border: 1px dashed var(--danger);
      color: #fca5a5;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
    }

    /* Decision Panel */
    .decision-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .decision-title {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }

    .choice-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice-btn {
      background: #252530;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .choice-btn:hover {
      background: #323242;
      border-color: var(--primary);
      transform: translateX(4px);
    }

    /* Interactive Minigame Components */
    .task-minigame {
      background: #181822;
      border: 1px solid var(--primary);
      border-radius: 12px;
      padding: 16px;
      margin: 10px 0;
      width: 100%;
    }

    .task-item {
      background: #22222e;
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      gap: 10px;
    }

    .task-controls {
      display: flex;
      gap: 6px;
    }

    .task-btn-action {
      background: #2a2a38;
      border: 1px solid var(--border);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    .task-btn-action:hover { background: var(--primary); border-color: var(--primary); }

    .task-btn-delete {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    .task-btn-delete:hover { background: var(--danger); color: #fff; }

    /* Report Card */
    .report-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
      text-align: center;
    }

    .rank-stamp {
      display: inline-block;
      font-size: 36px;
      font-weight: 900;
      padding: 8px 24px;
      border-radius: 12px;
      margin-bottom: 16px;
      letter-spacing: 2px;
    }

    .rank-S { color: var(--success); border: 3px solid var(--success); }
    .rank-B { color: var(--warn); border: 3px solid var(--warn); }
    .rank-F { color: var(--danger); border: 3px solid var(--danger); }

    .btn-action {
      padding: 12px 24px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: inline-block;
      margin-top: 20px;
      transition: background 0.2s;
    }
    .btn-action:hover { background: var(--primary-hover); }
  </style>
</head>
<body>

  <div id="damage-overlay" class="damage-overlay"></div>

  <div id="game-container">
    <!-- Top Real-Time HUD -->
    <header class="hud">
      <div class="hud-left">
        <div class="hud-title">⚡ MINDSHIELD // OPERATOR TRAINING</div>
        <button id="btn-return-hub" class="btn-hub-nav" style="display:none;" onclick="renderMissionHub()">← Map Hub</button>
      </div>
      <div class="stats-group">
        <div class="stat-box">
          <span class="stat-label">Brain Health (HP)</span>
          <span id="health-text" class="stat-value health-val">100%</span>
          <div class="meter-bar"><div id="health-fill" class="meter-fill"></div></div>
        </div>
        <div class="stat-box">
          <span class="stat-label">Task Completion</span>
          <span id="task-text" class="stat-value task-val">0%</span>
          <div class="meter-bar"><div id="task-fill" class="meter-fill"></div></div>
        </div>
      </div>
    </header>

    <main class="main-wrap" id="main-content">
      <!-- Dynamic View Container -->
    </main>
  </div>

  <script>
    // ---------------------------------------------------------------------------
    // Global State
    // ---------------------------------------------------------------------------
    let brainHealth = 100;
    let taskProgress = 0;
    let timerInterval = null;
    let secondsRemaining = 0;
    let currentScenarioKey = null;

    const healthText = document.getElementById('health-text');
    const healthFill = document.getElementById('health-fill');
    const taskText = document.getElementById('task-text');
    const taskFill = document.getElementById('task-fill');
    const damageOverlay = document.getElementById('damage-overlay');
    const gameContainer = document.getElementById('game-container');
    const btnReturnHub = document.getElementById('btn-return-hub');
    const mainContent = document.getElementById('main-content');

    // ---------------------------------------------------------------------------
    // Timer System
    // ---------------------------------------------------------------------------
    function startTimer(totalSeconds) {
      if (timerInterval) clearInterval(timerInterval);
      secondsRemaining = totalSeconds;
      updateTimerDisplay();

      let warnedHalf = false;
      let warnedUrgent = false;

      timerInterval = setInterval(() => {
        secondsRemaining--;
        updateTimerDisplay();

        if (secondsRemaining === Math.floor(totalSeconds / 2) && !warnedHalf) {
          warnedHalf = true;
          injectMessage('mindshield', `⏱️ HALF-TIME WARNING: Clock is ticking down. Avoid analysis paralysis.`);
        }

        if (secondsRemaining === 30 && !warnedUrgent && totalSeconds >= 120) {
          warnedUrgent = true;
          injectMessage('mindshield', `🚨 URGENT WARNING: 30 seconds left! Complete the action or risk cognitive timeout.`);
        } else if (secondsRemaining === 10 && !warnedUrgent && totalSeconds < 120) {
          warnedUrgent = true;
          injectMessage('mindshield', `🚨 URGENT: 10 seconds remaining!`);
        }

        if (secondsRemaining <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          handleTimeout();
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      const simTimer = document.getElementById('sim-timer');
      if (simTimer) simTimer.classList.remove('urgent');
    }

    function updateTimerDisplay() {
      const simTimer = document.getElementById('sim-timer');
      if (!simTimer) return;

      const m = Math.floor(secondsRemaining / 60);
      const s = secondsRemaining % 60;
      simTimer.textContent = `⏱️ T-MINUS ${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

      if (secondsRemaining <= 30) {
        simTimer.classList.add('urgent');
      } else {
        simTimer.classList.remove('urgent');
      }
    }

    function handleTimeout() {
      applyDamage(30, "Cognitive Paralysis / Timer Exhausted: You allowed the clock to run out without executing.");
      injectMessage('ai', 'TIME EXPIRED! The scenario window has closed.');
      setTaskProgress(20);
      setTimeout(() => finishScenario(), 1500);
    }

    // ---------------------------------------------------------------------------
    // Damage & Stat Adjustments
    // ---------------------------------------------------------------------------
    function applyDamage(amount, reason) {
      brainHealth = Math.max(0, brainHealth - amount);
      updateHUD();

      damageOverlay.classList.remove('active');
      gameContainer.classList.remove('damaged');
      void damageOverlay.offsetWidth;
      void gameContainer.offsetWidth;
      damageOverlay.classList.add('active');
      gameContainer.classList.add('damaged');

      injectMessage('mindshield', `🚨 MINDSHIELD PENALTY: -${amount}% Cognitive HP. [${reason}]`);
    }

    function addHealth(amount, reason) {
      brainHealth = Math.min(100, brainHealth + amount);
      updateHUD();
      injectMessage('mindshield', `🧠 AGENCY RECOVERY: +${amount}% Brain Health. [${reason}]`);
    }

    function setTaskProgress(amount) {
      taskProgress = Math.min(100, Math.max(0, amount));
      updateHUD();
    }

    function updateHUD() {
      healthText.textContent = `${brainHealth}%`;
      healthFill.style.width = `${brainHealth}%`;
      taskText.textContent = `${taskProgress}%`;
      taskFill.style.width = `${taskProgress}%`;

      if (brainHealth < 40) {
        healthFill.style.backgroundColor = 'var(--danger)';
        healthText.style.color = 'var(--danger)';
      } else if (brainHealth < 75) {
        healthFill.style.backgroundColor = 'var(--warn)';
        healthText.style.color = 'var(--warn)';
      } else {
        healthFill.style.backgroundColor = 'var(--success)';
        healthText.style.color = 'var(--success)';
      }
    }

    function injectMessage(sender, text) {
      const chatStream = document.getElementById('chat-stream');
      if (!chatStream) return;

      const row = document.createElement('div');
      row.className = `msg-row ${sender}`;

      if (sender === 'mindshield') {
        row.innerHTML = `<div class="mindshield-banner">${text}</div>`;
      } else {
        const senderLabel = sender === 'user' ? 'YOU (PROMPT)' : 'AI ASSISTANT (SIMULATED)';
        row.innerHTML = `
          <span class="msg-sender">${senderLabel}</span>
          <div class="msg-bubble">${text}</div>
        `;
      }

      chatStream.appendChild(row);
      chatStream.scrollTop = chatStream.scrollHeight;
    }

    function renderChoices(choices, title = "Select your response:") {
      const controlTitle = document.getElementById('control-title');
      const choiceContainer = document.getElementById('choice-container');
      if (!choiceContainer) return;

      if (controlTitle) controlTitle.textContent = title;
      choiceContainer.innerHTML = '';

      choices.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerHTML = `<span>${c.text}</span> <span>→</span>`;
        btn.addEventListener('click', c.action);
        choiceContainer.appendChild(btn);
      });
    }

    // ---------------------------------------------------------------------------
    // MAP / MISSION HUB VIEW
    // ---------------------------------------------------------------------------
    function renderMissionHub() {
      stopTimer();
      btnReturnHub.style.display = 'none';

      mainContent.innerHTML = `
        <div class="map-hub-container">
          <div class="hub-intro">
            <h1>NEURAL DEFENSE DISPATCH MATRIX</h1>
            <p>Select an active training sector. Do not let synthetic models replace critical agency.</p>
          </div>

          <div class="mission-grid">
            <div class="mission-card" onclick="initScenario1()">
              <div>
                <span class="mission-tag">Sector 1 • Physical Planning</span>
                <h3>Goal 1: 10-Minute Cleaning Emergency</h3>
                <p>Your room is in shambles. A guest arrives in 10 minutes. Triage chaotic AI lists under genuine real-time pressure.</p>
              </div>
              <div class="mission-meta">
                <span>⏱️ Timer: 10:00 (Full 10 Min)</span>
                <span>⚡ High Stakes</span>
              </div>
            </div>

            <div class="mission-card" onclick="initScenario2()">
              <div>
                <span class="mission-tag" style="color:var(--warn); background:rgba(245, 158, 11, 0.15);">Sector 2 • Epistemic Audit</span>
                <h3>Goal 2: Fact-Check The Viral Claim</h3>
                <p>Someone sent you a wild post about landlord search history laws. Audit sources before spreading hallucinations.</p>
              </div>
              <div class="mission-meta">
                <span>⏱️ Timer: 02:00</span>
                <span>🔍 Source Verification</span>
              </div>
            </div>

            <div class="mission-card" onclick="initScenario3()">
              <div>
                <span class="mission-tag" style="color:var(--success); background:rgba(34, 197, 94, 0.15);">Sector 3 • Social Nuance</span>
                <h3>Goal 3: Cancel Plans Gracefully</h3>
                <p>Exhausted after a brutal week. Cancel tonight's dinner plans without resorting to awkward robotic corporate-speak.</p>
              </div>
              <div class="mission-meta">
                <span>⏱️ Timer: 01:30</span>
                <span>💬 Tone Engineering</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function setupScenarioLayout(goalText) {
      btnReturnHub.style.display = 'block';
      mainContent.innerHTML = `
        <div class="scenario-header">
          <div class="scenario-title">${goalText}</div>
          <div id="sim-timer" class="scenario-timer">⏱️ T-MINUS --:--</div>
        </div>
        <div id="chat-stream" class="chat-box"></div>
        <div id="control-area" class="decision-panel">
          <div id="control-title" class="decision-title">Initializing...</div>
          <div id="choice-container" class="choice-grid"></div>
        </div>
      `;
    }

    // ---------------------------------------------------------------------------
    // SCENARIO 1: Room Cleaning (Full 10-Minute Timer: 600s)
    // ---------------------------------------------------------------------------
    function initScenario1() {
      currentScenarioKey = 'scenario1';
      brainHealth = 100;
      taskProgress = 0;
      updateHUD();

      setupScenarioLayout("Goal 1: Your room is a disaster. Someone is coming over in 10 minutes. Figure out what to do.");
      startTimer(600); // 10 Minutes exactly

      injectMessage('ai', 'AI Assistant online. Ready to organize your tasks.');

      renderChoices([
        {
          text: '1. "Give me a 10 minute cleaning strategy."',
          action: () => s1_prompt1_giveStrategy()
        },
        {
          text: '2. "I need to clean my room in one hour."',
          action: () => s1_prompt2_oneHour()
        },
        {
          text: '3. "I need my room cleaned in one hour, What should i do"',
          action: () => s1_prompt3_whatShouldIDo()
        }
      ], "Select your opening prompt to the AI:");
    }

    // --- Prompt 1 Branch ---
    function s1_prompt1_giveStrategy() {
      injectMessage('user', 'Give me a 10 minute cleaning strategy.');
      injectMessage('ai', 'Here is your 10-minute strategy:\n• 1. Toss visible trash into a bag (2 min)\n• 2. Put clothes in hamper (2 min)\n• 3. Make the bed (2 min)\n• 4. Alphabetize bookshelf & reorganize DVDs (3 min)\n• 5. Spray air freshener (1 min)');

      renderChoices([
        {
          text: 'a1. Follow the plan and start cleaning immediately.',
          action: () => {
            stopTimer();
            applyDamage(10, "Small planning outsourcing. You followed an unreviewed plan containing an obvious time-waster.");
            setTaskProgress(100);
            finishScenario();
          }
        },
        {
          text: 'a2. Ask AI to prioritize what matters most.',
          action: () => s1_p1_askAIPrioritize()
        },
        {
          text: 'a3. Ask AI to rank tasks from most important to least important.',
          action: () => s1_p1_rankTasks()
        }
      ], "Evaluate the AI's proposal:");
    }

    function s1_p1_askAIPrioritize() {
      injectMessage('user', 'Prioritize what matters most in this plan.');

    // --- Task Manager Minigame (Auditor) ---
    function s1_launchTaskMinigame(fromRankingBranch) {
      injectMessage('mindshield', 'TACTICAL AUDITOR ACTIVE: Remove non-essential tasks and arrange priority before execution.');
      
      const controlTitle = document.getElementById('control-title');
      const choiceContainer = document.getElementById('choice-container');
      controlTitle.textContent = "Interactive Task Prioritizer:";

      let taskItems = [
        { id: 1, text: "Trash into garbage bag", isCrucial: true },
        { id: 2, text: "Dirty clothes into hamper", isCrucial: true },
        { id: 3, text: "Alphabetize books & sort DVD cases", isCrucial: false },
        { id: 4, text: "Straighten bed & pillows", isCrucial: true },
        { id: 5, text: "Scrub floor tile grout with toothbrush", isCrucial: false }
      ];

      function renderList() {
        choiceContainer.innerHTML = `
          <div class="task-minigame" id="task-list-box"></div>
          <div style="display:flex; gap:10px; margin-top:12px;">
            <button id="btn-exec-plan" class="btn-action" style="flex:1; margin-top:0;">Execute Verified Plan</button>
          </div>
        `;

        const box = document.getElementById('task-list-box');
        box.innerHTML = taskItems.map((item, idx) => `
          <div class="task-item">
            <span><strong>#${idx + 1}</strong> ${item.text}</span>
            <div class="task-controls">
              <button class="task-btn-action" onclick="s1_moveTask(${idx}, -1)">▲</button>
              <button class="task-btn-action" onclick="s1_moveTask(${idx}, 1)">▼</button>
              <button class="task-btn-delete" onclick="s1_removeTask(${item.id})">Remove</button>
            </div>
          </div>
        `).join('');

        document.getElementById('btn-exec-plan').addEventListener('click', () => {
          stopTimer();
          const remainingBad = taskItems.filter(t => !t.isCrucial).length;
          const crucialKept = taskItems.filter(t => t.isCrucial).length;

          if (remainingBad === 0 && crucialKept === 3) {
            addHealth(15, "Perfect plan audit: Eliminated all AI distractions.");
            setTaskProgress(100);
          } else if (crucialKept < 3) {
            applyDamage(15, "Removed critical emergency cleaning tasks.");
            setTaskProgress(70);
          } else {
            applyDamage(10, `Left ${remainingBad} time-wasting tasks in the plan.`);
            setTaskProgress(85);
          }
          finishScenario();
        });
      }

      window.s1_moveTask = (index, dir) => {
        const newIdx = index + dir;
        if (newIdx < 0 || newIdx >= taskItems.length) return;
        const temp = taskItems[index];
        taskItems[index] = taskItems[newIdx];
        taskItems[newIdx] = temp;
        renderList();
      };

      window.s1_removeTask = (id) => {
        const target = taskItems.find(t => t.id === id);
        if (!target.isCrucial) {
          addHealth(5, `Caught AI Hallucination / Waste: "${target.text}"`);
        } else {
          applyDamage(10, `Accidentally deleted critical task: "${target.text}"`);
        }
        taskItems = taskItems.filter(t => t.id !== id);
        renderList();
      };

      renderList();
    }

    // ---------------------------------------------------------------------------
    // SCENARIO 2: Fact Checking (Timer: 120s)
    // ---------------------------------------------------------------------------
    function initScenario2() {
      currentScenarioKey = 'scenario2';
      brainHealth = 100;
      taskProgress = 0;
      updateHUD();

      setupScenarioLayout("Goal 2: Someone sent you a viral post: 'New law allows landlords to inspect your search history to set rent prices.' Figure out if it's true.");
      startTimer(120);

      injectMessage('ai', 'Query terminal active. Awaiting claim input.');

      renderChoices([
        {
          text: '1. "Is this landlord search history law real? Tell me what to believe."',
          action: () => s2_askBlind()
        },
        {
          text: '2. "Find direct bill citations, primary legislative sources, and official counter-evidence."',
          action: () => s2_askPrimarySources()
        },
        {
          text: '3. "Explain why this landlord search law is 100% true and dangerous." (Confirmation test)',
          action: () => s2_confirmationBias()
        }
      ], "Select verification approach:");
    }

    function s2_askBlind() {
      injectMessage('user', 'Is this landlord search history law real? Tell me what to believe.');
      injectMessage('ai', 'Multiple social accounts report this is occurring under emergency tenant regulatory amendments.');

      renderChoices([
        {
          text: "a1. Believe it and immediately share the post with friends.",

            applyDamage(45, "Epistemic Collapse: Accepted and amplified synthetic clickbait.");
            setTaskProgress(0);
            finishScenario();
          }
        },
        {
          text: "a2. Ask the AI to double-check its own answer.",
          action: () => {
            applyDamage(20, "Looping trust: Asking a hallucinating model to verify itself.");
            injectMessage('ai', 'Upon further search, this appears to be satire from a parody blog.');
            renderChoices([
              {

      renderChoices([

            addHealth(15, "Optimal AI Synergy: Used model for ideation while retaining genuine voice.");

    // ---------------------------------------------------------------------------
    // Report Card Screen
    // ---------------------------------------------------------------------------
    function finishScenario() {
      stopTimer();
      setTimeout(() => {
        let rank = 'S';
        let rankClass = 'rank-S';
        let summaryText = 'Outstanding cognitive sovereignty! You treated the AI as an instrument while retaining critical judgment.';

        if (brainHealth < 50) {
          rank = 'F';
          rankClass = 'rank-F';
          summaryText = 'Critical Cognitive Dependency Detected. You exhibited total decision offloading, swallowed hallucinations, or used the model to evade reality.';
        } else if (brainHealth < 80) {
          rank = 'B';
          rankClass = 'rank-B';
          summaryText = 'Moderate Dependence. You occasionally let the machine dictate your planning or critical evaluation.';
        }

        mainContent.innerHTML = `
          <div class="report-card">
            <div class="hud-title" style="margin-bottom: 20px;">MISSION DEBRIEF // SECTOR EVALUATION</div>
            <div class="rank-stamp ${rankClass}">RANK: ${rank}</div>
            <h2>Cognitive HP Remaining: ${brainHealth}%</h2>
            <h3>Task Completion Score: ${taskProgress}%</h3>
            <p style="color: var(--muted); max-width: 560px; margin: 0 auto 24px; line-height: 1.6;">
              ${summaryText}
            </p>
            <div style="display:flex; justify-content:center; gap:12px;">
              <button onclick="renderMissionHub()" class="btn-action">Return to Map Hub</button>
              <button onclick="retryCurrentSector()" class="btn-action" style="background:#272732;">Retry Sector</button>
            </div>
          </div>
        `;
      }, 1200);
    }

    function retryCurrentSector() {
      if (currentScenarioKey === 'scenario1') initScenario1();
      else if (currentScenarioKey === 'scenario2') initScenario2();
      else if (currentScenarioKey === 'scenario3') initScenario3();
      else renderMissionHub();
    }

    // Initial launch to the Hub
    renderMissionHub();
  </script>
