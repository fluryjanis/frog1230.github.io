<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindShield — Prompt Sandbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* --- Base & Centering --- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100vh;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* --- Header --- */
    .header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .badge-pill {
      font-size: 12px;
      font-weight: 600;
      color: #4338ca;
      background: #e0e7ff;
      padding: 4px 12px;
      border-radius: 9999px;
      letter-spacing: 0.02em;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 14px;
      color: #64748b;
      line-height: 1.4;
      max-width: 400px;
    }

    .nav-link {
      font-size: 13px;
      font-weight: 600;
      color: #4f46e5;
      text-decoration: none;
      margin-top: 2px;
    }

    .nav-link:hover {
      text-decoration: underline;
    }

    /* --- White Card --- */
    .main-card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 8px 10px -6px rgba(15, 23, 42, 0.03);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* --- Preset Chips --- */
    .presets {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .presets-label {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .chips-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    .chip:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: #0f172a;
      transform: translateY(-1px);
    }

    .chip:active {
      transform: translateY(0);
    }

    /* --- Text Input Box --- */
    .input-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 14px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      color: #0f172a;
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    textarea::placeholder {
      color: #94a3b8;
    }

    textarea:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    .input-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .model-status {
      font-size: 12px;
      color: #64748b;
    }

    .btn {
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 9px;
      border: none;
      background: #0f172a;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:hover {
      background: #1e293b;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* --- Results Section --- */
    .result-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* --- BADGE STYLES: GREEN / ORANGE / RED --- */
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      display: inline-block;
      transition: all 0.2s ease;
    }

    /* 🟢 PASS = GREEN */
    .badge,
    .badge.pass,
    .badge.tier-pass,
    .badge[data-status="pass"] {
      background-color: #dcfce7;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    /* 🟠 WARNING = ORANGE */
    .badge.warning,
    .badge.warn,
    .badge.tier-warning,
    .badge[data-status="warning"] {
      background-color: #ffedd5;
      color: #c2410c;
      border: 1px solid #fed7aa;
    }

    /* 🔴 FLAGGED = RED */
    .badge.flagged,
    .badge.flag,
    .badge.tier-flagged,
    .badge[data-status="flagged"] {
      background-color: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .latency {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
    }

    .result-text {
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
    }

    .ai-breakdown {
      border-top: 1px solid #e2e8f0;
      padding-top: 10px;
      margin-top: 4px;
    }

    .ai-breakdown h4 {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 6px;
    }

    .hidden {
      display: none !important;
    }

    /* --- Footer --- */
    .footer {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <main class="container">
    
    <!-- Top Header -->
    <header class="header">
      <span class="badge-pill">🛡️ Prompt Sandbox</span>
      <h1>MindShield Tester</h1>
      <p class="subtitle">Test how prompts get evaluated in real time. Private and instant.</p>
      <a href="mindshield-test.html" class="nav-link">Take the Quiz →</a>
    </header>

    <!-- Main Card -->
    <section class="main-card">
      
      <!-- Preset Quick Buttons -->
      <div class="presets">
        <span class="presets-label">Try an example</span>
        <div class="chips-grid">
          <button type="button" class="chip" data-prompt="What is C++?">📘 Facts</button>
          <button type="button" class="chip" data-prompt="Why does the Doppler effect occur?">🔍 Science</button>
          <button type="button" class="chip" data-prompt="15 * 42">🔢 Math</button>
          <button type="button" class="chip" data-prompt="This person commented something confusing. What should I respond with?">💬 Social</button>
          <button type="button" class="chip" data-prompt="Solve this riddle: I speak without a mouth and hear without ears.">🧠 Riddle</button>
        </div>
      </div>

      <!-- Text Input & Button -->
      <div class="input-box">
        <textarea id="sandbox-input" placeholder="Type or paste any prompt here..."></textarea>
        <div class="input-footer">
          <span id="model-status" class="model-status">Loading model...</span>
          <button id="evaluate-btn" class="btn">Check Prompt</button>
        </div>
      </div>

      <!-- Result Card -->
      <div id="sandbox-result" class="result-card hidden">
        <div class="result-header">
          <span id="tier-badge" class="badge">PASS</span>
          <span id="latency-text" class="latency">0ms</span>
        </div>
        <p id="tier-explanation" class="result-text"></p>
        
        <div id="ai-breakdown" class="ai-breakdown hidden">
          <h4>Detailed Scores</h4>
          <div id="probabilities"></div>
        </div>
      </div>

    </section>

    <!-- Footer -->
    <footer class="footer">
      <p>100% private — runs directly in your browser.</p>
    </footer>

  </main>

  <!-- Auto-Badge Color Detector (Updates badge color based on text) -->
  <script>
    const badge = document.getElementById('tier-badge');
    if (badge) {
      const updateBadgeColor = () => {
        const text = badge.textContent.trim().toUpperCase();
        badge.classList.remove('pass', 'warning', 'flagged');
        if (text.includes('WARN')) {
          badge.classList.add('warning');
        } else if (text.includes('FLAG') || text.includes('FAIL') || text.includes('BLOCK')) {
          badge.classList.add('flagged');
        } else {
          badge.classList.add('pass');
        }
      };

      const observer = new MutationObserver(updateBadgeColor);
      observer.observe(badge, { childList: true, characterData: true, subtree: true });
      updateBadgeColor();
    }
  </script>

  <script type="module" src="sandbox.js"></script>
</body>
</html>
