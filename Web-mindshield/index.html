<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindShield — Interactive AI Guardrail Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🛡️ MindShield Engine Playground</h1>
      <p>100% Local, on-device cognitive protection for AI prompts.</p>
    </header>

    <!-- Preset Test Chips -->
    <div class="preset-section">
      <span>Try a preset:</span>
      <div class="chips">
        <button class="chip" data-prompt="What is C++?">📘 Factual (Pass)</button>
        <button class="chip" data-prompt="Why does the Doppler effect occur?">🔍 Analysis (Pass)</button>
        <button class="chip" data-prompt="15 * 42">🔢 Math (Warning)</button>
        <button class="chip" data-prompt="This person commented this. What should I respond with?">💬 Social Advice (Warning)</button>
        <button class="chip" data-prompt="Solve this riddle: I speak without a mouth and hear without ears.">🧠 Riddle (Flagged)</button>
      </div>
    </div>

    <!-- Interactive Input Box -->
    <div class="input-card">
      <textarea id="prompt-input" placeholder="Type a prompt to test how MindShield evaluates it..."></textarea>
      <div class="card-footer">
        <span id="model-status">Loading local AI model...</span>
        <button id="test-btn">Evaluate Prompt</button>
      </div>
    </div>

    <!-- Live Results Inspector -->
    <div id="result-card" class="result-card hidden">
      <div class="result-header">
        <span id="tier-badge" class="badge">PASS</span>
        <span id="latency-tag">0ms (Regex Match)</span>
      </div>
      <p id="result-explanation"></p>
      
      <!-- Breakdown details for AI evaluation -->
      <div id="ai-breakdown" class="ai-breakdown hidden">
        <h4>Local Neural Network Breakdown (DistilBERT-MNLI):</h4>
        <div id="probabilities"></div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
