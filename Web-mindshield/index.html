<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindShield — Prompt Sandbox</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-container">
    
    <!-- Top Header -->
    <header class="header">
      <span class="badge-pill">🛡️ Prompt Checker</span>
      <h1>MindShield Sandbox</h1>
      <p class="subtitle">Test how prompts get checked in real time — 100% private in your browser.</p>
      <a href="mindshield-test.html" class="top-link">Take the Quiz →</a>
    </header>

    <!-- Main Card -->
    <section class="card">
      
      <!-- Preset Quick Examples -->
      <div class="preset-group">
        <label class="section-label">Try an example:</label>
        <div class="chips">
          <button type="button" class="chip" data-prompt="What is C++?">📘 Facts</button>
          <button type="button" class="chip" data-prompt="Why does the Doppler effect occur?">🔍 Science</button>
          <button type="button" class="chip" data-prompt="15 * 42">🔢 Math</button>
          <button type="button" class="chip" data-prompt="This person commented something confusing. What should I respond with?">💬 Social Reply</button>
          <button type="button" class="chip" data-prompt="Solve this riddle: I speak without a mouth and hear without ears.">🧠 Riddle</button>
        </div>
      </div>

      <!-- Input Area -->
      <div class="input-wrapper">
        <textarea id="sandbox-input" placeholder="Type or paste any prompt here..."></textarea>
        <div class="card-action-bar">
          <span id="model-status" class="model-status">Loading model...</span>
          <button id="evaluate-btn" class="btn btn-primary">Check Prompt</button>
        </div>
      </div>

      <!-- Result Card -->
      <div id="sandbox-result" class="result-card hidden">
        <div class="result-header">
          <span id="tier-badge" class="badge">PASS</span>
          <span id="latency-text" class="latency">0ms</span>
        </div>
        <p id="tier-explanation" class="result-text"></p>
        
        <!-- Detailed Breakdown -->
        <div id="ai-breakdown" class="ai-breakdown hidden">
          <h4 class="breakdown-title">Detailed Scores</h4>
          <div id="probabilities"></div>
        </div>
      </div>

    </section>

    <!-- Footer -->
    <footer class="footer">
      <p>MindShield is free, private, and runs directly on your device.</p>
    </footer>

  </main>

  <script type="module" src="sandbox.js"></script>
</body>
</html>
